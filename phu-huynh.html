<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>VeduAI – Góc phụ huynh</title>
<style>
:root{--bg:#EAF5FF;--card:#fff;--ink:#24305E;--mut:#5F6B92;--line:#C9DAF2;--sh:#B5CBEA;--mark:#FFD84D;--ok:#118A62;--err:#C2255C;--warn:#B45309;--bar:#4C7BE0}
@media(prefers-color-scheme:dark){:root{--bg:#151B36;--card:#1F2850;--ink:#F1F4FF;--mut:#AAB4DC;--line:#38437A;--sh:#0E1328;--ok:#5FE0B0;--err:#FF9BB5;--warn:#FBBF5C;--bar:#7FA2FF}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0) 14px calc(20px + env(safe-area-inset-bottom,0))}
main{max-width:560px;margin:0 auto;padding:18px 0}h1{font-size:22px;margin:0 0 2px}h2{font-size:17px;margin:0 0 6px}.m{color:var(--mut);font-size:14px}
.c{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--sh);padding:14px;margin:0 0 14px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}.st .c{margin:0;text-align:center;padding:12px 8px}.st b{display:block;font:800 26px system-ui}
.row{border-top:1px solid var(--line);padding:10px 0}.row:first-of-type{border-top:0}.rt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sc{font:800 20px system-ui;white-space:nowrap}.bar{height:8px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bar);border-radius:99px}
.wait{color:var(--warn);font-weight:700}.err{color:var(--err);font-weight:700}details{margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:14px}details p{margin:6px 0 0;white-space:pre-wrap;font-size:15px}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--card);font:800 16px system-ui;text-decoration:none;border:0;cursor:pointer}
a{color:var(--ink);font-weight:800}.ct{text-align:center;padding:40px 10px}.big{font-size:60px}
.vf{max-width:560px;margin:6px auto 0;padding:10px 8px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--mut)}.vf a{color:inherit}
/* ===== v6: rê chuột vào nhân vật -> giơ tay chào / mắt long lanh ===== */
.mascot{cursor:pointer}
.fx-owl{position:fixed;right:14px;bottom:14px;z-index:40;font-size:38px;line-height:1;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:var(--card,#fff);border:2px solid var(--line,#C9DAF2);box-shadow:0 4px 0 var(--sh,var(--shadow,#B5CBEA));cursor:pointer;user-select:none}
.fx-owl.up{bottom:88px}
.fx-rock{display:inline-block;transform-origin:50% 90%;animation:fxrock .5s ease-in-out 4 alternate both}
@keyframes fxrock{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.fx-glow{display:inline-block;animation:fxglow .55s ease-in-out 4 alternate both}
@keyframes fxglow{from{transform:scale(1);filter:drop-shadow(0 0 0 #FFD84D)}to{transform:scale(1.16);filter:drop-shadow(0 0 10px #FFC400) brightness(1.12)}}
.fx-say{position:fixed;z-index:9999;pointer-events:none;white-space:nowrap;background:var(--card,#fff);color:var(--ink,var(--text,#24305E));border:2px solid var(--line,#C9DAF2);border-radius:14px;padding:4px 12px;font:800 14px/1.3 system-ui,sans-serif;box-shadow:0 3px 0 var(--sh,var(--shadow,#B5CBEA));transform:translate(-50%,-100%);animation:fxsay 2.4s ease-out forwards}
@keyframes fxsay{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-115%)}}
.fx-p{position:fixed;z-index:9999;pointer-events:none;font-style:normal;line-height:1;transform:translate(-50%,-50%);animation:fxp 1.5s ease-out forwards}
@keyframes fxp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 70px)) scale(1.15) rotate(var(--r))}}
.fx-hand{animation:fxhand .45s ease-in-out 5 alternate both;transform-origin:70% 90%}
@keyframes fxhand{from{transform:translate(-50%,-50%) rotate(-22deg)}to{transform:translate(-50%,-50%) rotate(26deg)}}
@media(prefers-reduced-motion:reduce){.fx-rock,.fx-glow,.fx-hand,.fx-p{animation:none}.fx-say{animation:none;opacity:1}}

/* ===== v7: nhân vật hoạt hình chibi (rê chuột -> chào / mắt long lanh) ===== */
.cast{position:relative;display:inline-block;flex:none;width:84px;line-height:0}
.cast.fl{position:fixed;right:10px;bottom:6px;width:72px;z-index:40}
.cast.fl.up{bottom:84px}
.cast svg.cs{display:block;width:100%;height:auto;cursor:pointer;overflow:visible;touch-action:manipulation;-webkit-tap-highlight-color:transparent;animation:csbob 3.4s ease-in-out infinite}
.cast svg.cs:focus{outline:none}.cast svg.cs:focus-visible{outline:3px solid #14C7D8;outline-offset:3px;border-radius:12px}
@keyframes csbob{50%{transform:translateY(-5px)}}
.cast .eyes{transform-box:fill-box;transform-origin:center;animation:csblink 4.5s infinite}
@keyframes csblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.cast .stw{transform-box:fill-box;transform-origin:center;animation:cstw 2s ease-in-out infinite}
@keyframes cstw{0%,100%{transform:scale(.5) rotate(0);opacity:.5}50%{transform:scale(1.25) rotate(45deg);opacity:1}}
.cast .fxarm{transform-box:view-box;transform-origin:148px 170px;animation:csarm .5s ease-in-out 5 alternate both}
@keyframes csarm{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
.cast .fxarc{animation:csarc .5s ease-in-out 5 alternate both}
@keyframes csarc{from{opacity:.2}to{opacity:1}}
.cast .fxeye{transform-box:fill-box;transform-origin:center;animation:cseye .6s ease-in-out 4 alternate both}
@keyframes cseye{from{transform:scale(.94)}to{transform:scale(1.1)}}
.cast .fxglint{transform-box:fill-box;transform-origin:center;animation:csgl .5s ease-in-out infinite alternate}
@keyframes csgl{from{transform:scale(.55) rotate(0);opacity:.55}to{transform:scale(1.25) rotate(40deg);opacity:1}}
.cast .csay{position:absolute;z-index:30;pointer-events:none;white-space:nowrap;line-height:1.3;background:var(--card,#fff);color:var(--ink,var(--text,#24305E));border:2px solid var(--line,#C9DAF2);border-radius:14px;padding:4px 12px;font:800 13.5px/1.3 system-ui,sans-serif;box-shadow:0 3px 0 var(--sh,var(--shadow,#B5CBEA));left:50%;top:-4px;transform:translate(-50%,-100%);animation:cssay 2.4s ease-out forwards}
.cast.fl .csay{left:auto;right:0;transform:translate(0,-100%);animation-name:cssayr}
@keyframes cssay{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-115%)}}
@keyframes cssayr{0%{opacity:0;transform:translate(0,-70%) scale(.6)}12%{opacity:1;transform:translate(0,-100%) scale(1.08)}20%{transform:translate(0,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(0,-115%)}}
.cast .cup{position:absolute;z-index:30;pointer-events:none;font-style:normal;line-height:1;transform:translate(-50%,-50%);animation:csup 1.5s ease-out forwards}
@keyframes csup{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 70px)) scale(1.15) rotate(var(--r))}}
@media(max-width:480px){.cast.fl{width:58px}.cast.fl.up{bottom:80px}}
@media(prefers-reduced-motion:reduce){.cast svg.cs,.cast .eyes,.cast .stw,.cast .fxarm,.cast .fxarc,.cast .fxeye,.cast .fxglint,.cast .cup{animation:none}.cast .csay{animation:none;opacity:1}}
</style></head>

<script>
const API='https://devotee-outclass-couch.ngrok-free.dev/webhook',H={'ngrok-skip-browser-warning':'1','Content-Type':'application/json'};
const $=document.getElementById('app'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=(new URLSearchParams(location.search).get('p')||'').replace(/[^A-Za-z0-9]/g,'');
const fmt=n=>String(n).replace('.',',');
const st=(i,t,s)=>{$.innerHTML=`<div class="ct"><div class="big">${i}</div><h1>${esc(t)}</h1><p class="m">${esc(s||'')}</p></div>`};
async function load(){
 if(!p)return st('🔍','Link chưa đúng','Phụ huynh vui lòng mở lại đường link do con hoặc thầy/cô gửi.');
 let j;try{j=await (await fetch(API+'/ph-xem',{method:'POST',headers:H,body:JSON.stringify({p})})).json()}catch(e){return st('📡','Không kết nối được','Kiểm tra mạng rồi tải lại trang.')}
 if(!j.ok)return st('🔍',j.loi||'Không tìm thấy thông tin','Link có thể đã bị sai hoặc đã bị thu hồi.');
 ve(j)}
function ve(j){const h=j.hs,n=j.nop||[],xong=n.filter(x=>x.toi_da);
 const tb=xong.length?Math.round(xong.reduce((s,x)=>s+x.diem10,0)/xong.length*10)/10:null;
 $.innerHTML=`<h1>Kết quả học tập của ${esc(h.ten)}</h1><span class="m">Lớp ${esc(h.lop)} · ${esc(h.truong)}</span>
 <div class="st"><div class="c"><b>${n.length}</b><span class="m">bài đã làm</span></div><div class="c"><b>${tb==null?'–':fmt(tb)}</b><span class="m">điểm trung bình (thang 10)</span></div></div>
 <div class="c"><h2>📚 Các bài đã làm</h2>${n.map(x=>{const d=x.toi_da?Math.max(0,Math.min(100,Math.round(x.diem/x.toi_da*100))):0;
  return `<div class="row"><div class="rt"><div><b>${esc(x.tieu_de)}</b><br><span class="m">${esc([x.mon,x.gv&&'GV '+x.gv,String(x.ngay_nop||'').split('-').reverse().join('/')].filter(Boolean).join(' · '))}</span>${x.trang_thai==='cho_giao_vien'?'<br><span class="wait">⏳ Còn câu chờ thầy/cô chấm</span>':''}</div><span class="sc">${fmt(x.diem)}/${x.toi_da}</span></div><div class="bar"><i style="width:${d}%"></i></div>${x.nhan_xet?`<details><summary>Nhận xét</summary><p>${esc(x.nhan_xet)}</p></details>`:''}</div>`}).join('')||'<p class="m">Con chưa làm bài nào. Khi con nộp bài, kết quả sẽ hiện ở đây.</p>'}</div>
 <div class="c"><h2>🔔 Nhận kết quả tự động qua Telegram</h2><ol class="m" style="margin:0 0 12px;padding-left:20px"><li>Bấm nút bên dưới. Không cần nhập mã học sinh hay ID Telegram, hệ thống tự nhận ra con của phụ huynh.</li><li>Telegram mở ra, bấm <b>Bắt đầu (Start)</b>.</li><li>Từ đó mỗi khi con nộp bài, kết quả tự gửi về Telegram.</li></ol><a class="b" href="${esc(j.tg_url||'#')}">Nhận thông báo qua Telegram</a><p class="m" style="margin:12px 0 0">Chưa có Telegram? Phụ huynh cài ứng dụng Telegram, đăng nhập bằng số điện thoại, rồi quay lại trang này bấm nút một lần nữa. Không muốn dùng Telegram thì cứ lưu trang này (đánh dấu hoặc “Thêm vào màn hình chính”), mở xem lúc nào cũng được, không cần đăng nhập. Việc bấm nút đồng nghĩa phụ huynh đồng ý nhận thông báo, gõ /ngung để ngừng bất cứ lúc nào.${j.so_ph?' Hiện có '+j.so_ph+' phụ huynh đã đăng ký.':''}</p><button class="b" id="cp" type="button" style="margin-top:12px;background:var(--card);color:var(--ink);border:2px solid var(--line)">🔗 Sao chép link trang này</button><p class="m" id="cpm" style="margin:6px 0 0;font-weight:700"></p></div>
 <p class="m" style="text-align:center">Đây là đường link riêng của ${esc(h.ten)}. Phụ huynh vui lòng không đăng link này nơi công khai.</p>`}
document.addEventListener('click',async e=>{if(e.target.id!=='cp')return;const u=location.href,m=document.getElementById('cpm');
 try{await navigator.clipboard.writeText(u);m.textContent='✅ Đã sao chép link.'}catch(x){window.prompt('Sao chép link này:',u)}});
load();

<script>
/* v6: rê chuột (hoặc chạm) vào nhân vật -> luân phiên giơ tay chào / mắt long lanh */
(function(){
var SEL='.mascot,.big,.vq .vi,.fx-owl',FACE={'😊':'🤩','😢':'🥹','😃':'🤩','🙂':'🤩'};
var HI=['Xin chào! 👋','Chào bạn nhé! 👋','Mình là VeduAI nè! 👋','Hello! 👋'],WOW=['Long lanh quá! ✨','Học vui quá! 💖','Giỏi quá đi! ⭐','Cố lên nào! ✨'];
var next=new WeakMap(),busy=new WeakMap();
function pick(a){return a[Math.random()*a.length|0]}
function box(el){try{var r=document.createRange();r.selectNodeContents(el);var b=r.getBoundingClientRect();if(b.width&&b.height)return b}catch(e){}return el.getBoundingClientRect()}
function inside(e,b){return e.clientX>=b.left-6&&e.clientX<=b.right+6&&e.clientY>=b.top-6&&e.clientY<=b.bottom+6}
function say(b,t){var d=document.createElement('div');d.className='fx-say';d.setAttribute('aria-hidden','true');d.textContent=t;
 d.style.left=Math.min(Math.max(b.left+b.width/2,70),innerWidth-70)+'px';d.style.top=Math.max(b.top-4,34)+'px';document.body.appendChild(d);setTimeout(function(){d.remove()},2500)}
function rise(b,list,n){for(var i=0;i<n;i++)(function(i){var s=document.createElement('i');s.className='fx-p';s.setAttribute('aria-hidden','true');s.textContent=list[i%list.length];
 s.style.left=(b.left+b.width*(.1+Math.random()*.8))+'px';s.style.top=(b.top+b.height*(.2+Math.random()*.4))+'px';s.style.fontSize=(16+Math.random()*12)+'px';
 s.style.setProperty('--dx',((Math.random()-.5)*60)+'px');s.style.setProperty('--r',((Math.random()-.5)*50)+'deg');s.style.animationDelay=(i*.09)+'s';document.body.appendChild(s);setTimeout(function(){s.remove()},1900)})(i)}
function act(el){
 if(busy.get(el))return;busy.set(el,1);
 var mode=next.get(el)||(Math.random()<.5?'wave':'eyes');next.set(el,mode==='wave'?'eyes':'wave');
 var b=box(el),old=el.textContent,txt=old.trim(),done=[];
 if(mode==='wave'){
  el.classList.add('fx-rock');done.push(function(){el.classList.remove('fx-rock')});
  var h=document.createElement('i');h.className='fx-p fx-hand';h.setAttribute('aria-hidden','true');h.textContent='👋';
  h.style.left=(b.right+14)+'px';h.style.top=(b.top+b.height*.4)+'px';h.style.fontSize=Math.min(30,Math.max(22,b.height*.5))+'px';h.style.opacity=1;h.style.animationName='fxhand';
  document.body.appendChild(h);done.push(function(){h.remove()});
  say(b,pick(HI));rise(b,['✨'],3)}
 else{
  if(FACE[txt]&&el.children.length===0){el.textContent=FACE[txt];done.push(function(){if(el.isConnected)el.textContent=old})}
  el.classList.add('fx-glow');done.push(function(){el.classList.remove('fx-glow')});
  say(b,pick(WOW));rise(b,['✨','💖','⭐'],7)}
 setTimeout(function(){done.forEach(function(f){f()});busy.set(el,0)},2500)}
function hit(e){var t=e.target.closest&&e.target.closest(SEL);if(!t||busy.get(t))return;if(t.classList.contains('big')||t.classList.contains('vi')){if(!inside(e,box(t)))return}act(t)}
document.addEventListener('pointerover',hit);
document.addEventListener('click',hit);
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('fx-owl')){e.preventDefault();act(e.target)}});
})();
</script>
