<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mọt sách – Bi lớn lên</title>
<meta http-equiv="refresh" content="3;url=bi-lon-len.html">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body style="font-family:system-ui,sans-serif;text-align:center;padding:40px 16px">
<p>Đang chuyển sang <b>Bi lớn lên</b>…</p>
<p><a id="a" href="bi-lon-len.html">Bấm vào đây nếu trang không tự chuyển</a></p>
<script>
/* TRANG CHUYỂN HƯỚNG. Nội dung thật của "Bi lớn lên" nằm ở bi-lon-len.html (đã đổi tên từ index.html để khỏi nhầm với index.html
   của website veduai-vn.web.app). Giữ file này để địa chỉ gốc, Mini App Telegram và link cũ vẫn chạy: chuyển sang bi-lon-len.html
   và giữ nguyên ?t=, ?s=, ?thu=, #hash (và mã start_param của Telegram). KHÔNG xoá file này. */
(function(){
 var q=new URLSearchParams(location.search), TG=window.Telegram&&Telegram.WebApp;
 try{ if(!q.get('t')){ var sp=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param; if(sp) q.set('t',String(sp).replace(/[^A-Za-z0-9]/g,'')); } }catch(e){}
 var qs=q.toString(), url='bi-lon-len.html'+(qs?'?'+qs:'')+location.hash;
 document.getElementById('a').href=url;
 location.replace(url);
})();
</script>
</body></html>
