<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Mọt sách – Phụ huynh: môn học & báo cáo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#EAF5FF;--card:#fff;--ink:#24305E;--mut:#5F6B92;--line:#C9DAF2;--sh:#B5CBEA;--mark:#FFD84D;--ok:#118A62;--err:#C2255C;--warn:#B45309;--bar:#4C7BE0}
@media(prefers-color-scheme:dark){:root{--bg:#151B36;--card:#1F2850;--ink:#F1F4FF;--mut:#AAB4DC;--line:#38437A;--sh:#0E1328;--ok:#5FE0B0;--err:#FF9BB5;--warn:#FBBF5C;--bar:#7FA2FF}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0) 14px calc(20px + env(safe-area-inset-bottom,0))}
main{max-width:560px;margin:0 auto;padding:18px 0}h1{font-size:22px;margin:0 0 2px}h2{font-size:17px;margin:0 0 8px}.m{color:var(--mut);font-size:14px}
.c{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--sh);padding:14px;margin:0 0 14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}.k b{display:block;font:800 22px system-ui}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bar);border-radius:99px}
.tabs{display:flex;gap:8px;margin:0 0 10px}.t,.b,.mv{appearance:none;font:700 15px system-ui;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.t[aria-pressed=true],.b.p{background:var(--ink);color:var(--card);border-color:var(--ink)}.b:disabled,.mv:disabled{opacity:.4;cursor:default}
.mon{border-top:1px solid var(--line);padding:10px 0}.mon:first-of-type{border-top:0}.r{display:flex;gap:8px;align-items:center;justify-content:space-between}.mv{min-width:44px;padding:0}
.tag{display:inline-block;font-size:12.5px;padding:1px 9px;border-radius:99px;background:var(--line);margin:4px 4px 0 0}.wait{color:var(--warn)}
input,select{width:100%;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:6px 10px}
.fx{display:grid;gap:8px;margin-top:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label.l{font-size:13.5px;color:var(--mut)}
#msg{position:sticky;bottom:8px;text-align:center;font-weight:700;min-height:22px}.ok{color:var(--ok)}.err{color:var(--err)}
.vf{max-width:560px;margin:6px auto 0;padding:10px 8px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--mut)}.vf a{color:inherit;font-weight:800}
</style><link rel="stylesheet" href="mot-sach.css?v=2">
</head>
<body class="ms">
<header class="ms-head"><div class="ms-hw"><span class="ms-logo"><img src="assets/logo-mark.png" alt=""><span>Mọt<b>sách</b></span></span></div></header>
<div class="ms-mate"><span class="mascot" aria-hidden="true"><svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><circle cx="100" cy="34" r="22" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><ellipse cx="100" cy="98" rx="66" ry="62" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><rect x="34" y="96" width="32" height="76" rx="16" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><rect x="134" y="96" width="32" height="76" rx="16" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><rect x="91" y="156" width="18" height="16" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path d="M56 170 Q100 150 144 170 L154 230 H46 Z" fill="#FF9EB5" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M78 163 L100 190 L122 163 Q100 154 78 163 Z" fill="#fff" stroke="#3B2A55" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="100" cy="108" rx="58" ry="54" fill="#FFE4D2" stroke="#3B2A55" stroke-width="3"/><g class="eyes"><ellipse cx="76" cy="112" rx="12" ry="15" fill="#6C4DB5"/><ellipse cx="76" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="71" cy="106" r="4.8" fill="#fff"/><circle cx="81" cy="120" r="2.4" fill="#fff"/><ellipse cx="124" cy="112" rx="12" ry="15" fill="#6C4DB5"/><ellipse cx="124" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="119" cy="106" r="4.8" fill="#fff"/><circle cx="129" cy="120" r="2.4" fill="#fff"/></g><path d="M60 103 Q76 91 92 103 M108 103 Q124 91 140 103" stroke="#3B2A55" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="57" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><ellipse cx="143" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><path d="M90 130 Q100 135 110 130 Q108 147 100 147 Q92 147 90 130Z" fill="#E8546E" stroke="#3B2A55" stroke-width="2.2" stroke-linejoin="round"/><path d="M94 141 Q100 138 106 141 Q103 145 100 145 Q97 145 94 141Z" fill="#FF9EB5"/><path d="M40 102 Q42 42 100 38 Q158 42 160 102 Q134 72 106 66 Q80 88 40 102 Z" fill="#7A4A36" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M62 54 Q82 44 104 46" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55" fill="none"/><circle cx="44" cy="132" r="4.5" fill="#FFC400" stroke="#3B2A55" stroke-width="1.5"/><circle cx="156" cy="132" r="4.5" fill="#FFC400" stroke="#3B2A55" stroke-width="1.5"/><path d="M98 16 q-8 -8 -2 -12 q6 -2 6 6 q8 -6 12 0 q2 6 -6 6 q6 8 0 12 q-6 2 -6 -6 q-8 6 -12 0 q-2 -6 6 -6z" fill="#FF8FAB" stroke="#3B2A55" stroke-width="2"/><circle cx="100" cy="14" r="4" fill="#FFE066"/><circle cx="64" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><circle cx="136" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path class="stw" style="animation-delay:0s" d="M20 41 Q20 50 29 50 Q20 50 20 59 Q20 50 11 50 Q20 50 20 41Z" fill="#FF8FAB"/><path class="stw" style="animation-delay:0.5s" d="M184 36 Q184 44 192 44 Q184 44 184 52 Q184 44 176 44 Q184 44 184 36Z" fill="#FFC400"/><path class="stw" style="animation-delay:1.2s" d="M178 114 Q178 120 184 120 Q178 120 178 126 Q178 120 172 120 Q178 120 178 114Z" fill="#14C7D8"/></svg></span><div class="bubble">Em chào anh/chị ạ!</div></div>
<main id="app"><p class="m">Đang mở…</p></main>
<div id="msg" role="status" aria-live="polite" style="max-width:560px;margin:0 auto"></div>
<footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer>
<script>
const API='https://devotee-outclass-couch.ngrok-free.dev/webhook',H={'ngrok-skip-browser-warning':'1','Content-Type':'application/json'};
const TG=window.Telegram&&Telegram.WebApp;if(TG){try{TG.ready();TG.expand()}catch(e){}}
const raw=new URLSearchParams(location.search).get('p')||(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param)||'';
const p=raw.replace(/[^A-Za-z0-9]/g,'');
const $=document.getElementById('app'),$m=document.getElementById('msg');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(n).replace('.',',');
let D=null,kyXem='tuan',moGiao=null,busy=false;
const THU=['T2','T3','T4','T5','T6','T7','CN'];
const say=(t,c)=>{$m.className=c||'';$m.textContent=t||''};
async function post(path,b){try{return await (await fetch(API+'/'+path,{method:'POST',headers:H,body:JSON.stringify(Object.assign({p},b||{}))})).json()}catch(e){return{ok:false,loi:'Không kết nối được. Kiểm tra mạng rồi thử lại.'}}}
async function tai(){
  if(p.length<12){$.innerHTML='<div class="c"><h1>🔍 Link chưa đúng</h1><p class="m">Anh/chị mở lại từ nút trong bot Mọt sách Phụ huynh nhé.</p></div>';return}
  const j=await post('ph-mon-xem');
  if(!j.ok){$.innerHTML='<div class="c"><h1>🔍 Không mở được</h1><p class="m">'+esc(j.loi||'Có lỗi xảy ra.')+'</p></div>';return}
  D=j;ve()}
function bc(b){const tl=b.ti_le;
 return `<div class="g"><div class="k"><b>${b.lich?(b.du_kien?b.dung_lich+'/'+b.du_kien:'–'):'–'}</b><span class="m">buổi đúng lịch${tl!=null?' ('+tl+'%)':''}</span>${tl!=null?`<div class="bar"><i style="width:${tl}%"></i></div>`:''}</div>
 <div class="k"><b>${b.phut}′</b><span class="m">${b.so_tiet} tiết đã học</span></div>
 <div class="k"><b>${b.diem_tb==null?'–':fmt(b.diem_tb)}</b><span class="m">điểm TB (${b.so_bai_kt} bài)</span></div>
 <div class="k"><b>${b.giao_ky?b.giao_bat_dau+'/'+b.giao_ky:'–'}</b><span class="m">chủ đề anh/chị giao, con đã bắt đầu</span></div></div>
 <p class="m" style="margin:10px 0 0">${b.lich?'':'Con chưa đặt lịch học nên chưa tính được mức tuân thủ giờ. '}${b.hoc_them?'Học thêm ngoài lịch: '+b.hoc_them+' buổi. ':''}${b.thieu_dau_vao?'⚠️ Còn '+b.thieu_dau_vao+' mục chưa làm kiểm tra đầu vào. ':''}${b.giao_ton?'⏳ '+b.giao_ton+' chủ đề giao chưa làm. ':''}${b.yeu.length?'Cần ôn: '+esc(b.yeu.join(', '))+'.':''}</p>${b.kn&&(b.kn.k.length||b.kn.lt.length)?`<h2 style="margin:16px 0 6px">💡 Khuyến nghị cho anh/chị</h2><ul class="m" style="margin:0;padding-left:20px">${b.kn.k.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><h2 style="margin:14px 0 6px">🗺️ Lộ trình gợi ý</h2><ol class="m" style="margin:0;padding-left:20px">${b.kn.lt.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><p class="m" style="margin:8px 0 0">Gợi ý tự động dựa trên điểm và quá trình học của con, anh/chị tham khảo thêm ý kiến thầy/cô.</p>`:''}`}
function ve(){const h=D.hs,k=D.cai_dat,ds=D.mon,b=D.bao_cao[kyXem],ct=k.tan_suat;
 const opt=(a,v)=>a.map(x=>`<option value="${x[0]}" ${String(x[0])===String(v)?'selected':''}>${x[1]}</option>`).join('');
 $.innerHTML=`<h1>Con ${esc(h.ten)}</h1><span class="m">${esc([h.lop&&'Lớp '+h.lop,h.truong,D.lich&&'Học '+D.lich.ngay.join(', ')+' lúc '+D.lich.gio,D.het_han&&'Gói đến '+D.het_han.split('-').reverse().join('/')].filter(Boolean).join(' · '))}</span>
 <div class="c" style="margin-top:12px"><h2>📬 Tóm tắt học tập</h2><div class="tabs"><button class="t" data-ky="tuan" aria-pressed="${kyXem==='tuan'}">7 ngày</button><button class="t" data-ky="thang" aria-pressed="${kyXem==='thang'}">30 ngày</button></div>${bc(b)}</div>
 <div class="c"><h2>📚 Môn học đã đăng ký</h2><p class="m" style="margin:0 0 6px">Bấm ▲ ▼ để đẩy môn lên hoặc xuống: môn ở trên được xếp trước trong menu của con. Bấm “Giao chủ đề” để giao bài cho con.</p>
 ${ds.map((m,i)=>`<div class="mon"><div class="r"><div><b>${esc(m.mon)}</b>${m.loai==='chu_de'?' · 🎯 '+esc(m.chu_de):''}<br>
  ${m.cho?'<span class="tag wait">⏳ chờ tài liệu</span>':''}<span class="tag">${m.dau_vao!=null?'đầu vào '+fmt(m.dau_vao)+'/10':'chưa làm đầu vào'}</span><span class="tag">${m.tong?m.buoi+'/'+m.tong+' buổi':m.buoi?'đã học '+m.buoi+' buổi':'chưa học'}</span>${m.diem_gan!=null?'<span class="tag">điểm gần nhất '+fmt(m.diem_gan)+'</span>':''}</div>
  <div class="r"><button class="mv" data-a="len" data-k="${esc(m.key)}" aria-label="Đẩy lên" ${i===0||busy?'disabled':''}>▲</button><button class="mv" data-a="xuong" data-k="${esc(m.key)}" aria-label="Đẩy xuống" ${i===ds.length-1||busy?'disabled':''}>▼</button></div></div>
  <button class="b" data-g="${i}" style="margin-top:8px">🎯 Giao chủ đề</button>
  ${moGiao===i?`<div class="fx"><input id="cd" maxlength="80" placeholder="Chủ đề, ví dụ: Phân số" aria-label="Tên chủ đề"><button class="b p" data-gs="${i}" ${busy?'disabled':''}>Giao cho con</button><span class="m">Hôm nay đã giao ${D.giao.hom_nay}/${D.giao.toi_da} chủ đề trên web.</span></div>`:''}</div>`).join('')||'<p class="m">Con chưa có môn nào. Nhờ con hoàn tất bước đăng ký môn trong bot Mọt sách.</p>'}</div>
 <div class="c"><h2>⚙️ Cài đặt nhận báo cáo</h2><div class="fx">
  <label class="l" for="s_ts">Báo cáo nhanh</label><select id="s_ts">${opt([['tat','Không nhận'],['ngay','Hằng ngày'],['tuan','Hằng tuần'],['thang','Hằng tháng']],ct)}</select>
  <div class="row2"><div><label class="l" for="s_gio">Giờ gửi</label><input id="s_gio" type="time" value="${esc(k.gio)}"></div>
  <div>${ct==='thang'?`<label class="l" for="s_ng">Ngày trong tháng</label><select id="s_ng">${opt([...Array(28).keys()].map(x=>[x+1,'Ngày '+(x+1)]),k.ngay)}</select>`:ct==='tuan'?`<label class="l" for="s_thu">Thứ</label><select id="s_thu">${opt(THU.map(x=>[x,x==='CN'?'Chủ nhật':'Thứ '+x.slice(1)]),k.thu)}</select>`:''}</div></div>
  <label class="l" for="s_nhac">Nhắc anh/chị trước giờ học của con</label><select id="s_nhac">${opt([[0,'Không nhắc'],[10,'Trước 10 phút'],[30,'Trước 30 phút']],k.nhac)}</select>
  <button class="b p" id="luu" ${busy?'disabled':''}>Lưu cài đặt</button></div></div>`}
async function lam(b,okMsg){if(busy)return;busy=true;say('Đang xử lý…');ve();const j=await post('ph-mon-luu',b);busy=false;
 if(j.ok){D.mon=j.mon;D.cai_dat=j.cai_dat;if(j.giao_hom_nay!=null)D.giao.hom_nay=j.giao_hom_nay;if(b.act==='giao')moGiao=null;say(j.thongbao||okMsg||'Đã lưu.','ok')}else say(j.loi||'Chưa lưu được, anh/chị thử lại nhé.','err');ve()}
$.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!D)return;const d=t.dataset;
 if(d.ky){kyXem=d.ky;ve()}
 else if(d.a)lam({act:d.a,key:d.k});
 else if(d.g!==undefined){moGiao=moGiao===Number(d.g)?null:Number(d.g);ve();const i=document.getElementById('cd');if(i)i.focus()}
 else if(d.gs!==undefined){const cd=(document.getElementById('cd')||{}).value||'';lam({act:'giao',mon:D.mon[Number(d.gs)].mon,chu_de:cd})}
 else if(t.id==='luu'){const g=id=>(document.getElementById(id)||{}).value;
  lam({act:'cai_dat',cai_dat:{tan_suat:g('s_ts'),gio:g('s_gio')||D.cai_dat.gio,thu:g('s_thu')||D.cai_dat.thu,ngay:g('s_ng')||D.cai_dat.ngay,nhac:g('s_nhac')}})}});
$.addEventListener('change',e=>{if(e.target.id==='s_ts'&&D){D.cai_dat=Object.assign({},D.cai_dat,{tan_suat:e.target.value,gio:(document.getElementById('s_gio')||{}).value||D.cai_dat.gio,nhac:Number((document.getElementById('s_nhac')||{}).value)||0});ve()}});
tai();
</script></body></html>
