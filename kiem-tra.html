<style>
  :root { --bg:#EAF5FF; --card:#fff; --text:#24305E; --muted:#5F6B92; --line:#C9DAF2; --shadow:#B5CBEA; --mark:#FFD84D; --mark-d:#E3AE00; --mark-ink:#4A3700; --ok:#118A62; --ok-bg:#E3F6EE; --err:#C2255C; --err-bg:#FDE7EF;
    --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --disp:'Baloo 2','Nunito',system-ui,sans-serif; }
  /* che do toi tat: mot-sach.css la giao dien sang */
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-weight:500; }
  body { min-height:100vh; padding:env(safe-area-inset-top,0) 16px calc(96px + env(safe-area-inset-bottom,0)); background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px); background-size:26px 26px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:560px; padding:20px 0; }
  .hero { display:flex; gap:10px; align-items:flex-end; margin-bottom:14px; }
  .mascot { font-size:52px; line-height:1; flex:none; }
  .bubble { background:var(--card); border:2px solid var(--line); border-radius:22px 22px 22px 6px; padding:8px 16px 10px; box-shadow:0 4px 0 var(--shadow); font-weight:700; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:24px; box-shadow:0 4px 0 var(--shadow); padding:18px 16px; margin:0 0 14px; }
  h1 { font:800 22px var(--disp); margin:0 0 4px; }
  .m { color:var(--muted); font-size:14px; font-weight:600; }
  .q { white-space:pre-wrap; line-height:1.55; font-size:17px; font-weight:700; margin:6px 0 12px; }
  .tag { display:inline-block; font:800 12px var(--font); padding:2px 10px; border-radius:999px; background:var(--mark); color:var(--mark-ink); margin-right:6px; }
  label.o { display:flex; gap:10px; align-items:flex-start; border:2px solid var(--line); border-radius:16px; padding:10px 12px; margin:8px 0; cursor:pointer; font-weight:700; line-height:1.4; }
  label.o.on { background:var(--mark); border-color:var(--mark-d); color:var(--mark-ink); }
  label.o input { margin-top:3px; width:18px; height:18px; flex:none; }
  input.t { width:100%; min-height:48px; border:2px solid var(--line); border-radius:16px; background:var(--card); color:var(--text); font:inherit; font-weight:700; padding:8px 14px; }
  input.t:focus-visible, label.o:focus-within { outline:3px solid #FF7A90; outline-offset:2px; }
  button.b { appearance:none; border:0; border-radius:999px; background:var(--text); color:var(--card); font:800 16px var(--font); min-height:48px; padding:0 24px; cursor:pointer; box-shadow:0 4px 0 var(--shadow); }
  button.b:active { transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
  button.b:disabled { opacity:.5; cursor:default; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:2px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0)); display:flex; gap:12px; align-items:center; justify-content:space-between; z-index:5; }
  .bar .m { font-weight:800; }
  .state { text-align:center; padding:26px 8px; line-height:1.6; }
  .state .big { font-size:62px; line-height:1.1; margin-bottom:8px; }
  .state .t { font:800 21px var(--disp); }
  .score { font:800 54px var(--disp); line-height:1; margin:6px 0; color:var(--ok); }
  .err { color:var(--err); font-weight:800; } .ok { color:var(--ok); font-weight:800; }
  .res { border-radius:18px; padding:12px 14px; margin:0 0 12px; border:2px solid var(--line); }
  .res.d { background:var(--ok-bg); border-color:var(--ok); } .res.s { background:var(--err-bg); border-color:var(--err); }
  .res .ex { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:15px; line-height:1.5; white-space:pre-wrap; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { font-size:13px; font-weight:800; padding:3px 10px; border-radius:999px; }
  .chip.g { background:var(--ok-bg); color:var(--ok); } .chip.w { background:var(--err-bg); color:var(--err); }
  .dots span { display:inline-block; animation:dt 1.2s infinite; } .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
  @media (prefers-reduced-motion:no-preference) { @keyframes dt { 50% { transform:translateY(-6px); } } }

  textarea.t { width:100%; min-height:110px; border:2px solid var(--line); border-radius:16px; background:var(--card); color:var(--text); font:inherit; font-weight:600; padding:10px 14px; resize:vertical; line-height:1.5; }
  textarea.t:focus-visible { outline:3px solid #FF7A90; outline-offset:2px; }
  .fig { background:var(--card); border:2px dashed var(--line); border-radius:16px; padding:8px; margin:0 0 12px; }
  .fig svg { width:100%; height:auto; max-height:300px; display:block; }
  .fig svg text { paint-order:stroke; stroke:var(--card); stroke-width:3px; stroke-linejoin:round; }
  .fig .cap { text-align:center; font-size:13px; font-weight:700; color:var(--muted); margin-top:2px; }
  .gtag { background:#B9E4FF; color:#0B3556; }
  .pas { white-space:pre-wrap; line-height:1.65; font-size:16.5px; font-weight:600; background:var(--bg); border:2px solid var(--line); border-radius:16px; padding:12px 14px; margin:8px 0 0; }
  .say { font:800 21px/1.45 var(--disp); text-align:center; background:var(--bg); border:2px solid var(--line); border-radius:16px; padding:14px; margin:6px 0 12px; }
  .play { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .play .m { font-weight:800; }
  button.b.s { min-height:40px; padding:0 16px; font-size:14px; background:var(--card); color:var(--text); border:2px solid var(--line); box-shadow:none; }
  button.b.rec { background:var(--err); color:#fff; }
  @media (prefers-reduced-motion:no-preference) { button.b.rec { animation:pls 1s infinite; } @keyframes pls { 50% { transform:scale(1.05); } } }
  .heard { margin-top:10px; padding:10px 12px; border-radius:14px; background:var(--bg); border:2px solid var(--line); font-weight:700; white-space:pre-wrap; }
  .heard:empty { display:none; }
  .skill { display:grid; grid-template-columns:132px 1fr 46px; gap:8px; align-items:center; margin:8px 0; font-weight:800; font-size:14px; }
  .skill .bar2 { height:12px; border-radius:99px; background:var(--line); overflow:hidden; } .skill .bar2 i { display:block; height:100%; background:var(--ok); border-radius:99px; }
  .skill .bar2 i.lo { background:var(--err); } .skill .bar2 i.mid { background:var(--mark-d); }
  .res.p { background:var(--bg); border-color:var(--mark-d); }
  .fb { margin-top:6px; font-size:15px; line-height:1.5; white-space:pre-wrap; }
  details.tx { margin:0 0 12px; border:2px solid var(--line); border-radius:16px; padding:8px 12px; background:var(--card); } details.tx summary { cursor:pointer; font-weight:800; }
  .vf { margin:6px auto 0; padding:10px 8px; text-align:center; font-size:12.5px; line-height:1.6; color:var(--muted); }
  .vf a { color:inherit; font-weight:800; }

.vq{text-align:center;margin:0 0 14px}.vq .vi{font-size:64px;line-height:1.1}.vq .vt{font-weight:800;font-size:19px;line-height:1.4;margin:6px 0 0}
.vq .vd{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--shadow,var(--sh));padding:12px 14px;margin:12px 0 0;font-size:15px;line-height:1.55}
.vq .vd small{display:block;color:var(--muted,var(--mut));margin-top:4px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.vq.v-mid .vi{display:inline-block;animation:vqb .9s ease-in-out 3}.vq.v-low .vi{display:inline-block;animation:vqs 2s ease-in-out 2;transform-origin:50% 90%}
.vq.v-top .vi{display:inline-block;animation:vqb .7s ease-in-out 4}@keyframes vqb{50%{transform:translateY(-12px)}}@keyframes vqs{50%{transform:rotate(-8deg)}}}
</style>

<script>
/* Mọt sách – bộ vẽ hình hình học (SVG) theo đúng schema "ve_hinh" của bot */
function veHinh(spec) {
  const NS = 'http://www.w3.org/2000/svg', W = 360, H = 270, PAD = 38;
  const COL = { blue: '#2F6FDE', red: '#D6336C', green: '#1E9E6A' };
  const INK = 'var(--text,#24305E)';
  const mk = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const svg = mk('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': String(spec.title || 'Hình vẽ') });
  const g = (c) => COL[c] || INK;
  const num = (v) => Number(v) || 0;

  /* ---------- khối tròn xoay ---------- */
  if (spec.template && spec.template.name) {
    const t = spec.template, nm = String(t.name), r = Math.max(0.5, num(t.r) || 3), h = Math.max(0.5, num(t.h) || 5);
    const line = (x1, y1, x2, y2, d) => svg.appendChild(mk('line', { x1, y1, x2, y2, stroke: INK, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-dasharray': d ? '5 4' : '' }));
    const arc = (cx, cy, rx, ry, front) => svg.appendChild(mk('path', { d: 'M ' + (cx - rx) + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 0 ' + (front ? 0 : 1) + ' ' + (cx + rx) + ' ' + cy, fill: 'none', stroke: INK, 'stroke-width': 2, 'stroke-dasharray': front ? '' : '5 4' }));
    const dot = (x, y, lb, dx, dy) => { svg.appendChild(mk('circle', { cx: x, cy: y, r: 3, fill: INK })); if (lb) svg.appendChild(mk('text', { x: x + dx, y: y + dy, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: INK, 'font-size': 15, 'font-weight': 800 }, lb)); };
    if (nm === 'hinh_cau') {
      const R = 95, cx = W / 2, cy = H / 2;
      svg.appendChild(mk('circle', { cx, cy, r: R, fill: 'none', stroke: INK, 'stroke-width': 2 }));
      arc(cx, cy, R, R * 0.3, true); arc(cx, cy, R, R * 0.3, false);
      line(cx, cy, cx + R, cy, true); dot(cx, cy, 'O', 0, -13);
    } else {
      const maxW = 220, maxH = 190, k = Math.min(maxW / (2 * r), maxH / (h + 0.7 * r)), rx = r * k, ry = Math.max(8, rx * 0.3), hh = h * k;
      const cx = W / 2, top = (H - (hh + 2 * ry)) / 2 + ry, bot = top + hh;
      if (nm === 'hinh_tru') {
        arc(cx, bot, rx, ry, true); arc(cx, bot, rx, ry, false);
        svg.appendChild(mk('ellipse', { cx, cy: top, rx, ry, fill: 'none', stroke: INK, 'stroke-width': 2 }));
        line(cx - rx, top, cx - rx, bot); line(cx + rx, top, cx + rx, bot);
        line(cx, top, cx, bot, true); line(cx, bot, cx + rx, bot, true);
        dot(cx, top, 'O\u2032', 0, -ry - 10); dot(cx, bot, 'O', 0, 14);
      } else {
        arc(cx, bot, rx, ry, true); arc(cx, bot, rx, ry, false);
        line(cx, top - ry, cx - rx, bot); line(cx, top - ry, cx + rx, bot);
        line(cx, top - ry, cx, bot, true); line(cx, bot, cx + rx, bot, true);
        dot(cx, top - ry, 'S', 0, -12); dot(cx, bot, 'O', 0, 14);
      }
    }
    return svg;
  }

  /* ---------- hình phẳng / hình không gian ---------- */
  const is3d = String(spec.kind) === '3d', K = 0.5, AL = 38 * Math.PI / 180;
  const P = {}; (spec.points || []).forEach(p => { P[String(p.name)] = { x: num(p.x), y: num(p.y), z: num(p.z) }; });
  const has = (n) => Object.prototype.hasOwnProperty.call(P, String(n));
  const proj = (p) => is3d ? [p.x + K * p.y * Math.cos(AL), p.z + K * p.y * Math.sin(AL)] : [p.x, p.y];
  const S = {}; Object.keys(P).forEach(n => { S[n] = proj(P[n]); });
  const names = Object.keys(S);
  if (!names.length) return svg;
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  const ext = (x, y) => { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); };
  names.forEach(n => ext(S[n][0], S[n][1]));
  (spec.circles || []).forEach(c => { if (has(c.center)) { const q = S[c.center], r = num(c.r); ext(q[0] - r, q[1] - r); ext(q[0] + r, q[1] + r); } });
  const bw = Math.max(maxx - minx, 1e-6), bh = Math.max(maxy - miny, 1e-6);
  const sc = Math.min((W - 2 * PAD) / bw, (H - 2 * PAD) / bh);
  const offx = (W - bw * sc) / 2, offy = (H - bh * sc) / 2;
  const T = (n) => { const q = S[n]; return [offx + (q[0] - minx) * sc, H - offy - (q[1] - miny) * sc]; };
  const cen = names.reduce((a, n) => { const t = T(n); return [a[0] + t[0] / names.length, a[1] + t[1] / names.length]; }, [0, 0]);
  const unit = (dx, dy) => { const l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const draw = (e) => svg.appendChild(e);
  const dashAttr = '6 4';

  (spec.polygons || []).forEach(pg => {
    const pts = (pg.points || []).filter(has); if (pts.length < 3) return;
    draw(mk('polygon', { points: pts.map(n => T(n).join(',')).join(' '), fill: g(pg.fill) === INK ? '#9AA8D8' : g(pg.fill), 'fill-opacity': 0.18, stroke: 'none' }));
  });
  (spec.circles || []).forEach(c => { if (has(c.center)) { const q = T(c.center); draw(mk('circle', { cx: q[0], cy: q[1], r: num(c.r) * sc, fill: 'none', stroke: INK, 'stroke-width': 2 })); } });

  /* các mặt của khối: tự tính nét khuất */
  const segKey = (a, b) => [String(a), String(b)].sort().join('|');
  const explicit = new Set((spec.segments || []).map(s => segKey(s.from, s.to)));
  if (is3d && (spec.faces || []).length) {
    const faces = spec.faces.filter(f => f.every(has));
    const all = []; faces.forEach(f => f.forEach(n => all.push(P[n])));
    const c3 = all.reduce((a, p) => ({ x: a.x + p.x / all.length, y: a.y + p.y / all.length, z: a.z + p.z / all.length }), { x: 0, y: 0, z: 0 });
    const W3 = [K * Math.cos(AL), -1, K * Math.sin(AL)];
    const front = faces.map(f => {
      const a = P[f[0]], b = P[f[1]], c = P[f[2]];
      const u = [b.x - a.x, b.y - a.y, b.z - a.z], v = [c.x - a.x, c.y - a.y, c.z - a.z];
      let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      const fc = f.reduce((s, nme) => ({ x: s.x + P[nme].x / f.length, y: s.y + P[nme].y / f.length, z: s.z + P[nme].z / f.length }), { x: 0, y: 0, z: 0 });
      if (n[0] * (fc.x - c3.x) + n[1] * (fc.y - c3.y) + n[2] * (fc.z - c3.z) < 0) n = n.map(t => -t);
      return n[0] * W3[0] + n[1] * W3[1] + n[2] * W3[2] > 1e-9;
    });
    const edges = {};
    faces.forEach((f, i) => f.forEach((n, k) => { const m = f[(k + 1) % f.length], key = segKey(n, m); (edges[key] = edges[key] || { a: n, b: m, vis: false }); if (front[i]) edges[key].vis = true; }));
    Object.keys(edges).forEach(key => {
      if (explicit.has(key)) return; const e = edges[key], a = T(e.a), b = T(e.b);
      draw(mk('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: INK, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-dasharray': e.vis ? '' : dashAttr, opacity: e.vis ? 1 : 0.8 }));
    });
  }
  (spec.segments || []).forEach(s => {
    if (!has(s.from) || !has(s.to)) return; const a = T(s.from), b = T(s.to), col = g(s.color);
    draw(mk('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-dasharray': s.style === 'dashed' ? dashAttr : '' }));
    if (s.label) { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, u = unit(b[0] - a[0], b[1] - a[1]); let nx = -u[1], ny = u[0]; if (nx * (mx - cen[0]) + ny * (my - cen[1]) < 0) { nx = -nx; ny = -ny; }

  const left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
  tm.textContent = '⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + ' · ' + cnt + '/' + D.cau.length + ' câu';
  if (left <= 0 && !sending) { clearInterval(timer); nop(true); }
}
async function nop(auto) {
  if (sending) return;
  const thieu = D.cau.length - done();
  if (!auto && thieu && !confirm('Bạn còn ' + thieu + ' câu chưa làm. Vẫn nộp bài?')) return;
  sending = true; clearInterval(timer); stopSpeak();
  const go = document.getElementById('go'); if (go) { go.disabled = true; go.textContent = 'Đang chấm…'; }
  try {
    const r = await api('/kt-nop', { b, tra_loi: A });
    if (!r.ok) { sending = false; const er = document.getElementById('er'); if (er) er.textContent = r.loi || 'Chưa nộp được, bạn thử lại nhé.'; if (go) { go.disabled = false; go.textContent = 'Nộp bài'; } timer = setInterval(tick, 1000); return; }
    document.querySelectorAll('.bar').forEach(x => x.remove());
    try { ['a', 'end', 'l'].forEach(k => sessionStorage.removeItem('kt_' + b + '_' + k)); } catch (e) {}
    D = Object.assign(D, { nhom: r.nhom || D.nhom }); showResult(r); window.scrollTo({ top: 0 });
  } catch (e) {
    sending = false; const er = document.getElementById('er'); if (er) er.textContent = 'Chưa nộp được. Kiểm tra mạng rồi bấm Nộp lại nhé (bài làm của bạn vẫn còn).';
    if (go) { go.disabled = false; go.textContent = 'Nộp bài'; } timer = setInterval(tick, 1000);
  }
}

const KN_TEN = { nghe: '🎧 Nghe', noi: '🎤 Nói', doc: '📖 Đọc', viet: '✍️ Viết', ngu_phap: '🔤 Từ vựng & ngữ pháp' };
const KN_THUTU = ['nghe', 'noi', 'doc', 'viet', 'ngu_phap'];

/* ===== v106: phản hồi theo điểm (pháo hoa / mặt cười / mặt mếu) + danh ngôn xoay vòng ===== */
const VQ_Q=[
['Có công mài sắt, có ngày nên kim.'],['Có chí thì nên.'],['Thất bại là mẹ thành công.'],['Nước chảy đá mòn.'],
['Kiến tha lâu cũng đầy tổ.'],['Đi một ngày đàng, học một sàng khôn.'],['Học một biết mười.'],['Có học mới biết, có đi mới đến.'],
['Ôn cố tri tân: ôn bài cũ để hiểu điều mới.'],['Thua keo này, bày keo khác.'],['Cái khó ló cái khôn.'],['Không thầy đố mày làm nên.'],
['Học đi đôi với hành.'],['Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao.'],['Ngã ở đâu, đứng dậy ở đó.'],['Góp gió thành bão.'],
['Dục tốc bất đạt: nóng vội thì khó thành.'],['Đường đi khó không khó vì ngăn sông cách núi, mà khó vì lòng người ngại núi e sông.','Nguyễn Bá Học'],
['Không có việc gì khó, chỉ sợ lòng không bền. Đào núi và lấp biển, quyết chí ắt làm nên.','Hồ Chí Minh'],['Học, học nữa, học mãi.','V. I. Lênin']];
function vqQuote(){let i;try{const n=parseInt(localStorage.getItem('vq_i')||'',10);i=isNaN(n)?Math.floor(Math.random()*VQ_Q.length):(n+1)%VQ_Q.length;localStorage.setItem('vq_i',String(i))}catch(e){i=Math.floor(Math.random()*VQ_Q.length)}return VQ_Q[i]}
function vqPhaoHoa(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';document.body.appendChild(cv);
 const d=window.devicePixelRatio||1,W=cv.width=innerWidth*d,Hh=cv.height=innerHeight*d,x=cv.getContext('2d'),P=[],C=['#FFD84D','#FF5C8A','#4C7BE0','#3DDC97','#FF9F43','#B388FF'];
 const burst=(cx,cy)=>{const c=C[Math.random()*C.length|0];for(let i=0;i<46;i++){const a=Math.PI*2*i/46,s=(2+Math.random()*4)*d;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}};
 const t0=performance.now();let next=0;
 (function f(now){const t=now-t0;if(t>=next&&t<2800){burst(W*(.15+Math.random()*.7),Hh*(.12+Math.random()*.3));next=t+380}
  x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,W,Hh);x.globalCompositeOperation='source-over';
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.05*d;p.vx*=.985;p.l-=.014;if(p.l>0){x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.2*d,0,7);x.fill()}}
  x.globalAlpha=1;for(let i=P.length;i--;)if(P[i].l<=0)P.splice(i,1);
  if(t<4500||P.length)requestAnimationFrame(f);else cv.remove()})(t0)}

function vqRoi(kind){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';document.body.appendChild(cv);
 const d=window.devicePixelRatio||1,W=cv.width=innerWidth*d,Hh=cv.height=innerHeight*d,x=cv.getContext('2d'),sao=kind==='sao',C=['#FFD84D','#FFC107','#FF9F43','#FFE97F'];
 const mk=()=>sao?{x:Math.random()*W,y:-Math.random()*Hh*.8-20*d,r:(7+Math.random()*9)*d,vy:(1.3+Math.random()*1.8)*d,vx:(Math.random()-.5)*.8*d,a:Math.random()*6.28,w:(Math.random()-.5)*.08,c:C[Math.random()*C.length|0]}
  :{x:Math.random()*W*1.15,y:-Math.random()*Hh,l:(10+Math.random()*14)*d,vy:(10+Math.random()*7)*d,vx:-1.6*d};
 const P=Array.from({length:sao?45:150},mk),t0=performance.now();
 const star=(p)=>{x.save();x.translate(p.x,p.y);x.rotate(p.a);x.beginPath();for(let i=0;i<10;i++){const r=i%2?p.r*.45:p.r,a=Math.PI*i/5-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fillStyle=p.c;x.fill();x.restore()};
 (function f(now){const t=now-t0;x.clearRect(0,0,W,Hh);let live=0;
  if(!sao){x.strokeStyle='rgba(111,168,255,.75)';x.lineWidth=1.6*d;x.lineCap='round';x.beginPath()}
  for(let i=0;i<P.length;i++){let p=P[i];p.x+=p.vx;p.y+=p.vy;
   if(sao){p.a+=p.w}
   if(p.y>Hh+30*d){if(t<3800){P[i]=p=mk();p.y=-20*d}else{p.dead=1}}
   if(p.dead)continue;live++;
   if(sao)star(p);else{x.moveTo(p.x,p.y);x.lineTo(p.x+p.vx*1.2,p.y-p.l)}}
  if(!sao)x.stroke();
  if((t<3800||live)&&t<9000)requestAnimationFrame(f);else cv.remove()})(t0)}
/* >=9: pháo hoa · 6 đến <9: mặt cười · <6: mặt mếu. Trả về chuỗi HTML. */
function veKQ(diem10){const d=Number(diem10)||0,q=vqQuote(),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let k,ic,tt;
 if(d>=9){k='top';ic='🎆';tt='Chúc mừng bạn xuất sắc! 🎉';setTimeout(vqPhaoHoa,350)}
 else if(d>=6){k='mid';ic='😊';tt='Cố gắng lên nhé, bạn gần đến đích rồi!';setTimeout(()=>vqRoi('sao'),350)}
 else{k='low';ic='😢';tt='Cố gắng lên bạn nhé! Mọi thứ sẽ đạt được khi bạn quyết tâm và chăm chỉ.';setTimeout(()=>vqRoi('mua'),350)}
 return `<div class="vq v-${k}" role="status"><div class="vi" aria-hidden="true">${ic}</div><p class="vt">${tt}</p><div class="vd">💡 <i>${e(q[0])}</i>${q[1]?'<small>— '+e(q[1])+'</small>':''}</div></div>`}

function showResult(j) {
  const k = j.ket; sending = false; D = D || j; stopSpeak();
  say(k.diem10 >= 9 ? 'Xuất sắc quá! 🎉' : k.diem10 >= 6 ? 'Gần đến đích rồi! 😊' : 'Cố gắng lên nhé 💛');
  app.innerHTML = '';
  const top = el('div', 'card'); top.style.textAlign = 'center';
  top.append(el('h1', '', 'Kết quả – ' + (j.mon || '')), el('div', 'score', String(k.diem10).replace('.', ',') + '/10'),
    el('p', 'm', k.dung + '/' + k.tong + ' câu đạt · ' + k.xep_loai));
  const note = el('p', 'q', 'Quay lại chat, mình sẽ tiếp tục với bạn nhé. Phần dưới là đáp án và lời giải từng câu.'); note.style.marginTop = '10px'; top.appendChild(note);
  app.appendChild(top);
  { const w = document.createElement('div'); w.innerHTML = veKQ(k.diem10); app.appendChild(w.firstChild); }
  if ((k.ky_nang || []).length) {
    const c = el('div', 'card'); c.appendChild(el('b', '', '🧭 Điểm từng kỹ năng'));
    KN_THUTU.forEach(key => { const s = k.ky_nang.find(x => x.kn === key); if (!s) return; const pct = Math.round(s.diem / s.tong * 100); const r = el('div', 'skill'), bar = el('div', 'bar2'), i = el('i', pct >= 70 ? '' : pct >= 50 ? 'mid' : 'lo'); i.style.width = pct + '%'; bar.appendChild(i); r.append(el('span', '', KN_TEN[key] || key), bar, el('span', '', pct + '%')); c.appendChild(r); });
    app.appendChild(c);
  }
  if ((k.manh || []).length || (k.yeu || []).length) {
    const c = el('div', 'card'); c.appendChild(el('b', '', '📊 Nhận xét kiến thức'));
    if (k.manh && k.manh.length) { c.appendChild(el('p', 'm', '💪 Bạn làm tốt:')); const ch = el('div', 'chips'); k.manh.forEach(x => ch.appendChild(el('span', 'chip g', x))); c.appendChild(ch); }
    if (k.yeu && k.yeu.length) { c.appendChild(el('p', 'm', '⚠️ Cần ôn thêm:')); const ch = el('div', 'chips'); k.yeu.forEach(x => ch.appendChild(el('span', 'chip w', x))); c.appendChild(ch); }
    app.appendChild(c);
  }
  const h = el('div', 'card'); h.appendChild(el('b', '', 'Đáp án và lời giải')); app.appendChild(h);
  const groups = {}; ((k.nhom && k.nhom.length ? k.nhom : j.nhom) || []).forEach(g => { groups[g.id] = g; });
  let lastG = '';
  (k.chi_tiet || []).forEach((d, i) => {
    if (d.nhom && d.nhom !== lastG && groups[d.nhom]) {
      const g = groups[d.nhom], dt = el('details', 'tx'); dt.append(el('summary', '', g.loai === 'nghe' ? '🎧 Lời bài nghe – ' + (g.tieu_de || '') : '📖 Bài đọc – ' + (g.tieu_de || '')), el('div', 'pas', g.loai === 'nghe' ? g.kich_ban : g.van_ban));
      if (g.loai === 'nghe' && TTS) { const sb = el('button', 'b s', '🔊 Nghe lại'); sb.type = 'button'; sb.style.marginTop = '8px'; sb.onclick = () => speak(g); dt.appendChild(sb); }
      app.appendChild(dt);
    }
    lastG = d.nhom || '';
    const part = !d.dung && d.diem > 0, c = el('div', 'res ' + (d.dung ? 'd' : part ? 'p' : 's')), cham = (d.loai === 'viet' || d.loai === 'noi_doc' || d.loai === 'noi_tl');
    c.appendChild(el('div', '', (d.dung ? '✅ ' : part ? '🟡 ' : '❌ ') + 'Câu ' + (i + 1) + (d.chu_de ? ' · ' + d.chu_de : '') + (cham || d.diem % 1 ? ' · ' + String(d.diem).replace('.', ',') + '/1 điểm' : '')));
    c.appendChild(el('p', 'q', d.de));
    if (d.loai === 'noi_doc' && d.doc) c.appendChild(el('div', 'say', d.doc));
    const f = figure(d.hinh); if (f) c.appendChild(f);
    if (d.loai === 'tn' && d.lc) c.appendChild(el('div', 'm', d.lc.map((x, z) => LET[z] + '. ' + x).join('\n'))).style.whiteSpace = 'pre-wrap';
    const ex = el('div', 'ex');
    const lab = d.loai === 'tn' ? 'Bạn chọn' : d.loai === 'viet' ? 'Bài của bạn' : (d.loai === 'noi_doc' || d.loai === 'noi_tl') ? 'Bạn nói (máy ghi lại)' : 'Bạn trả lời';
    ex.appendChild(el('div', '', lab + ': ' + (d.hs ? d.hs : '(chưa trả lời)')));
    if (cham) { if (d.nx) ex.appendChild(el('div', 'fb', '💬 ' + d.nx)); if (d.sua) ex.appendChild(el('div', 'fb', '✏️ Gợi ý sửa: ' + d.sua)); if (d.loai !== 'noi_doc' && d.dap_an) ex.appendChild(el('div', 'fb', '📘 Bài mẫu: ' + d.dap_an)); }
    else if (!d.dung) ex.appendChild(el('div', 'err', 'Đáp án đúng: ' + d.dap_an));
    if (d.giai_thich) ex.appendChild(el('div', '', '💡 ' + d.giai_thich));
    c.appendChild(ex); app.appendChild(c);
  });
}
load();
