<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mọt sách – Học chuyên đề</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  .qz{margin:0 0 10px}
  .lop-h{font-weight:800;margin:14px 0 6px;font-size:15px}
  .bai-i{padding:8px 10px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:#fff;font-size:14.5px}
  .bai-i small{display:block;color:var(--mute)}
  .ks{margin:6px 0 0;padding:8px 10px;border-left:4px solid var(--mark-d);background:#FFFBE6;border-radius:0 8px 8px 0;font-size:14.5px}
  .ks b{display:block}
  .ks i{display:block;color:var(--weak);font-size:13px;margin-top:3px;font-style:normal}
  .prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
  .prog>i{display:block;height:100%;background:var(--blue,#13547C);width:0}
  .opts{display:grid;gap:8px;margin:10px 0}
  .opts button{text-align:left;padding:10px 12px}
  .fb{padding:10px 12px;border-radius:10px;margin:10px 0;white-space:pre-wrap;font-size:15px}
  .fb.ok{background:#E3F6EE;border:2px solid var(--ok)}
  .fb.bad{background:#FDE8E9;border:2px solid var(--err)}
  .fb.info{background:#EAF1FA;border:2px solid var(--line)}
  .row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .score{font-size:30px;font-weight:800}
  textarea,input[type=text]{width:100%;padding:10px;font-size:16px}
  select{padding:10px;font-size:16px}
  .muted{color:var(--mute);font-size:14px}
</style>
<link rel="stylesheet" href="mot-sach.css?v=2">
</head>
<body class="ms">
<header class="ms-head"><div class="ms-hw"><span class="ms-logo"><img src="assets/logo-mark.png" alt=""><span>Mọt<b>sách</b></span></span></div></header>
<div class="wrap" style="max-width:560px;margin:0 auto;padding:12px 16px 90px">
  <div class="ms-mate" style="padding:0;margin:6px 0 10px"><div class="bubble" id="say">Bạn muốn học chuyên đề gì nào?</div></div>
  <div id="app"></div>
  <footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer>
</div>
<script>
/* Học chuyên đề: nhập một chuyên đề (ví dụ "trọng âm", "phân số", "quang hợp") -> máy tra bản đồ kiến thức lớp 1-12 -> kiểm tra nhanh -> lý thuyết -> ôn tập. */
const API = 'https://devotee-outclass-couch.ngrok-free.dev/webhook/hoc-ngay-7c3a';
const H = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' };
const TGW = window.Telegram && Telegram.WebApp; if (TGW) { try { TGW.ready(); TGW.expand(); } catch (e) {} }
const $app = document.getElementById('app'), say = m => { document.getElementById('say').textContent = m; };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const MONS = ['', 'Toán', 'Ngữ văn', 'Tiếng Việt', 'Tiếng Anh', 'Khoa học tự nhiên', 'Khoa học', 'Vật lý', 'Hóa học', 'Sinh học', 'Lịch sử', 'Địa lý', 'Lịch sử và Địa lý', 'Giáo dục công dân', 'Tin học', 'Công nghệ', 'Âm nhạc', 'Mỹ thuật'];
let D = null, Q = null, KQ = { kt: null, on: null };

async function goi(body) {
  const r = await fetch(API, { method: 'POST', headers: H, body: JSON.stringify(body) });
  return r.json();
}
function xoa() { $app.innerHTML = ''; window.scrollTo(0, 0); }

/* ---------- 1. nhập chuyên đề ---------- */
function man1(loi) {
  xoa(); say('Bạn muốn học chuyên đề gì nào?');
  const c = el('div', 'card');
  c.append(el('h1', '', '🎯 Học chuyên đề'),
    el('p', 'muted', 'Gõ một chuyên đề, ví dụ: trọng âm, phân số, quang hợp, hằng đẳng thức. Mình sẽ rà các bài từ lớp 1 đến lớp 12 có liên quan, kiểm tra nhanh, dạy lại lý thuyết rồi cho bạn ôn tập.'));
  const inp = el('input'); inp.type = 'text'; inp.maxLength = 80; inp.placeholder = 'Ví dụ: trọng âm tiếng Anh'; inp.setAttribute('aria-label', 'Chuyên đề');
  const sel = el('select'); sel.setAttribute('aria-label', 'Môn (không bắt buộc)'); MONS.forEach(m => { const o = el('option', '', m || 'Tất cả các môn'); o.value = m; sel.appendChild(o); });
  const er = el('p', 'err', loi || '');
  const go = el('button', 'b', 'Tìm bài liên quan 🔎'); go.type = 'button';
  go.onclick = () => tim(inp.value.trim(), sel.value);
  inp.onkeydown = e => { if (e.key === 'Enter') go.click(); };
  c.append(inp, el('div', 'muted', 'Chỉ học một môn? Chọn môn (không bắt buộc):'), sel, er, go);
  $app.appendChild(c); inp.focus();
}
async function tim(q, mon) {
  if (q.length < 3) return man1('Bạn gõ rõ hơn một chút nhé (ít nhất 3 chữ).');
  xoa(); say('Mình đang rà các bài…'); $app.appendChild(el('div', 'card', '⏳ Đang tìm các bài liên quan từ lớp 1 đến lớp 12…'));
  let j;
  try { j = await goi({ act: 'chuyen_de', q, mon }); } catch (e) { return man1('Mạng đang chập chờn, bạn thử lại nhé.'); }
  if (!j || !j.ok) return man1(j && j.loi === 'may_chu_hoc_dang_tat' ? 'Máy chủ học đang tạm nghỉ, bạn thử lại sau ít phút nhé.' : 'Chưa tìm được, bạn thử chuyên đề khác nhé.');
  if (j.khong_thay) return man1('Mình chưa thấy bài nào về “' + q + '”. Bạn thử cách gọi khác nhé (ví dụ bỏ bớt chữ).');
  D = j; D.q = q; man2();
}

/* ---------- 2. danh sách bài liên quan ---------- */
function man2() {
  xoa(); say('Mình tìm được ' + D.bai.length + ' bài liên quan!');
  const c = el('div', 'card');
  c.append(el('h1', '', 'Chuyên đề: ' + D.q),
    el('p', 'muted', 'Mình rà ' + (D.so_bai_quet || 0).toLocaleString('vi-VN') + ' bài, thấy ' + D.bai.length + ' bài liên quan từ lớp ' + D.lop_tu + ' đến lớp ' + D.lop_den + '. Các bước: ① kiểm tra nhanh ② xem lý thuyết ③ ôn tập.'));
  let lopCu = -1;
  D.bai.forEach(b => {
    if (b.lop !== lopCu) { lopCu = b.lop; c.appendChild(el('div', 'lop-h', 'Lớp ' + b.lop)); }
    const i = el('div', 'bai-i'); i.append(document.createTextNode(b.ten), el('small', '', b.mon + (b.ks[0] ? ' · ' + b.ks[0].ten : ''))); c.appendChild(i);
  });
  const go = el('button', 'b', 'Bắt đầu: kiểm tra nhanh (' + D.kiem_tra.length + ' câu) ▶'); go.type = 'button';
  go.onclick = () => D.kiem_tra.length ? batDauQuiz('kt') : lyThuyet();
  const lt = el('button', 'b l', 'Xem lý thuyết luôn'); lt.type = 'button'; lt.onclick = () => lyThuyet();
  const lai = el('button', 'b l', '← Đổi chuyên đề'); lai.type = 'button'; lai.onclick = () => man1();
  c.append(el('div', 'row2'), go, lt, lai); $app.appendChild(c);
}

/* ---------- 3/5. làm câu hỏi (kiểm tra nhanh / ôn tập) ---------- */
function batDauQuiz(loai) {
  const ds = loai === 'kt' ? D.kiem_tra : D.on_tap;
  Q = { loai, ds, i: 0, dung: 0, tong: 0, sai: {}, ket: [] };
  hienCau();
}
function hienCau() {
  xoa();
  const it = Q.ds[Q.i];
  say(Q.loai === 'kt' ? 'Kiểm tra nhanh nào!' : 'Ôn tập cho chắc nhé!');
  const c = el('div', 'card'), bai = D.bai.find(b => b.id === it.id) || {};
  const pg = el('div', 'prog'); pg.appendChild(el('i')); pg.firstChild.style.width = Math.round(Q.i / Q.ds.length * 100) + '%';
  c.append(el('p', 'muted', (Q.loai === 'kt' ? 'Kiểm tra nhanh' : 'Ôn tập') + ' · câu ' + (Q.i + 1) + '/' + Q.ds.length + (bai.lop ? ' · lớp ' + bai.lop + ' ' + bai.mon : '')), pg, el('p', 'q', it.de));
  const nop = tl => cham(it, tl, c);
  if (it.dang === 'trac_nghiem') {
    const o = el('div', 'opts');
    (it.lua_chon || []).forEach(t => { const b = el('button', 'opt', t); b.type = 'button'; b.onclick = () => nop(t.slice(0, 1)); o.appendChild(b); });
    c.appendChild(o);
  } else if (it.dang === 'dung_sai') {
    const o = el('div', 'opts'); ['Đúng', 'Sai'].forEach(t => { const b = el('button', 'opt', t); b.type = 'button'; b.onclick = () => nop(t); o.appendChild(b); }); c.appendChild(o);
  } else {
    const long = it.dang !== 'dien_khuyet';
    const t = long ? el('textarea') : el('input'); if (!long) t.type = 'text'; else t.rows = 3; t.placeholder = long ? 'Bạn viết câu trả lời…' : 'Điền vào chỗ trống…'; t.maxLength = 500;
    const b = el('button', 'b', long ? 'Xem đáp án mẫu' : 'Trả lời'); b.type = 'button'; b.onclick = () => nop(t.value.trim());
    c.append(t, b);
  }
  $app.appendChild(c);
}
async function cham(it, tl, card) {
  card.querySelectorAll('button,input,textarea').forEach(x => x.disabled = true);
  let j;
  try { j = await goi({ act: 'cham', id: it.id, bo: it.bo || 1, phan: it.phan, stt: it.stt, tra_loi: tl }); } catch (e) { j = { ok: false }; }
  if (!j || !j.ok) { card.appendChild(el('p', 'err', 'Chưa chấm được câu này, bạn bấm “Câu tiếp theo” nhé.')); return tiepNut(card, null); }
  const meo = j.meo ? '\n\n💡 Mẹo nhỏ: ' + j.meo : '';
  if (j.can_ai_cham) {
    const f = el('div', 'fb info'); f.textContent = 'Đáp án mẫu:\n' + (j.dap_an_mau || j.dap_an || '') + ((j.tieu_chi_cham || []).length ? '\n\nTiêu chí: ' + j.tieu_chi_cham.join('; ') : '') + (j.giai_thich ? '\n\n' + j.giai_thich : '') + meo;
    card.append(f, el('p', 'muted', 'Bạn tự so với đáp án mẫu nhé:'));
    const r = el('div', 'row2');
    const y = el('button', 'b', '✔ Bạn làm đúng'), n = el('button', 'b l', '✖ Chưa đúng'); y.type = n.type = 'button';
    y.onclick = () => { ghi(it, true); sang(); }; n.onclick = () => { ghi(it, false); sang(); };
    r.append(y, n); card.appendChild(r); return;
  }
  const f = el('div', 'fb ' + (j.dung ? 'ok' : 'bad'));
  let t = j.dung ? '🎉 Chính xác!' : '❌ Chưa đúng. Đáp án: ' + j.dap_an;
  if (!j.dung && j.vi_sao_chon_sai) t += '\n' + j.vi_sao_chon_sai;
  if (j.giai_thich) t += '\n\n' + j.giai_thich;
  f.textContent = t + meo; card.appendChild(f);
  ghi(it, !!j.dung); tiepNut(card);
}
function ghi(it, dung) { Q.tong++; if (dung) Q.dung++; else Q.sai[it.id] = (Q.sai[it.id] || 0) + 1; }
function tiepNut(card) {
  const b = el('button', 'b', Q.i + 1 >= Q.ds.length ? 'Xem kết quả ▶' : 'Câu tiếp theo →'); b.type = 'button'; b.onclick = sang; card.appendChild(b);
}
function sang() { Q.i++; if (Q.i >= Q.ds.length) return ketQuaQuiz(); hienCau(); }

function ketQuaQuiz() {
  KQ[Q.loai] = { dung: Q.dung, tong: Q.tong, sai: Q.sai };
  xoa();
  const c = el('div', 'card'); c.style.textAlign = 'center';
  const d10 = Q.tong ? Math.round(Q.dung / Q.tong * 100) / 10 : 0;
  say(d10 >= 8 ? 'Giỏi quá!' : d10 >= 5 ? 'Khá lắm, cố thêm nhé!' : 'Không sao, mình học lại nhé!');
  c.append(el('h1', '', Q.loai === 'kt' ? 'Kết quả kiểm tra nhanh' : 'Kết quả ôn tập'), el('div', 'score', String(d10).replace('.', ',') + '/10'), el('p', 'muted', Q.dung + '/' + Q.tong + ' câu đúng'));
  const yeu = D.bai.filter(b => Q.sai[b.id]);
  if (yeu.length) { c.append(el('p', 'q', '⚠️ Cần xem lại:')); yeu.forEach(b => c.appendChild(el('div', 'bai-i', 'Lớp ' + b.lop + ' · ' + b.ten))); }
  const nx = el('button', 'b', Q.loai === 'kt' ? 'Xem lý thuyết ▶' : 'Học chuyên đề khác'); nx.type = 'button';
  nx.onclick = () => Q.loai === 'kt' ? lyThuyet() : man1();
  c.appendChild(nx);
  if (Q.loai === 'on') { const lt = el('button', 'b l', 'Xem lại lý thuyết'); lt.type = 'button'; lt.onclick = () => lyThuyet(); c.appendChild(lt); }
  $app.appendChild(c);
}

/* ---------- 4. lý thuyết ---------- */
function lyThuyet() {
  xoa(); say('Mình ôn lại lý thuyết nhé!');
  const sai = (KQ.kt && KQ.kt.sai) || {};
  const c = el('div', 'card');
  c.append(el('h1', '', 'Lý thuyết: ' + D.q), el('p', 'muted', 'Các bài bạn làm sai được xếp trước. Đọc kĩ phần “lỗi thường gặp” nhé.'));
  const ds = D.bai.slice().sort((a, b) => (sai[b.id] ? 1 : 0) - (sai[a.id] ? 1 : 0) || a.lop - b.lop);
  ds.forEach(b => {
    const d = document.createElement('details'); if (sai[b.id]) d.open = true;
    const s = document.createElement('summary'); s.textContent = (sai[b.id] ? '⚠️ ' : '') + 'Lớp ' + b.lop + ' · ' + b.mon + ' · ' + b.ten; d.appendChild(s);
    (b.ks || []).forEach(k => { const x = el('div', 'ks'); x.appendChild(el('b', '', k.ten)); x.appendChild(document.createTextNode(k.y_chinh)); if (k.loi_thuong_gap) x.appendChild(el('i', '', 'Lỗi thường gặp: ' + k.loi_thuong_gap)); d.appendChild(x); });
    c.appendChild(d);
  });
  const go = el('button', 'b', 'Làm bài ôn tập (' + D.on_tap.length + ' câu) ▶'); go.type = 'button'; go.onclick = () => D.on_tap.length ? batDauQuiz('on') : man1();
  c.appendChild(go); $app.appendChild(c);
}
man1();
</script>
<script src="bi-bar.js"></script>
</body>
</html>
