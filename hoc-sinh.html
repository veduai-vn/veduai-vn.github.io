<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mọt sách – Góc học sinh</title>
<style>
:root{--bg:#EAF5FF;--card:#fff;--ink:#24305E;--mut:#5F6B92;--line:#C9DAF2;--sh:#B5CBEA;--mark:#FFD84D;--ok:#118A62;--err:#C2255C}
@media(prefers-color-scheme:dark){:root{--bg:#151B36;--card:#1F2850;--ink:#F1F4FF;--mut:#AAB4DC;--line:#38437A;--sh:#0E1328;--ok:#5FE0B0;--err:#FF9BB5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0) 14px calc(20px + env(safe-area-inset-bottom,0))}
main{max-width:560px;margin:0 auto;padding:18px 0}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 6px}.m{color:var(--mut);font-size:14px}
.c{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--sh);padding:14px;margin:0 0 14px}
input,select{width:100%;min-height:46px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;padding:8px 12px}
.g{display:grid;gap:10px}.dob{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}.r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.b{appearance:none;border:0;background:var(--ink);color:var(--card);font:800 16px system-ui;min-height:48px;padding:0 22px;border-radius:999px;cursor:pointer}.b:disabled{opacity:.5}.b.l{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.err{color:var(--err);font-weight:700;margin:0}.ok{color:var(--ok);font-weight:700}.sc{font:800 22px system-ui;white-space:nowrap}a{color:var(--ink);font-weight:800}
.vf{max-width:560px;margin:6px auto 0;padding:10px 8px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--mut)}.vf a{color:inherit}</style><link rel="stylesheet" href="mot-sach.css?v=2">
</head>
<body class="ms">
<header class="ms-head"><div class="ms-hw"><span class="ms-logo"><img src="assets/logo-mark.png" alt=""><span>Mọt<b>sách</b></span></span></div></header>
<div class="ms-mate"><span class="mascot" aria-hidden="true"><svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><ellipse cx="100" cy="94" rx="62" ry="56" fill="#2F3E7A" stroke="#3B2A55" stroke-width="3"/><rect x="91" y="156" width="18" height="16" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path d="M56 170 Q100 150 144 170 L154 230 H46 Z" fill="#14C7D8" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M78 163 L100 190 L122 163 Q100 154 78 163 Z" fill="#fff" stroke="#3B2A55" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="100" cy="108" rx="58" ry="54" fill="#FFE4D2" stroke="#3B2A55" stroke-width="3"/><g class="eyes"><ellipse cx="76" cy="112" rx="12" ry="15" fill="#B86B2E"/><ellipse cx="76" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="71" cy="106" r="4.8" fill="#fff"/><circle cx="81" cy="120" r="2.4" fill="#fff"/><ellipse cx="124" cy="112" rx="12" ry="15" fill="#B86B2E"/><ellipse cx="124" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="119" cy="106" r="4.8" fill="#fff"/><circle cx="129" cy="120" r="2.4" fill="#fff"/></g><path d="M60 103 Q76 91 92 103 M108 103 Q124 91 140 103" stroke="#3B2A55" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="57" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><ellipse cx="143" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><path d="M90 130 Q100 135 110 130 Q108 147 100 147 Q92 147 90 130Z" fill="#E8546E" stroke="#3B2A55" stroke-width="2.2" stroke-linejoin="round"/><path d="M94 141 Q100 138 106 141 Q103 145 100 145 Q97 145 94 141Z" fill="#FF9EB5"/><path d="M38 104 Q34 44 100 36 Q166 44 162 104 L150 80 L138 98 L122 70 L106 96 L90 68 L74 96 L58 74 Z" fill="#2F3E7A" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M150 58 L158 92" stroke="#FFC400" stroke-width="3.5" stroke-linecap="round"/><circle cx="158" cy="94" r="5.5" fill="#FFC400" stroke="#3B2A55" stroke-width="2"/><path d="M68 62 V80 Q100 96 132 80 V62 L100 74 Z" fill="#1A2250" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M42 54 L100 26 L158 54 L100 80 Z" fill="#24305E" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="53" r="4" fill="#FFC400"/><circle cx="64" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><circle cx="136" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path class="stw" style="animation-delay:0s" d="M24 51 Q24 60 33 60 Q24 60 24 69 Q24 60 15 60 Q24 60 24 51Z" fill="#FFC400"/><path class="stw" style="animation-delay:0.5s" d="M180 32 Q180 40 188 40 Q180 40 180 48 Q180 40 172 40 Q180 40 180 32Z" fill="#FF8FAB"/><path class="stw" style="animation-delay:1s" d="M30 134 Q30 140 36 140 Q30 140 30 146 Q30 140 24 140 Q30 140 30 134Z" fill="#14C7D8"/></svg></span><div class="bubble">Chào bạn, mình cùng học nhé!</div></div>
<main id="app"><p class="m">Đang mở…</p></main>
<footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Website: <a href="https://veduai-vn.web.app">veduai-vn.web.app</a> · Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer>
<script>
const API='https://devotee-outclass-couch.ngrok-free.dev/webhook',H={'ngrok-skip-browser-warning':'1','Content-Type':'application/json'};
const PAGE_BAI='https://veduai-vn.github.io/bai-tap.html',BOT='https://t.me/MotSachVedu_Bot',HK='hsfree';
const $=document.getElementById('app'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CR=null;try{CR=JSON.parse(localStorage.getItem(HK)||'null')}catch(e){}
const R={ten:'',nd:'',nt:'',nn:'',tr:'',lop:'',ma:'',err:'',busy:false};let D=null;
const post=async(p,b)=>{try{return await (await fetch(API+'/'+p,{method:'POST',headers:H,body:JSON.stringify(b)})).json()}catch(e){return{ok:false,loi:'Không kết nối được. Kiểm tra mạng rồi thử lại.'}}};
async function vao(){if(!CR||!CR.hs)return dk();$.innerHTML='<p class="m">Đang tải…</p>';const j=await post('hs-vao',{hs:CR.hs,k:CR.k});
 if(!j.ok){if(j.dangKy){CR=null;try{localStorage.removeItem(HK)}catch(e){}R.err=j.loi||'';return dk()}$.innerHTML='<div class="c"><p class="err">'+esc(j.loi)+'</p><button class="b" onclick="vao()">Thử lại</button></div>';return}
 D=j;ve()}
function dk(){const ys=[];for(let y=new Date().getFullYear()-5;y>=1995;y--)ys.push(y);
 const o=(a,t,k)=>`<option value="">${t}</option>`+a.map(x=>`<option ${String(x)===String(R[k])?'selected':''}>${x}</option>`).join('');
 $.innerHTML=`<h1>🎒 Góc học sinh Mọt sách</h1><p class="m">Làm bài tập, bài kiểm tra thầy/cô giao hoàn toàn miễn phí và xem lại điểm các bài đã làm.</p>
 <div class="c g"><h2>Đăng ký miễn phí / Đăng nhập</h2><p class="m" style="margin:0">Chưa có tài khoản thì điền để đăng ký (30 giây). Đã đăng ký thì nhập lại đúng họ tên, ngày sinh, trường để đăng nhập.</p>
 <input data-r="ten" placeholder="Họ và tên" value="${esc(R.ten)}" autocomplete="name">
 <div class="dob"><select data-r="nd">${o([...Array(31).keys()].map(i=>i+1),'Ngày','nd')}</select><select data-r="nt">${o([...Array(12).keys()].map(i=>i+1),'Tháng','nt')}</select><select data-r="nn">${o(ys,'Năm','nn')}</select></div>
 <div class="dob" style="grid-template-columns:1fr 2fr"><input data-r="lop" placeholder="Lớp (7A2)" value="${esc(R.lop)}"><input data-r="tr" placeholder="Trường" value="${esc(R.tr)}"></div>
 <input id="hp" style="display:none" tabindex="-1" autocomplete="off"><p class="err">${esc(R.err)}</p><button class="b" id="dk" ${R.busy?'disabled':''}>${R.busy?'Đang xử lý…':'Đăng ký / Đăng nhập'}</button></div>`}
async function dkGo(){if(R.ten.trim().split(/\s+/).filter(Boolean).length<2){R.err='Nhập đủ họ và tên.';return dk()}
 const ns=R.nn+'-'+String(R.nt).padStart(2,'0')+'-'+String(R.nd).padStart(2,'0'),v=new Date(ns+'T00:00:00');
 if(!(R.nn&&v.getFullYear()==R.nn&&v.getMonth()+1==R.nt&&v.getDate()==R.nd)){R.err='Chọn đủ ngày sinh.';return dk()}
 if(!R.tr.trim()||!R.lop.trim()){R.err='Nhập lớp và trường.';return dk()}
 R.busy=true;R.err='';dk();
 const j=await post('hs-dang-ky',{ho_ten:R.ten,ngay_sinh:ns,ten_lop:R.lop,truong:R.tr,hp:(document.getElementById('hp')||{}).value||''});R.busy=false;
 if(!j.ok){R.err=j.loi||'Chưa được, bạn thử lại nhé.';return dk()}
 CR={hs:j.hs,k:j.k,ten:j.ten,lop:j.lop,truong:j.truong};try{localStorage.setItem(HK,JSON.stringify(CR))}catch(e){}vao()}
function maBai(v){v=String(v||'').trim();const m=v.match(/[?&]b=([A-Za-z0-9]+)/)||v.match(/^([A-Za-z0-9]{5,12})$/);return m?m[1]:''}
function ve(){const h=D.hs,n=D.nop,done=n.filter(x=>x.toi_da),tb=done.length?Math.round(done.reduce((s,x)=>s+x.diem10,0)/done.length*10)/10:null;
 $.innerHTML=`<div class="r"><div><h1>Chào ${esc(h.ten)} 👋</h1><span class="m">Lớp ${esc(h.lop)} · ${esc(h.truong)}</span></div><button class="b l" id="out">Thoát</button></div>
 <div class="c g" style="margin-top:12px"><h2>📝 Làm bài thầy/cô giao</h2><input id="ma" placeholder="Dán link hoặc mã bài thầy/cô gửi"><p class="err" id="er"></p><button class="b" id="go">Mở bài</button></div>
 <div class="c"><h2>📚 Bài bạn đã làm (${n.length})${tb!=null?' · điểm TB '+String(tb).replace('.',','):''}</h2>${n.map(x=>`<div class="r" style="border-top:1px solid var(--line);padding:8px 0"><div><b>${esc(x.tieu_de)}</b><br><span class="m">${esc([x.mon,x.gv&&'GV '+x.gv,x.ngay_nop.split('-').reverse().join('/')].filter(Boolean).join(' · '))}${x.trang_thai==='cho_giao_vien'?' · ⏳ chờ thầy/cô chấm':''}</span></div><span class="sc">${String(x.diem).replace('.',',')}/${x.toi_da}</span></div>`).join('')||'<p class="m">Bạn chưa làm bài nào. Dán link bài thầy/cô gửi vào ô phía trên nhé.</p>'}</div>
 <div id="phbox"></div>
 <div class="c"><h2>🎁 Học cùng Mọt sách – bạn học của bạn</h2><p class="m">Dùng thử miễn phí 5 ngày: học theo sách giáo khoa, hỏi bài bằng chữ, ảnh hoặc giọng nói, có báo cáo điểm mạnh, điểm yếu và kế hoạch khắc phục.</p><a href="${BOT}">Mở Mọt sách trên Telegram →</a></div>`;phTai()}
$.addEventListener('input',e=>{if(e.target.dataset.r)R[e.target.dataset.r]=e.target.value});
$.addEventListener('change',e=>{if(e.target.dataset.r)R[e.target.dataset.r]=e.target.value});
$.addEventListener('click',e=>{const id=e.target.id;
 if(id==='dk')dkGo();
 else if(id==='shu'&&PH&&PH.url)guiPH('Xem điểm của '+CR.ten+' trên Mọt sách (phụ huynh không cần đăng nhập, trong trang có nút nhận kết quả tự động qua Telegram): '+PH.url);
 else if(id==='shtg'&&PH&&PH.tg)guiPH('Phụ huynh bấm link này một lần để nhận kết quả bài làm của '+CR.ten+' tự động qua Telegram (miễn phí, có thể ngừng bất cứ lúc nào). Bấm link rồi nhấn Start là xong, không cần nhập mã hay ID Telegram: '+PH.tg);
 else if(id==='out'){CR=null;D=null;try{localStorage.removeItem(HK)}catch(x){}dk()}
 else if(id==='go'){const m=maBai(document.getElementById('ma').value);if(!m)return document.getElementById('er').textContent='Bạn dán đúng link hoặc mã bài (thầy/cô gửi) nhé.';location.href=PAGE_BAI+'?b='+m}});
/* ===== v78: phu huynh xem diem / nhan thong bao Telegram ===== */
const PHPAGE='https://veduai-vn.github.io/phu-huynh.html';let PH=null;
function cpOld(t){try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const r=document.execCommand('copy');a.remove();return r}catch(e){return false}}
function copyTxt(t){return new Promise(ok=>{try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>ok(true),()=>ok(cpOld(t)))}else ok(cpOld(t))}catch(e){ok(cpOld(t))}})}
async function guiPH(t){if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
 const ok=await copyTxt(t),m=document.getElementById('phmsg');if(m)m.textContent=ok?'✅ Đã sao chép. Bạn dán vào Zalo/Messenger/tin nhắn gửi phụ huynh nhé.':'Chưa sao chép được, bạn thử lại nhé.'}
function phVe(){const el=document.getElementById('phbox');if(!el)return;
 el.innerHTML='<div class="c"><h2>👨‍👩‍👧 Cho phụ huynh xem điểm</h2><p class="m" style="margin:0 0 10px">Bạn tự gửi từ máy của bạn, không cần nhập số điện thoại phụ huynh. Phụ huynh xem được tất cả bài bạn đã làm, không cần đăng nhập.</p>'+
 (PH&&PH.url?'<div class="g"><button class="b" id="shu">📨 Gửi link xem điểm cho phụ huynh</button><button class="b l" id="shtg">🔔 Mời phụ huynh nhận điểm qua Telegram</button></div><p class="m" style="margin:10px 0 0">'+(PH.n?PH.n+' phụ huynh đã đăng ký nhận thông báo. ':'')+'<a href="'+esc(PH.url)+'" target="_blank" rel="noopener">Xem thử trang phụ huynh</a></p><p class="m" id="phmsg" style="margin:6px 0 0;font-weight:700"></p>':'<p class="m">'+(PH===null?'Đang tạo link…':'Chưa tạo được link cho phụ huynh, bạn thử tải lại trang nhé.')+'</p>')+'</div>'}
async function phTai(){PH=null;phVe();const j=await post('hs-ph-link',{hs:CR.hs,k:CR.k});PH=j.ok?{url:j.ph_url,tg:j.tg_url,n:j.so_ph||0}:{};phVe()}

vao();
</script></body></html>
