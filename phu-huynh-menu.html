<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>VeduAI – Menu phụ huynh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#EAF5FF; --card:#fff; --text:#24305E; --muted:#5F6B92; --line:#C9DAF2; --shadow:#B5CBEA; --mark:#FFD84D; --mark-d:#E3AE00; --mark-ink:#4A3700; --ok:#118A62; --err:#C2255C;
    --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --disp:'Baloo 2','Nunito',system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151B36; --card:#1F2850; --text:#F1F4FF; --muted:#AAB4DC; --line:#38437A; --shadow:#0E1328; --mark-d:#B88A00; --ok:#5FE0B0; --err:#FF9BB5; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-weight:500; }
  body { min-height:100vh; padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0); background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px); background-size:26px 26px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:520px; padding:24px 0; }
  .hero { display:flex; gap:10px; align-items:flex-end; margin-bottom:14px; }
  .mascot { font-size:56px; line-height:1; flex:none; }
  .bubble { background:var(--card); border:2px solid var(--line); border-radius:22px 22px 22px 6px; padding:8px 16px 10px; box-shadow:0 4px 0 var(--shadow); font-weight:700; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:24px; box-shadow:0 4px 0 var(--shadow); padding:20px 16px; }
  .msg { line-height:1.5; font-size:17px; font-weight:700; margin:0 0 16px; }
  .opt { display:flex; align-items:center; gap:12px; width:100%; text-align:left; text-decoration:none; font:inherit; font-weight:700; font-size:16px; padding:10px 16px 10px 10px; margin:0 0 12px; border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; cursor:pointer; line-height:1.4; box-shadow:0 4px 0 var(--shadow); transition:transform .08s, box-shadow .08s; }
  .opt .n { flex:none; display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--mark); color:var(--mark-ink); font:800 17px var(--disp); }
  .opt:active { transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); background:var(--mark); border-color:var(--mark-d); color:var(--mark-ink); }
  .opt:focus-visible { outline:3px solid #FF7A90; outline-offset:2px; }
  .opt:disabled { opacity:.55; cursor:default; }
  .opt.lk .n { background:var(--line); color:var(--text); font-size:15px; }
  .sep { margin:6px 0 12px; font-size:13.5px; color:var(--muted); font-weight:700; }
  .state { text-align:center; padding:24px 8px; line-height:1.6; }
  .state .big { font-size:64px; line-height:1.1; margin-bottom:8px; }
  .state .t { font:800 21px var(--disp); }
  .ok { color:var(--ok); } .err { color:var(--err); } .muted { color:var(--muted); font-size:14px; font-weight:600; }
  .again { margin-top:16px; display:inline-block; width:auto; }
  .vf { max-width:560px; margin:6px auto 0; padding:10px 8px; text-align:center; font-size:12.5px; line-height:1.6; color:var(--muted); }
  .vf a { color:inherit; font-weight:800; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span class="mascot" aria-hidden="true">🦉</span><div class="bubble" id="say">Cô/thầy đang chuẩn bị…</div></div>
  <div class="card" id="card" aria-live="polite"><div class="state"><div class="big" aria-hidden="true">🐣</div>Đang tải...</div></div>
  <footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer>
</div>
<script>
// Địa chỉ n8n (cùng domain ngrok với các trang khác)
const API = 'https://devotee-outclass-couch.ngrok-free.dev/webhook/ph-menu-web-5b2e';
const H = { 'ngrok-skip-browser-warning': '1', 'Content-Type': 'application/json' };
const c = (new URLSearchParams(location.search).get('c') || '').replace(/[^A-Za-z0-9]/g, '');
const card = document.getElementById('card');
const say = m => { document.getElementById('say').textContent = m; };
let M = null, sending = false;

function state(icon, title, sub, cls, again) {
  card.innerHTML = '';
  const s = document.createElement('div'); s.className = 'state';
  const a = document.createElement('div'); a.className = 'big'; a.textContent = icon;
  const b = document.createElement('div'); b.className = 't ' + (cls || ''); b.textContent = title;
  s.append(a, b);
  if (sub) { const d = document.createElement('div'); d.className = 'muted'; d.textContent = sub; s.appendChild(d); }
  if (again) { const k = document.createElement('button'); k.type = 'button'; k.className = 'opt again'; k.textContent = again; k.onclick = load; s.appendChild(k); }
  card.appendChild(s);
}
const LY_DO = {
  khong_co: ['🔍', 'Link chưa đúng', 'Ba/mẹ mở lại link mới nhất trong tin nhắn của bot VeduAI Phụ huynh nhé.'],
  het_han: ['⏰', 'Menu đã hết hạn', 'Ba/mẹ nhắn “menu” cho bot VeduAI Phụ huynh trong Zalo, rồi bấm lại link nhé.'],
  da_dung: ['✅', 'Mục này đã được chọn rồi', 'Ba/mẹ quay lại Zalo xem câu trả lời nhé.'],
  sai: ['⚠️', 'Lựa chọn không hợp lệ', 'Ba/mẹ tải lại trang và thử lại nhé.']
};
function showReason(r) { say('Ối, có chút trục trặc rồi!'); const x = LY_DO[r] || ['⚠️', 'Có lỗi xảy ra', 'Ba/mẹ thử lại sau nhé.']; state(x[0], x[1], x[2], 'err', r === 'het_han' ? null : 'Tải lại'); }

async function post(b) { return (await fetch(API, { method: 'POST', headers: H, body: JSON.stringify(Object.assign({ c }, b)) })).json(); }

async function load() {
  sending = false;
  if (!c) return showReason('khong_co');
  state('🐣', 'Đang tải...');
  try {
    const j = await post({ act: 'lay' });
    if (!j.ok) return showReason(j.reason);
    M = j; render();
  } catch (e) { say('Mạng đang chập chờn…'); state('📡', 'Không kết nối được', 'Kiểm tra mạng rồi tải lại trang.', 'err', 'Thử lại'); }
}
function render() {
  card.innerHTML = '';
  say('Ba/mẹ chọn một mục nhé 👇');
  const p = document.createElement('p'); p.className = 'msg'; p.textContent = 'Ba/mẹ muốn xem gì ạ?'; card.appendChild(p);
  M.items.forEach((lb, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    b.append(n, document.createTextNode(lb)); b.onclick = () => pick(i, lb); card.appendChild(b);
  });
  if (M.extra && M.extra.length) {
    const s = document.createElement('div'); s.className = 'sep'; s.textContent = 'Liên kết khác'; card.appendChild(s);
    M.extra.forEach(x => {
      if (!/^https?:\/\//i.test(x.url)) return;
      const a = document.createElement('a'); a.className = 'opt lk'; a.href = x.url; a.target = '_blank'; a.rel = 'noopener';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = '↗'; a.append(n, document.createTextNode(x.text)); card.appendChild(a);
    });
  }
}
async function pick(i, label) {
  if (sending) return; sending = true;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const j = await post({ act: 'chon', i, t: M.t });
    if (j.ok) {
      say('Đã gửi cho cô/thầy rồi ạ!');
      state('🎉', 'Đã chọn: ' + label, 'Ba/mẹ quay lại Zalo để xem câu trả lời (vài giây). Muốn xem mục khác thì bấm nút dưới.', 'ok', 'Chọn mục khác');
    } else if (j.reason === 'cu') { load(); }
    else showReason(j.reason);
  } catch (e) { sending = false; card.querySelectorAll('button').forEach(b => b.disabled = false); alert('Chưa gửi được, ba/mẹ thử lại nhé.'); }
}
load();
</script>
</body>
</html>
