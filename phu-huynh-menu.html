<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Mọt sách – Menu phụ huynh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#EAF5FF; --card:#fff; --text:#24305E; --muted:#5F6B92; --line:#C9DAF2; --shadow:#B5CBEA; --mark:#FFD84D; --mark-d:#E3AE00; --mark-ink:#4A3700; --ok:#118A62; --err:#C2255C;
    --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --disp:'Baloo 2','Nunito',system-ui,sans-serif; }
  /* che do toi tat: mot-sach.css la giao dien sang */
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-weight:500; }
  body { min-height:100vh; padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0); background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px); background-size:26px 26px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:520px; padding:24px 0; }
  .hero { display:flex; gap:10px; align-items:flex-end; margin-bottom:14px; }
  .mascot { font-size:56px; line-height:1; flex:none; }
  .bubble { background:var(--card); border:2px solid var(--line); border-radius:22px 22px 22px 6px; padding:8px 16px 10px; box-shadow:0 4px 0 var(--shadow); font-weight:700; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:24px; box-shadow:0 4px 0 var(--shadow); padding:20px 16px; }
  .msg { line-height:1.5; font-size:17px; font-weight:700; margin:0 0 16px; }
  .opt { display:flex; align-items:center; gap:12px; width:100%; text-align:left; text-decoration:none; font:inherit; font-weight:700; font-size:16px; padding:10px 16px 10px 10px; margin:0 0 12px; border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; cursor:pointer; line-height:1.4; box-shadow:0 4px 0 var(--shadow); transition:transform .08s, box-shadow .08s; }
  .opt .n { flex:none; display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--mark); color:var(--mark-ink); font:800 17px var(--disp); }
  .opt:active { transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); background:var(--mark); border-color:var(--mark-d); color:var(--mark-ink); }
  .opt:focus-visible { outline:3px solid #FF7A90; outline-offset:2px; }
  .opt:disabled { opacity:.55; cursor:default; }
  .opt.lk .n { background:var(--line); color:var(--text); font-size:15px; }
  .sep { margin:6px 0 12px; font-size:13.5px; color:var(--muted); font-weight:700; }
  .state { text-align:center; padding:24px 8px; line-height:1.6; }
  .state .big { font-size:64px; line-height:1.1; margin-bottom:8px; }
  .state .t { font:800 21px var(--disp); }
  .ok { color:var(--ok); } .err { color:var(--err); } .muted { color:var(--muted); font-size:14px; font-weight:600; }
  .again { margin-top:16px; display:inline-block; width:auto; }
  .vf { max-width:560px; margin:6px auto 0; padding:10px 8px; text-align:center; font-size:12.5px; line-height:1.6; color:var(--muted); }
  .vf a { color:inherit; font-weight:800; }
</style>
<style>:root{color-scheme:light}</style>
<link rel="stylesheet" href="mot-sach.css?v=2">
</head>
<body class="ms">
<header class="ms-head"><div class="ms-hw"><span class="ms-logo"><img src="assets/logo-mark.png" alt=""><span>Mọt<b>sách</b></span></span></div></header>

<div class="wrap">
  <div class="hero"><span class="mascot" aria-hidden="true"><svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><circle cx="100" cy="34" r="22" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><ellipse cx="100" cy="98" rx="66" ry="62" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><rect x="34" y="96" width="32" height="76" rx="16" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><rect x="134" y="96" width="32" height="76" rx="16" fill="#7A4A36" stroke="#3B2A55" stroke-width="3"/><rect x="91" y="156" width="18" height="16" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path d="M56 170 Q100 150 144 170 L154 230 H46 Z" fill="#FF9EB5" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M78 163 L100 190 L122 163 Q100 154 78 163 Z" fill="#fff" stroke="#3B2A55" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="100" cy="108" rx="58" ry="54" fill="#FFE4D2" stroke="#3B2A55" stroke-width="3"/><g class="eyes"><ellipse cx="76" cy="112" rx="12" ry="15" fill="#6C4DB5"/><ellipse cx="76" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="71" cy="106" r="4.8" fill="#fff"/><circle cx="81" cy="120" r="2.4" fill="#fff"/><ellipse cx="124" cy="112" rx="12" ry="15" fill="#6C4DB5"/><ellipse cx="124" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="119" cy="106" r="4.8" fill="#fff"/><circle cx="129" cy="120" r="2.4" fill="#fff"/></g><path d="M60 103 Q76 91 92 103 M108 103 Q124 91 140 103" stroke="#3B2A55" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="57" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><ellipse cx="143" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><path d="M90 130 Q100 135 110 130 Q108 147 100 147 Q92 147 90 130Z" fill="#E8546E" stroke="#3B2A55" stroke-width="2.2" stroke-linejoin="round"/><path d="M94 141 Q100 138 106 141 Q103 145 100 145 Q97 145 94 141Z" fill="#FF9EB5"/><path d="M40 102 Q42 42 100 38 Q158 42 160 102 Q134 72 106 66 Q80 88 40 102 Z" fill="#7A4A36" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M62 54 Q82 44 104 46" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55" fill="none"/><circle cx="44" cy="132" r="4.5" fill="#FFC400" stroke="#3B2A55" stroke-width="1.5"/><circle cx="156" cy="132" r="4.5" fill="#FFC400" stroke="#3B2A55" stroke-width="1.5"/><path d="M98 16 q-8 -8 -2 -12 q6 -2 6 6 q8 -6 12 0 q2 6 -6 6 q6 8 0 12 q-6 2 -6 -6 q-8 6 -12 0 q-2 -6 6 -6z" fill="#FF8FAB" stroke="#3B2A55" stroke-width="2"/><circle cx="100" cy="14" r="4" fill="#FFE066"/><circle cx="64" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><circle cx="136" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path class="stw" style="animation-delay:0s" d="M20 41 Q20 50 29 50 Q20 50 20 59 Q20 50 11 50 Q20 50 20 41Z" fill="#FF8FAB"/><path class="stw" style="animation-delay:0.5s" d="M184 36 Q184 44 192 44 Q184 44 184 52 Q184 44 176 44 Q184 44 184 36Z" fill="#FFC400"/><path class="stw" style="animation-delay:1.2s" d="M178 114 Q178 120 184 120 Q178 120 178 126 Q178 120 172 120 Q178 120 178 114Z" fill="#14C7D8"/></svg></span><div class="bubble" id="say">Em đang chuẩn bị…</div></div>
  <div class="card" id="card" aria-live="polite"><div class="state"><div class="big" aria-hidden="true">🐣</div>Đang tải...</div></div>
  <footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer>
</div>
<script>
// Địa chỉ n8n (cùng domain ngrok với các trang khác)
const API = 'https://devotee-outclass-couch.ngrok-free.dev/webhook/ph-menu-web-5b2e';
const H = { 'ngrok-skip-browser-warning': '1', 'Content-Type': 'application/json' };
const c = (new URLSearchParams(location.search).get('c') || '').replace(/[^A-Za-z0-9]/g, '');
const card = document.getElementById('card');
const say = m => { document.getElementById('say').textContent = m; };
let M = null, sending = false;

function state(icon, title, sub, cls, again) {
  card.innerHTML = '';
  const s = document.createElement('div'); s.className = 'state';
  const a = document.createElement('div'); a.className = 'big'; a.textContent = icon;
  const b = document.createElement('div'); b.className = 't ' + (cls || ''); b.textContent = title;
  s.append(a, b);
  if (sub) { const d = document.createElement('div'); d.className = 'muted'; d.textContent = sub; s.appendChild(d); }
  if (again) { const k = document.createElement('button'); k.type = 'button'; k.className = 'opt again'; k.textContent = again; k.onclick = load; s.appendChild(k); }
  card.appendChild(s);
}
const LY_DO = {
  khong_co: ['🔍', 'Link chưa đúng', 'Anh/chị mở lại link mới nhất trong tin nhắn của bot Mọt sách Phụ huynh nhé.'],
  het_han: ['⏰', 'Menu đã hết hạn', 'Anh/chị nhắn “menu” cho bot Mọt sách Phụ huynh trong Zalo, rồi bấm lại link nhé.'],
  da_dung: ['✅', 'Mục này đã được chọn rồi', 'Anh/chị quay lại Zalo xem câu trả lời nhé.'],
  sai: ['⚠️', 'Lựa chọn không hợp lệ', 'Anh/chị tải lại trang và thử lại nhé.']
};
function showReason(r) { say('Ối, có chút trục trặc rồi!'); const x = LY_DO[r] || ['⚠️', 'Có lỗi xảy ra', 'Anh/chị thử lại sau nhé.']; state(x[0], x[1], x[2], 'err', r === 'het_han' ? null : 'Tải lại'); }

async function post(b) { return (await fetch(API, { method: 'POST', headers: H, body: JSON.stringify(Object.assign({ c }, b)) })).json(); }

async function load() {
  sending = false;
  if (!c) return showReason('khong_co');
  state('🐣', 'Đang tải...');
  try {
    const j = await post({ act: 'lay' });
    if (!j.ok) return showReason(j.reason);
    M = j; render();
  } catch (e) { say('Mạng đang chập chờn…'); state('📡', 'Không kết nối được', 'Kiểm tra mạng rồi tải lại trang.', 'err', 'Thử lại'); }
}
function render() {
  card.innerHTML = '';
  say('Anh/chị chọn một mục nhé 👇');
  const p = document.createElement('p'); p.className = 'msg'; p.textContent = 'Anh/chị muốn xem gì ạ?'; card.appendChild(p);
  M.items.forEach((lb, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    b.append(n, document.createTextNode(lb)); b.onclick = () => pick(i, lb); card.appendChild(b);
  });
  if (M.extra && M.extra.length) {
    const s = document.createElement('div'); s.className = 'sep'; s.textContent = 'Liên kết khác'; card.appendChild(s);
    M.extra.forEach(x => {
      if (!/^https?:\/\//i.test(x.url)) return;
      const a = document.createElement('a'); a.className = 'opt lk'; a.href = x.url; a.target = '_blank'; a.rel = 'noopener';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = '↗'; a.append(n, document.createTextNode(x.text)); card.appendChild(a);
    });
  }
}
async function pick(i, label) {
  if (sending) return; sending = true;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const j = await post({ act: 'chon', i, t: M.t });
    if (j.ok) {
      say('Đã gửi cho em rồi ạ!');
      state('🎉', 'Đã chọn: ' + label, 'Anh/chị quay lại Zalo để xem câu trả lời (vài giây). Muốn xem mục khác thì bấm nút dưới.', 'ok', 'Chọn mục khác');
    } else if (j.reason === 'cu') { load(); }
    else showReason(j.reason);
  } catch (e) { sending = false; card.querySelectorAll('button').forEach(b => b.disabled = false); alert('Chưa gửi được, anh/chị thử lại nhé.'); }
}
load();
</script>
</body>
</html>
