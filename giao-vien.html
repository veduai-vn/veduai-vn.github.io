 c.loai==='ngan'?`<input data-c="${i}" data-p="dap_an" placeholder="Đáp án đúng (nhiều đáp án chấp nhận: ngăn bằng dấu |)" value="${esc(c.dap_an)}">`:
 `<textarea rows="3" data-c="${i}" data-p="dap_an" placeholder="Đáp án mẫu / thang điểm để AI chấm theo">${esc(c.dap_an)}</textarea>`}</div>`).join('')}
<div class="r"><button class="b l" id="add">+ Thêm câu</button><button class="b" id="save">Lưu & lấy link</button><button class="b l" id="cancel">Huỷ</button></div><p class="err">${esc(f.err)}</p>`}
function pb(p){return `<div style="background:var(--line);border-radius:99px;height:8px;overflow:hidden;margin:2px 0 8px"><i style="display:block;height:100%;width:${p}%;background:${p>=80?'var(--ok)':p<60?'var(--err)':'var(--mark)'}"></i></div>`}
const f1=v=>v==null?'–':String(v).replace('.',',');
function vKQ(){const v=view,t=v.tong_quan||{},kt=t.kt||[],yeu=kt.filter(x=>x.pct<60),manh=kt.filter(x=>x.pct>=80).slice().reverse();
 const sm=a=>a.map(x=>esc(x.kt)+' ('+x.pct+'%)').join('; ');
 const tq=`<div class="c"><h2>📊 Báo cáo lớp</h2><div class="s"><div><div class="n">${t.so_cham||0}/${t.so_nop||0}</div><span class="m">Đã chấm / đã nộp</span></div><div><div class="n">${f1(t.tb10)}</div><span class="m">Điểm TB (thang 10)</span></div><div><div class="n">${f1(t.cao10)} / ${f1(t.thap10)}</div><span class="m">Cao nhất / thấp nhất</span></div></div>
${manh.length?`<p>💪 <b>Kiến thức cả lớp làm tốt:</b> ${sm(manh)}</p>`:''}${yeu.length?`<p>⚠️ <b>Cần ôn tập tăng cường:</b> ${sm(yeu)}</p>`:(kt.length?'<p class="m">Chưa có phần kiến thức nào yếu rõ rệt (dưới 60%).</p>':'')}
${kt.length?`<div style="margin-top:8px">${kt.map(x=>`<div class="m">${esc(x.kt)}: <b>${x.pct}%</b> (${x.so_hs} bạn)</div>${pb(x.pct)}`).join('')}</div>`:'<p class="m">Chưa có bài nộp đã chấm để phân tích.</p>'}
${(t.cau||[]).length?`<div class="w"><table><tr><th>Câu</th><th>Kiến thức</th><th>Tỷ lệ đúng</th></tr>${t.cau.map(c=>`<tr><td>${c.stt}. ${esc(c.de)}</td><td>${esc(c.kt||'–')}</td><td>${c.ty_le==null?'–':'<b>'+c.ty_le+'%</b>'}</td></tr>`).join('')}</table></div><p class="m">Gắn "Kiến thức" cho từng câu khi tạo bài để báo cáo chính xác hơn.</p>`:''}</div>`;
 return `<div class="c"><div class="r"><button class="b l" id="back">← Quay lại</button><b>${esc(v.bai.tieu_de)}</b></div><p class="m">${v.nop.length} bài nộp</p></div>`+tq+(v.nop.map((n,i)=>`<div class="c"><b>${n.hang?'#'+n.hang+' · ':''}${esc(n.ho_ten)}</b> <span class="m">${esc(n.ngay_sinh.split('-').reverse().join('/'))} · ${esc(n.ten_lop||'')} ${n.co_tai_khoan?'· ✅ có tài khoản':''}</span><br><span class="n">${n.diem}/${n.toi_da}</span> <span class="m">${n.trang_thai==='cho_giao_vien'?'⏳ chờ chấm (chưa xếp hạng)':n.trang_thai==='da_cham_tay'?'✍️ GV đã chấm':'🤖 tự động'}${n.hang?' · hạng '+n.hang+'/'+t.so_cham:''}</span>
${n.manh&&n.manh.length?`<br><span class="m">💪 Tốt: ${sm(n.manh)}</span>`:''}${n.yeu&&n.yeu.length?`<br><span class="m">⚠️ Cần ôn tăng cường: ${sm(n.yeu)}</span>`:''}
${n.chi_tiet.filter(d=>d.loai==='tl').map(d=>`<div class="g" style="margin-top:6px"><span class="m">Câu ${d.id.slice(1)} (tự luận${d.so_anh?', '+d.so_anh+' ảnh':''}): ${esc(d.tra_loi||'')} — ${esc(d.nhan_xet||'')}</span><input type="number" step="0.25" min="0" max="${d.toi_da}" value="${d.diem}" data-n="${i}" data-id="${d.id}" style="max-width:110px"></div>`).join('')}
<div class="r" style="margin-top:6px"><button class="b l" data-cm="${i}">Lưu điểm đã sửa</button></div></div>`).join('')||'<p class="m">Chưa có ai nộp.</p>')}

/* ===== v76: AI soạn bài từ tài liệu ===== */
const LIB={mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'};
const MAXTXT=40000,MAXANH=6,MAXMB=25;
const loadJs=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('Không tải được thư viện đọc tệp, kiểm tra mạng rồi thử lại.'));document.head.appendChild(s)});
function newAI(){ai={files:[],text:'',mon:'',ten_lop:'',sl_tn:10,sl_ngan:3,sl_tl:1,diem_tn:1,diem_ngan:1,diem_tl:2,do_kho:'tron',ghi_chu:'',busy:false,rd:false,err:''}}
function nenAnh(src,w,h,draw){const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);draw(c.getContext('2d'),c.width,c.height);return c.toDataURL('image/jpeg',.72).split(',')[1]}
function nenFile(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error('Không đọc được ảnh.'));r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('Ảnh không mở được.'));im.onload=()=>ok(nenAnh(im,im.width,im.height,(g,w,h)=>g.drawImage(im,0,0,w,h)));im.src=r.result};r.readAsDataURL(file)})}
async function docTep(f){
 const n=f.name.toLowerCase();
 if(f.size>MAXMB*1048576)throw new Error('Tệp lớn quá '+MAXMB+'MB.');
 if(/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/.test(n))return{ten:f.name,text:'',anh:[await nenFile(f)]};
 if(/\.(txt|md|csv)$/.test(n)||f.type==='text/plain')return{ten:f.name,text:await f.text(),anh:[]};
 if(n.endsWith('.docx')){if(!window.mammoth)await loadJs(LIB.mammoth);const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return{ten:f.name,text:r.value||'',anh:[]}}
 if(n.endsWith('.pdf')){
  if(!window.pdfjsLib){await loadJs(LIB.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw}
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  let text='';const np=Math.min(pdf.numPages,80);
  for(let i=1;i<=np&&text.length<MAXTXT;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent();text+=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}
  if(text.replace(/\s/g,'').length>=200)return{ten:f.name,text,anh:[]};
  const anh=[];  /* PDF scan: không có chữ -> chụp các trang đầu thành ảnh để AI đọc */
  for(let i=1;i<=Math.min(pdf.numPages,MAXANH);i++){const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;anh.push(nenAnh(c,c.width,c.height,(g,w,h)=>g.drawImage(c,0,0,w,h)))}
  return{ten:f.name,text:'',anh,ghi:pdf.numPages>MAXANH?'PDF scan: chỉ đọc '+MAXANH+' trang đầu.':''}}
 if(n.endsWith('.doc'))throw new Error('Tệp .doc cũ chưa đọc được. Thầy/cô lưu lại thành .docx hoặc PDF nhé.');
 throw new Error('Chưa hỗ trợ định dạng này. Dùng PDF, Word (.docx), ảnh hoặc tệp văn bản.')}
async function aiFiles(list){
 if(!ai||!list.length)return;ai.rd=true;ai.err='';ve();
 for(const f of list){
  try{const r=await docTep(f);
   const dem=ai.files.reduce((s,x)=>s+x.anh.length,0);
   if(dem+r.anh.length>MAXANH){ai.err='Tối đa '+MAXANH+' ảnh/trang scan cho mỗi lần soạn. Đã bỏ qua '+f.name+'.';continue}
   if(!r.text.trim()&&!r.anh.length){ai.err='Không đọc được chữ trong '+f.name+'.';continue}
   ai.files.push({ten:r.ten,text:r.text.replace(/\r/g,''),anh:r.anh,ghi:r.ghi||''})}
  catch(e){ai.err=f.name+': '+(e.message||'không đọc được.')}}
 ai.rd=false;ve()}

 form.aiNote='✨ AI đã soạn '+r.so_cau+' câu từ tài liệu. Thầy/cô hãy đọc lại đề và đáp án, sửa nếu cần rồi bấm "Lưu & lấy link" để giao cho học sinh.'+(r.ghi_chu?' '+r.ghi_chu:'');
 ai=null;ve();window.scrollTo({top:0})}

 if(t.id==='csv'){const rows=[['Họ tên','Ngày sinh','Lớp','Trường','Trạng thái']].concat(D.hs.map(x=>[x.ten,x.ngay_sinh,x.ten_lop||x.lop,x.truong,x.trang_thai]));const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\ufeff'+encodeURIComponent(rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'));a.download='hoc-sinh.csv';a.click()}});
