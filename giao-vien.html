<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VeduAI – Cổng giáo viên</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#EAF5FF;--card:#fff;--ink:#24305E;--mut:#5F6B92;--line:#C9DAF2;--sh:#B5CBEA;--mark:#FFD84D;--ok:#118A62;--err:#C2255C}
@media(prefers-color-scheme:dark){:root{--bg:#151B36;--card:#1F2850;--ink:#F1F4FF;--mut:#AAB4DC;--line:#38437A;--sh:#0E1328;--ok:#5FE0B0;--err:#FF9BB5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0) 12px calc(20px + env(safe-area-inset-bottom,0))}
main{max-width:720px;margin:0 auto;padding:14px 0}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 8px}.m{color:var(--mut);font-size:13px}
.c{background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--sh);padding:12px;margin:0 0 12px}
input,select,textarea{width:100%;min-height:42px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:6px 10px}
.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{appearance:none;border:0;background:var(--ink);color:var(--card);font:700 14px system-ui;min-height:40px;padding:0 16px;border-radius:999px;cursor:pointer}.b.l{background:var(--card);color:var(--ink);border:2px solid var(--line)}.b:disabled{opacity:.5}
.t button.on{background:var(--mark);color:#4A3700;border-color:#E3AE00}.err{color:var(--err);font-weight:700}.ok{color:var(--ok);font-weight:700}
.n{font:800 22px system-ui}.bx{word-break:break-all;border:2px dashed var(--line);border-radius:12px;padding:8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}.w{overflow-x:auto}
.vf{max-width:560px;margin:6px auto 0;padding:10px 8px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--mut,var(--muted,#5F6B92))}.vf a{color:inherit;font-weight:800}
/* ===== v6: rê chuột vào nhân vật -> giơ tay chào / mắt long lanh ===== */
.mascot{cursor:pointer}
.fx-owl{position:fixed;right:14px;bottom:14px;z-index:40;font-size:38px;line-height:1;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:var(--card,#fff);border:2px solid var(--line,#C9DAF2);box-shadow:0 4px 0 var(--sh,var(--shadow,#B5CBEA));cursor:pointer;user-select:none}
.fx-owl.up{bottom:88px}
.fx-rock{display:inline-block;transform-origin:50% 90%;animation:fxrock .5s ease-in-out 4 alternate both}
@keyframes fxrock{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.fx-glow{display:inline-block;animation:fxglow .55s ease-in-out 4 alternate both}
@keyframes fxglow{from{transform:scale(1);filter:drop-shadow(0 0 0 #FFD84D)}to{transform:scale(1.16);filter:drop-shadow(0 0 10px #FFC400) brightness(1.12)}}
.fx-say{position:fixed;z-index:9999;pointer-events:none;white-space:nowrap;background:var(--card,#fff);color:var(--ink,var(--text,#24305E));border:2px solid var(--line,#C9DAF2);border-radius:14px;padding:4px 12px;font:800 14px/1.3 system-ui,sans-serif;box-shadow:0 3px 0 var(--sh,var(--shadow,#B5CBEA));transform:translate(-50%,-100%);animation:fxsay 2.4s ease-out forwards}
@keyframes fxsay{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-115%)}}
.fx-p{position:fixed;z-index:9999;pointer-events:none;font-style:normal;line-height:1;transform:translate(-50%,-50%);animation:fxp 1.5s ease-out forwards}
@keyframes fxp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 70px)) scale(1.15) rotate(var(--r))}}
.fx-hand{animation:fxhand .45s ease-in-out 5 alternate both;transform-origin:70% 90%}
@keyframes fxhand{from{transform:translate(-50%,-50%) rotate(-22deg)}to{transform:translate(-50%,-50%) rotate(26deg)}}
@media(prefers-reduced-motion:reduce){.fx-rock,.fx-glow,.fx-hand,.fx-p{animation:none}.fx-say{animation:none;opacity:1}}

/* ===== v7: nhân vật hoạt hình chibi (rê chuột -> chào / mắt long lanh) ===== */
.cast{position:relative;display:inline-block;flex:none;width:84px;line-height:0}
.cast.fl{position:fixed;right:10px;bottom:6px;width:72px;z-index:40}
.cast.fl.up{bottom:84px}
.cast svg.cs{display:block;width:100%;height:auto;cursor:pointer;overflow:visible;touch-action:manipulation;-webkit-tap-highlight-color:transparent;animation:csbob 3.4s ease-in-out infinite}
.cast svg.cs:focus{outline:none}.cast svg.cs:focus-visible{outline:3px solid #14C7D8;outline-offset:3px;border-radius:12px}
@keyframes csbob{50%{transform:translateY(-5px)}}
.cast .eyes{transform-box:fill-box;transform-origin:center;animation:csblink 4.5s infinite}
@keyframes csblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.cast .stw{transform-box:fill-box;transform-origin:center;animation:cstw 2s ease-in-out infinite}
@keyframes cstw{0%,100%{transform:scale(.5) rotate(0);opacity:.5}50%{transform:scale(1.25) rotate(45deg);opacity:1}}
.cast .fxarm{transform-box:view-box;transform-origin:148px 170px;animation:csarm .5s ease-in-out 5 alternate both}
@keyframes csarm{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
.cast .fxarc{animation:csarc .5s ease-in-out 5 alternate both}
@keyframes csarc{from{opacity:.2}to{opacity:1}}
.cast .fxeye{transform-box:fill-box;transform-origin:center;animation:cseye .6s ease-in-out 4 alternate both}
@keyframes cseye{from{transform:scale(.94)}to{transform:scale(1.1)}}
.cast .fxglint{transform-box:fill-box;transform-origin:center;animation:csgl .5s ease-in-out infinite alternate}
@keyframes csgl{from{transform:scale(.55) rotate(0);opacity:.55}to{transform:scale(1.25) rotate(40deg);opacity:1}}
.cast .csay{position:absolute;z-index:30;pointer-events:none;white-space:nowrap;line-height:1.3;background:var(--card,#fff);color:var(--ink,var(--text,#24305E));border:2px solid var(--line,#C9DAF2);border-radius:14px;padding:4px 12px;font:800 13.5px/1.3 system-ui,sans-serif;box-shadow:0 3px 0 var(--sh,var(--shadow,#B5CBEA));left:50%;top:-4px;transform:translate(-50%,-100%);animation:cssay 2.4s ease-out forwards}
.cast.fl .csay{left:auto;right:0;transform:translate(0,-100%);animation-name:cssayr}
@keyframes cssay{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-115%)}}
@keyframes cssayr{0%{opacity:0;transform:translate(0,-70%) scale(.6)}12%{opacity:1;transform:translate(0,-100%) scale(1.08)}20%{transform:translate(0,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(0,-115%)}}
.cast .cup{position:absolute;z-index:30;pointer-events:none;font-style:normal;line-height:1;transform:translate(-50%,-50%);animation:csup 1.5s ease-out forwards}
@keyframes csup{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 70px)) scale(1.15) rotate(var(--r))}}
@media(max-width:480px){.cast.fl{width:58px}.cast.fl.up{bottom:80px}}
@media(prefers-reduced-motion:reduce){.cast svg.cs,.cast .eyes,.cast .stw,.cast .fxarm,.cast .fxarc,.cast .fxeye,.cast .fxglint,.cast .cup{animation:none}.cast .csay{animation:none;opacity:1}}
</style></head><body><main id="app"></main>
<footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer><script>
const API='https://devotee-outclass-couch.ngrok-free.dev/webhook',H={'ngrok-skip-browser-warning':'1','Content-Type':'application/json'};
const PAGE_BAI='https://veduai-vn.github.io/bai-tap.html', BOT='https://t.me/MotSachVedu_Bot', LIEN_HE=BOT;   // sửa LIEN_HE thành link Zalo/Telegram của admin
const $=document.getElementById('app'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);let cred={dl:(q.get('dl')||'').replace(/[^\w-]/g,''),k:(q.get('k')||'').replace(/[^\w-]/g,'')};
try{if(!cred.dl){cred=JSON.parse(localStorage.getItem('gv')||'{}')}else{localStorage.setItem('gv',JSON.stringify(cred));history.replaceState(null,'',location.pathname)}}catch(e){}
let D=null,tab='tq',view=null,form=null,msg='',ai=null;
const post=async(p,b)=>{try{return await (await fetch(API+'/'+p,{method:'POST',headers:H,body:JSON.stringify(Object.assign({},cred,b))})).json()}catch(e){return{ok:false,loi:'Không kết nối được, thử lại sau.'}}};
async function vao(){if(!cred.dl||!cred.k)return dangNhap();$.innerHTML='<p class="m">Đang tải…</p>';const j=await post('gv-vao',{});if(!j.ok){msg=j.loi;return dangNhap()}D=j;ve()}
function dangNhap(){$.innerHTML=`<h1>👩‍🏫 VeduAI – Cổng giáo viên</h1><p class="m">Gói giáo viên MIỄN PHÍ: giao bài, tạo bài kiểm tra online (trắc nghiệm, trả lời ngắn, tự luận chụp ảnh), chấm tự động và báo cáo điểm mạnh, điểm yếu của cả lớp.</p>
<div class="c g"><h2>Đăng nhập</h2><input id="dl" placeholder="Mã giáo viên" value="${esc(cred.dl||'')}"><input id="k" type="password" placeholder="Mã truy cập"><button class="b" id="in">Vào</button><p class="err">${esc(msg)}</p></div>
<div class="c g"><h2>Chưa có tài khoản? Đăng ký miễn phí</h2><input id="rt" placeholder="Họ và tên giáo viên"><input id="rr" placeholder="Trường"><input id="rs" placeholder="Số điện thoại (không bắt buộc)"><input id="hp" style="display:none" tabindex="-1" autocomplete="off"><button class="b" id="up">Đăng ký</button><p id="ru" class="err"></p></div>`}
function ve(){const g=D.gv,lops=[...new Set(D.hs.map(x=>x.ten_lop).filter(Boolean))].sort();
 const T=(k,t)=>`<button class="b l ${tab===k?'on':''}" data-t="${k}">${t}</button>`;
 let h=`<div class="r" style="justify-content:space-between"><div><h1>Xin chào ${esc(g.ten||g.ma)}</h1><span class="m">${esc(g.truong)} · mã ${esc(g.ma)}</span></div><button class="b l" id="out">Thoát</button></div><div class="r t" style="margin:10px 0">${T('tq','Tổng quan')}${T('hs','Học sinh ('+D.hs.length+')')}${T('bg','Bài giao ('+D.bai.length+')')}</div><p class="ok">${esc(msg)}</p>`;
 if(view)return $.innerHTML=h+vKQ();if(ai)return $.innerHTML=h+vAI();if(form)return $.innerHTML=h+vForm();
 if(tab==='tq'){const ln=PAGE_BAI;h+=`<div class="c"><h2>Tài khoản</h2>${g.ban?`<div class="s"><div><div class="n">${g.mua}</div><span class="m">Đã mua</span></div><div><div class="n">${g.dung+g.giu}</div><span class="m">Đã dùng/giữ</span></div><div><div class="n">${g.conLai}</div><span class="m">Còn lại</span></div></div><p class="m">Link bán (gửi hoặc in QR cho học sinh):</p><div class="bx">https://t.me/MotSachVedu_Bot?start=dl_${esc(g.ma)}</div>`:`<p>Tài khoản miễn phí: dùng đầy đủ giao bài và kiểm tra. Muốn bán gói học cho học sinh và nhận doanh thu, liên hệ admin để nâng cấp.</p><a class="b" href="${LIEN_HE}" style="display:inline-flex;align-items:center;text-decoration:none">Liên hệ nâng cấp</a>`}</div>
 <div class="c"><h2>Miễn phí cho giáo viên</h2><p class="m">✔ Tải tài liệu (PDF, Word, ảnh, văn bản) lên, AI tự soạn bài tập hoặc bài kiểm tra, thầy/cô xem lại và chỉnh sửa<br>✔ Hoặc tự soạn: trắc nghiệm, trả lời ngắn, tự luận (học sinh chụp ảnh)<br>✔ Xem điểm cả lớp, chấm lại từng câu<br>✔ Học sinh đăng ký miễn phí (30 giây) rồi làm bài bằng link thầy/cô gửi. Trang học sinh: https://veduai-vn.github.io/hoc-sinh.html</p><div class="r"><button class="b" id="newai">✨ AI soạn bài từ tài liệu</button><button class="b l" id="new">+ Tự soạn bài</button></div></div>`}
 if(tab==='hs'){h+=`<div class="c"><div class="r"><select id="fl" style="max-width:180px"><option value="">Tất cả lớp</option>${lops.map(l=>`<option ${l===(window.FL||'')?'selected':''}>${esc(l)}</option>`).join('')}</select><button class="b l" id="csv">Tải CSV</button></div></div>
 <div class="c w"><table><tr><th>Họ tên</th><th>Ngày sinh</th><th>Lớp</th><th>Trường</th><th>Gói</th></tr>${D.hs.filter(x=>!window.FL||x.ten_lop===window.FL).map(x=>`<tr><td>${esc(x.ten)}</td><td>${esc(x.ngay_sinh.split('-').reverse().join('/'))}</td><td>${esc(x.ten_lop||x.lop)}</td><td>${esc(x.truong)}</td><td>${x.trang_thai==='active'?'✅ đến '+esc(x.het_han.split('-').reverse().join('/')):esc(x.trang_thai)}</td></tr>`).join('')||'<tr><td colspan=5 class="m">Chưa có học sinh nào.</td></tr>'}</table></div>`}
 if(tab==='bg'){h+=`<div class="r" style="margin-bottom:10px"><button class="b" id="newai">✨ AI soạn bài từ tài liệu</button><button class="b l" id="new">+ Tự soạn bài</button></div>`+(D.bai.map(b=>`<div class="c"><b>${esc(b.tieu_de)}</b> <span class="m">${b.loai==='kiem_tra'?'Kiểm tra':'Bài tập'} · ${esc(b.mon||'')} ${b.ten_lop?'· Lớp '+esc(b.ten_lop):''}</span><br><span class="m">${b.so_cau||'?'} câu · ${b.so_bai_nop||0} bài nộp · ${b.trang_thai==='dong'?'🔒 đã đóng':'🟢 đang mở'}</span><div class="bx" style="margin:6px 0">${PAGE_BAI}?b=${esc(b.ma_bai)}</div><div class="r"><button class="b" data-kq="${esc(b.ma_bai)}">Xem điểm</button><button class="b l" data-cp="${esc(b.ma_bai)}">Chép link</button><button class="b l" data-dong="${esc(b.ma_bai)}" data-mo="${b.trang_thai==='dong'?1:0}">${b.trang_thai==='dong'?'Mở lại':'Đóng bài'}</button></div></div>`).join('')||'<p class="m">Chưa có bài nào.</p>')}
 $.innerHTML=h}
const QT={tn:'Trắc nghiệm',ngan:'Trả lời ngắn',tl:'Tự luận (chụp ảnh)'};
function newForm(){form={tieu_de:'',mon:'',ten_lop:'',loai:'bai_tap',thoi_gian_phut:0,han_nop:'',cho_xem_dap_an:true,cau:[{loai:'tn',kt:'',de:'',lc:'',dap_an:'A',diem:1}],err:''}}
function vForm(){const f=form;return (f.aiNote?`<div class="c"><span class="ok">${esc(f.aiNote)}</span></div>`:'')+`<div class="c g"><h2>Bài mới</h2><input data-f="tieu_de" placeholder="Tiêu đề" value="${esc(f.tieu_de)}"><div class="s"><input data-f="mon" placeholder="Môn" value="${esc(f.mon)}"><input data-f="ten_lop" placeholder="Lớp (7A2)" value="${esc(f.ten_lop)}"><select data-f="loai"><option value="bai_tap" ${f.loai==='bai_tap'?'selected':''}>Bài tập</option><option value="kiem_tra" ${f.loai==='kiem_tra'?'selected':''}>Kiểm tra</option></select></div>
<div class="s"><input data-f="thoi_gian_phut" type="number" min="0" placeholder="Phút (0=không giới hạn)" value="${f.thoi_gian_phut||''}"><input data-f="han_nop" type="date" value="${esc(f.han_nop)}"><label class="m"><input type="checkbox" data-f="cho_xem_dap_an" ${f.cho_xem_dap_an?'checked':''} style="width:auto;min-height:0"> Cho xem đáp án</label></div></div>
${f.cau.map((c,i)=>`<div class="c g"><div class="r"><b>Câu ${i+1}</b><select data-c="${i}" data-p="loai" style="max-width:190px">${Object.entries(QT).map(([k,v])=>`<option value="${k}" ${c.loai===k?'selected':''}>${v}</option>`).join('')}</select><input data-c="${i}" data-p="diem" type="number" step="0.25" min="0.25" value="${c.diem}" style="max-width:90px" title="Điểm"><button class="b l" data-rm="${i}">Xoá</button></div>
<textarea rows="2" data-c="${i}" data-p="de" placeholder="Đề bài">${esc(c.de)}</textarea>
<input data-c="${i}" data-p="kt" maxlength="50" placeholder="Kiến thức của câu (vd: Phân số, Hằng đẳng thức) - để báo cáo điểm mạnh/yếu" value="${esc(c.kt||'')}">
${c.loai==='tn'?`<textarea rows="4" data-c="${i}" data-p="lc" placeholder="Mỗi dòng một lựa chọn (A, B, C...)">${esc(c.lc)}</textarea><select data-c="${i}" data-p="dap_an">${'ABCDEF'.split('').map(x=>`<option ${c.dap_an===x?'selected':''}>${x}</option>`).join('')}</select><span class="m">Đáp án đúng</span>`:
 c.loai==='ngan'?`<input data-c="${i}" data-p="dap_an" placeholder="Đáp án đúng (nhiều đáp án chấp nhận: ngăn bằng dấu |)" value="${esc(c.dap_an)}">`:
 `<textarea rows="3" data-c="${i}" data-p="dap_an" placeholder="Đáp án mẫu / thang điểm để AI chấm theo">${esc(c.dap_an)}</textarea>`}</div>`).join('')}
<div class="r"><button class="b l" id="add">+ Thêm câu</button><button class="b" id="save">Lưu & lấy link</button><button class="b l" id="cancel">Huỷ</button></div><p class="err">${esc(f.err)}</p>`}
function pb(p){return `<div style="background:var(--line);border-radius:99px;height:8px;overflow:hidden;margin:2px 0 8px"><i style="display:block;height:100%;width:${p}%;background:${p>=80?'var(--ok)':p<60?'var(--err)':'var(--mark)'}"></i></div>`}
const f1=v=>v==null?'–':String(v).replace('.',',');
function vKQ(){const v=view,t=v.tong_quan||{},kt=t.kt||[],yeu=kt.filter(x=>x.pct<60),manh=kt.filter(x=>x.pct>=80).slice().reverse();
 const sm=a=>a.map(x=>esc(x.kt)+' ('+x.pct+'%)').join('; ');
 const tq=`<div class="c"><h2>📊 Báo cáo lớp</h2><div class="s"><div><div class="n">${t.so_cham||0}/${t.so_nop||0}</div><span class="m">Đã chấm / đã nộp</span></div><div><div class="n">${f1(t.tb10)}</div><span class="m">Điểm TB (thang 10)</span></div><div><div class="n">${f1(t.cao10)} / ${f1(t.thap10)}</div><span class="m">Cao nhất / thấp nhất</span></div></div>
${manh.length?`<p>💪 <b>Kiến thức cả lớp làm tốt:</b> ${sm(manh)}</p>`:''}${yeu.length?`<p>⚠️ <b>Cần ôn tập tăng cường:</b> ${sm(yeu)}</p>`:(kt.length?'<p class="m">Chưa có phần kiến thức nào yếu rõ rệt (dưới 60%).</p>':'')}
${kt.length?`<div style="margin-top:8px">${kt.map(x=>`<div class="m">${esc(x.kt)}: <b>${x.pct}%</b> (${x.so_hs} bạn)</div>${pb(x.pct)}`).join('')}</div>`:'<p class="m">Chưa có bài nộp đã chấm để phân tích.</p>'}
${(t.cau||[]).length?`<div class="w"><table><tr><th>Câu</th><th>Kiến thức</th><th>Tỷ lệ đúng</th></tr>${t.cau.map(c=>`<tr><td>${c.stt}. ${esc(c.de)}</td><td>${esc(c.kt||'–')}</td><td>${c.ty_le==null?'–':'<b>'+c.ty_le+'%</b>'}</td></tr>`).join('')}</table></div><p class="m">Gắn "Kiến thức" cho từng câu khi tạo bài để báo cáo chính xác hơn.</p>`:''}</div>`;

async function docTep(f){

<script>
/* v6: rê chuột (hoặc chạm) vào nhân vật -> luân phiên giơ tay chào / mắt long lanh */
(function(){
var SEL='.mascot,.big,.vq .vi,.fx-owl',FACE={'😊':'🤩','😢':'🥹','😃':'🤩','🙂':'🤩'};
var HI=['Xin chào! 👋','Chào bạn nhé! 👋','Mình là VeduAI nè! 👋','Hello! 👋'],WOW=['Long lanh quá! ✨','Học vui quá! 💖','Giỏi quá đi! ⭐','Cố lên nào! ✨'];
var next=new WeakMap(),busy=new WeakMap();
function pick(a){return a[Math.random()*a.length|0]}
function box(el){try{var r=document.createRange();r.selectNodeContents(el);var b=r.getBoundingClientRect();if(b.width&&b.height)return b}catch(e){}return el.getBoundingClientRect()}
function inside(e,b){return e.clientX>=b.left-6&&e.clientX<=b.right+6&&e.clientY>=b.top-6&&e.clientY<=b.bottom+6}
function say(b,t){var d=document.createElement('div');d.className='fx-say';d.setAttribute('aria-hidden','true');d.textContent=t;
 d.style.left=Math.min(Math.max(b.left+b.width/2,70),innerWidth-70)+'px';d.style.top=Math.max(b.top-4,34)+'px';document.body.appendChild(d);setTimeout(function(){d.remove()},2500)}
function rise(b,list,n){for(var i=0;i<n;i++)(function(i){var s=document.createElement('i');s.className='fx-p';s.setAttribute('aria-hidden','true');s.textContent=list[i%list.length];
 s.style.left=(b.left+b.width*(.1+Math.random()*.8))+'px';s.style.top=(b.top+b.height*(.2+Math.random()*.4))+'px';s.style.fontSize=(16+Math.random()*12)+'px';
 s.style.setProperty('--dx',((Math.random()-.5)*60)+'px');s.style.setProperty('--r',((Math.random()-.5)*50)+'deg');s.style.animationDelay=(i*.09)+'s';document.body.appendChild(s);setTimeout(function(){s.remove()},1900)})(i)}
function act(el){
 if(busy.get(el))return;busy.set(el,1);
 var mode=next.get(el)||(Math.random()<.5?'wave':'eyes');next.set(el,mode==='wave'?'eyes':'wave');
 var b=box(el),old=el.textContent,txt=old.trim(),done=[];
 if(mode==='wave'){
  el.classList.add('fx-rock');done.push(function(){el.classList.remove('fx-rock')});
  var h=document.createElement('i');h.className='fx-p fx-hand';h.setAttribute('aria-hidden','true');h.textContent='👋';
  h.style.left=(b.right+14)+'px';h.style.top=(b.top+b.height*.4)+'px';h.style.fontSize=Math.min(30,Math.max(22,b.height*.5))+'px';h.style.opacity=1;h.style.animationName='fxhand';
  document.body.appendChild(h);done.push(function(){h.remove()});
  say(b,pick(HI));rise(b,['✨'],3)}
 else{
  if(FACE[txt]&&el.children.length===0){el.textContent=FACE[txt];done.push(function(){if(el.isConnected)el.textContent=old})}
  el.classList.add('fx-glow');done.push(function(){el.classList.remove('fx-glow')});
  say(b,pick(WOW));rise(b,['✨','💖','⭐'],7)}
 setTimeout(function(){done.forEach(function(f){f()});busy.set(el,0)},2500)}
function hit(e){var t=e.target.closest&&e.target.closest(SEL);if(!t||busy.get(t))return;if(t.classList.contains('big')||t.classList.contains('vi')){if(!inside(e,box(t)))return}act(t)}
document.addEventListener('pointerover',hit);
document.addEventListener('click',hit);
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('fx-owl')){e.preventDefault();act(e.target)}});
})();
</script>
