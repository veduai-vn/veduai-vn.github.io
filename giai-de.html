<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Đáp án và lời giải – VeduAI</title>
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--ink:#1c2333;--mute:#5d6882;--line:#e3e8f2;
  --brand:#3b5bdb;--brand-soft:#e8edff;--ok:#12805c;--ok-soft:#e1f6ee;--bad:#c92a2a;--bad-soft:#fdeaea;--warn:#a05a00;--warn-soft:#fff3d6;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf6;--mute:#9aa5c0;--line:#27304a;
    --brand:#8da2ff;--brand-soft:#222d52;--ok:#4cd6a1;--ok-soft:#10372b;--bad:#ff8787;--bad-soft:#3d1c20;--warn:#ffc266;--warn-soft:#3b2d10;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-text-size-adjust:100%}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.2px;color:var(--brand);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px/1 inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 70px}
.hero{background:linear-gradient(135deg,var(--brand),#6741d9);color:#fff;border-radius:20px;padding:22px 22px 20px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 10px;font-size:clamp(20px,4.6vw,28px);line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 small{color:var(--mute);font-weight:500;font-size:13px}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.k{border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;text-decoration:none;color:var(--ink);background:var(--bg);line-height:1.25}
.k b{display:block;font-size:12px;color:var(--mute);font-weight:600}
.k span{display:block;font-size:18px;font-weight:800;color:var(--brand);min-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k.kq{border-color:var(--warn);background:var(--warn-soft)}
.k.hid span{color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.score{margin-left:auto;font-weight:700;color:var(--brand)}
.sec{margin-top:26px}
.sec-h{font-size:18px;font-weight:800;margin:0 0 4px}
.sec-g{color:var(--mute);font-size:14px;margin:0 0 10px}
details.pas{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;padding:2px 14px}
details.pas summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--brand)}
details.pas .txt{padding:0 0 12px;white-space:pre-wrap;font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.q.low{border-color:var(--warn)}
.q-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.no{background:var(--brand-soft);color:var(--brand);font-weight:800;border-radius:10px;padding:2px 12px;font-size:14px}
.tag{background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.de{white-space:pre-wrap;font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px;margin:0 0 4px;padding:0;list-style:none}
.o{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:var(--bg);text-align:left;width:100%;color:inherit;font:inherit}
.o:hover{border-color:var(--brand)}
.o .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px}
.o.right{border-color:var(--ok);background:var(--ok-soft)}
.o.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.o.wrong{border-color:var(--bad);background:var(--bad-soft)}
.o.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.o.pick{border-color:var(--brand)}
.ans{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--ok-soft);border-left:4px solid var(--ok)}
.ans .a{font-weight:800;color:var(--ok)}
.ans .e{margin-top:4px;white-space:pre-wrap;font-size:15px}
.rv{margin-top:10px}
.foot{margin-top:28px;color:var(--mute);font-size:13px;text-align:center}
.msg{max-width:520px;margin:12vh auto 0;text-align:center;padding:0 16px}
.msg .ic{font-size:44px}
.msg h2{margin:8px 0}
.msg p{color:var(--mute)}
.sk{height:84px;border-radius:16px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-top:14px}
@keyframes sh{to{background-position:-200% 0}}
.hide{display:none!important}
@media print{
  .bar,.tools,.rv{display:none!important}
  body{background:#fff;color:#000}
  .q,.panel,details.pas{box-shadow:none;break-inside:avoid}
  .hero{background:#fff;color:#000;border:1px solid #999}.chip{background:#eee;color:#000}
  details.pas{display:block}details.pas>*{display:block}
}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <div class="brand"><i>V</i>VeduAI</div><div class="sp"></div>
  <button class="btn hide" id="bPrint" type="button">🖨️ In / Lưu PDF</button>
</div></div>
<main class="wrap" id="app">
  <div class="sk"></div><div class="sk"></div><div class="sk"></div>
</main>

<script>
(function(){
'use strict';
/* ===== CẤU HÌNH: điền địa chỉ công khai của n8n (giống địa chỉ các trang khác như phieu-chon.html đang dùng) ===== */
var API_BASE = 'https://DIEN-DIA-CHI-NGROK-CUA-BAN.ngrok-free.app';
/* ========================================================================================================== */

var MON={toan:'Toán',van:'Ngữ văn',anh:'Tiếng Anh',ly:'Vật lý',hoa:'Hóa học',sinh:'Sinh học',su:'Lịch sử',dia:'Địa lý',gdcd:'GDCD',tin:'Tin học',congnghe:'Công nghệ',khac:''};
var app=document.getElementById('app'), bPrint=document.getElementById('bPrint');
var doc=null, show=true, picks={}, revealed={}, onlyLow=false;

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function params(){var p={};location.search.replace(/^\?/,'').split('&').forEach(function(kv){var a=kv.split('=');if(a[0])p[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||'');});return p;}
function base(){
  var p=params(), b=API_BASE;
  if(p.a && /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(ngrok-free\.app|ngrok\.app|ngrok\.io|ngrok-free\.dev|trycloudflare\.com)$/i.test(p.a)) b=p.a;
  return b.replace(/\/+$/,'');
}
function message(icon,title,text,retry){
  clear(app);var m=el('div','msg');m.appendChild(el('div','ic',icon));m.appendChild(el('h2','',title));m.appendChild(el('p','',text));
  if(retry){var b=el('button','btn on','Thử lại');b.type='button';b.onclick=load;m.appendChild(b);}
  app.appendChild(m);bPrint.classList.add('hide');
}
function load(){
  var t=(params().t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(t.length!==24){message('🔗','Link chưa đúng','Bạn mở lại link mới nhất mà bot đã gửi trong khung chat nhé.');return;}
  if(/DIEN-DIA-CHI/.test(base())){message('⚙️','Trang chưa được cấu hình','Quản trị viên cần điền địa chỉ máy chủ vào dòng API_BASE trong file giai-de.html.');return;}
  clear(app);for(var i=0;i<3;i++)app.appendChild(el('div','sk'));
  var ctl=('AbortController' in window)?new AbortController():null, to=setTimeout(function(){if(ctl)ctl.abort();},25000);
  fetch(base()+'/webhook/giai-de-lay?t='+t,{headers:{'ngrok-skip-browser-warning':'true'},signal:ctl?ctl.signal:undefined})
   .then(function(r){return r.json();})
   .then(function(j){clearTimeout(to);
     if(j&&j.ok&&j.doc){doc=j.doc;render();}
     else if(j&&j.loi==='het_han')message('⌛','Bài giải đã hết hạn','Bài giải được lưu 30 ngày. Bạn gửi lại ảnh đề cho bot để mình soạn lại nhé.');
     else message('🔍','Không tìm thấy bài giải','Link có thể bị sai hoặc bài giải chưa soạn xong. Bạn kiểm tra lại link mới nhất trong chat với bot nhé.');})
   .catch(function(){clearTimeout(to);message('📡','Chưa kết nối được','Máy chủ học đang bận hoặc mạng yếu. Bạn thử lại sau ít giây nhé.',true);});
}
function isMC(c){return c.lc&&c.lc.length>=2&&/^[A-H]$/i.test(String(c.dap_an||'').trim().charAt(0))&&String(c.dap_an||'').trim().length<=3;}
function letter(c){return String(c.dap_an||'').trim().charAt(0).toUpperCase();}
function optLetter(txt,i){var m=/^\s*([A-Ha-h])[\.\)\:]/.exec(txt);return m?m[1].toUpperCase():String.fromCharCode(65+i);}
function optText(txt){return String(txt).replace(/^\s*[A-Ha-h][\.\)\:]\s*/,'');}
function isShown(id){return show||revealed[id];}

function render(){
  clear(app);bPrint.classList.remove('hide');
  document.title=doc.tieu_de+' – VeduAI';
  var h=el('section','hero');h.appendChild(el('h1','',doc.tieu_de));
  var ch=el('div','chips');
  if(MON[doc.mon])ch.appendChild(el('span','chip',MON[doc.mon]));
  if(doc.lop)ch.appendChild(el('span','chip','Lớp '+doc.lop));
  ch.appendChild(el('span','chip',doc.tong+' câu'));
  if(doc.thoi_gian)ch.appendChild(el('span','chip','⏱ '+doc.thoi_gian));
  h.appendChild(ch);app.appendChild(h);

  var warn=[];
  if(doc.khong_chac&&doc.khong_chac.length)warn.push('Câu '+doc.khong_chac.join(', ')+' có chữ chưa rõ trong ảnh, hãy đối chiếu lại với đề giấy.');
  if(doc.chua_du)warn.push('Đề dài nên có thể còn vài câu cuối chưa được soạn. Bạn nhắn bot để soạn tiếp.');
  if(warn.length){var w=el('div','panel');w.style.borderColor='var(--warn)';w.style.background='var(--warn-soft)';w.style.color='var(--warn)';warn.forEach(function(x){w.appendChild(el('div','',x));});app.appendChild(w);}

  var tools=el('div','tools');
  var bShow=el('button','btn','');bShow.type='button';tools.appendChild(bShow);
  var bLow=null;
  if(doc.khong_chac&&doc.khong_chac.length){bLow=el('button','btn','⚠️ Chỉ câu cần đối chiếu ('+doc.khong_chac.length+')');bLow.type='button';tools.appendChild(bLow);}
  var sc=el('span','score','');tools.appendChild(sc);app.appendChild(tools);

  var kp=el('section','panel');var kh=el('h2','','Bảng đáp án nhanh');kh.appendChild(el('small','','Bấm vào số câu để nhảy tới lời giải'));kp.appendChild(kh);
  var kg=el('div','key');kp.appendChild(kg);app.appendChild(kp);

  var cards={},keys={},order=[];
  doc.phan.forEach(function(p,pi){
    var s=el('section','sec');s.appendChild(el('h2','sec-h',p.ten));
    if(p.huong_dan)s.appendChild(el('p','sec-g',p.huong_dan));
    if(p.doan_van){var d=el('details','pas');d.appendChild(el('summary','','📖 Xem đoạn văn / bài đọc'));d.appendChild(el('div','txt',p.doan_van));s.appendChild(d);}
    p.cau.forEach(function(c,ci){
      var id=pi+'_'+ci;order.push({id:id,c:c});
      var q=el('article','q'+(c.chac===false?' low':''));q.id='c'+id;
      var qh=el('div','q-h');qh.appendChild(el('span','no','Câu '+c.so));
      if(c.chac===false)qh.appendChild(el('span','tag','⚠️ Ảnh chưa rõ, nên đối chiếu'));
      q.appendChild(qh);q.appendChild(el('p','de',c.de));
      var mc=isMC(c),ol=null;
      if(mc){ol=el('div','opts');c.lc.forEach(function(o,oi){
        var L=optLetter(o,oi);var b=el('button','o','');b.type='button';b.dataset.l=L;
        b.appendChild(el('span','l',L));b.appendChild(el('span','',optText(o)));
        b.onclick=function(){if(isShown(id))return;picks[id]=L;revealed[id]=true;apply();};
        ol.appendChild(b);});q.appendChild(ol);}
      var rv=el('button','btn rv','👁 Xem đáp án câu này');rv.type='button';rv.onclick=function(){revealed[id]=true;apply();};q.appendChild(rv);
      var an=el('div','ans');var a=el('div','a','');var e=el('div','e',c.giai_thich||'');an.appendChild(a);if(c.giai_thich)an.appendChild(e);q.appendChild(an);
      s.appendChild(q);cards[id]={q:q,mc:mc,ol:ol,rv:rv,an:an,a:a,c:c};
      var k=el('a','k'+(c.chac===false?' kq':''),'');k.href='#c'+id;k.appendChild(el('b','',c.so));var kv=el('span','','');k.appendChild(kv);kg.appendChild(k);keys[id]={k:k,v:kv};
    });
    app.appendChild(s);
  });
  app.appendChild(el('p','foot','Đáp án do AI soạn từ ảnh đề. Nếu thấy chỗ nào chưa hợp lý, bạn hỏi lại bot hoặc thầy cô để chắc chắn nhé.'));

  function apply(){
    bShow.textContent=show?'🙈 Ẩn đáp án để tự làm':'👁 Hiện tất cả đáp án';bShow.className='btn'+(show?'':' on');
    var done=0,right=0;
    order.forEach(function(o){var id=o.id,c=o.c,r=cards[id],sh=isShown(id),pk=picks[id];
      r.an.classList.toggle('hide',!sh);r.rv.classList.toggle('hide',sh);
      r.a.textContent='Đáp án: '+(c.dap_an||'—');
      if(r.mc){Array.prototype.forEach.call(r.ol.children,function(b){var L=b.dataset.l;b.className='o';
        if(sh){if(L===letter(c))b.classList.add('right');else if(pk&&L===pk)b.classList.add('wrong');}});}
      var kk=keys[id];kk.v.textContent=sh?(r.mc?letter(c):'✎'):'•';kk.k.classList.toggle('hid',!sh);
      if(pk&&!show){done++;if(pk===letter(c))right++;}
      r.q.classList.toggle('hide',onlyLow&&c.chac!==false);
    });
    sc.textContent=(!show&&done)?('Đã chọn '+done+' câu · đúng '+right):'';
  }
  bShow.onclick=function(){show=!show;if(show){revealed={};}else{picks={};revealed={};}apply();};
  if(bLow)bLow.onclick=function(){onlyLow=!onlyLow;bLow.className='btn'+(onlyLow?' on':'');apply();};
  apply();
}
bPrint.onclick=function(){var s=show,r=revealed;show=true;render();window.print();show=s;revealed=r;render();};
load();
})();
</script>
</body>
</html>
