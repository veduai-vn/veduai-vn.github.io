function answered(){var n=0;order.forEach(function(o){var id=o.id;if(picks[id]||(texts[id]&&texts[id].trim()))n++;});return n;}
function updBar(){
  var tot=order.length,an=answered(),tt=document.getElementById('tt'),pg=document.getElementById('pg');
  if(tt)tt.textContent='Đã làm '+an+'/'+tot+' câu'+(an===tot?' · nộp bài thôi! 🚀':'');
  if(pg)pg.style.width=(tot?Math.round(an/tot*100):0)+'%';
}
function apply(){
  var sh=isShown();
  order.forEach(function(o){
    var id=o.id,c=o.c,r=cards[id],pk=picks[id],tx=(texts[id]||'').trim();
    r.an.classList.toggle('hide',!sh);
    var good=null;
    if(r.mc&&sh&&pk)good=(pk===letter(c));
    if(r.mc){Array.prototype.forEach.call(r.ol.children,function(b){var L=b.dataset.l;b.className='o';
      if(sh){if(L===letter(c))b.classList.add('right');else if(pk&&L===pk)b.classList.add('wrong');}
      else if(pk===L)b.classList.add('pick');});}
    r.a.className='a'+(good===true?' good':(good===false?' bad':''));
    r.a.textContent=(good===true?'✅ Chính xác! ':(good===false?'❌ Chưa đúng. ':''))+'Đáp án: '+(c.dap_an||'—');
    if(r.ta){r.ta.disabled=submitted;}
    r.mine.classList.toggle('hide',!(sh&&!r.mc&&tx));
    r.mine.textContent=(sh&&!r.mc&&tx)?'Bài làm của bạn: '+tx:'';
    var kk=keys[id],has=!!(pk||tx);
    kk.v.textContent=sh?(r.mc?letter(c):'✎'):(has?'✓':'•');
    kk.k.classList.toggle('done',!sh&&has);
    kk.k.classList.toggle('ok',sh&&good===true);
    kk.k.classList.toggle('bad',sh&&good===false);
    r.q.classList.toggle('hide',onlyLow&&c.chac!==false);
  });
  if(bar)updBar();
}
function buildResult(){
  var mcs=order.filter(function(o){return cards[o.id].mc;}),n=mcs.length,right=0,wrong=[];
  mcs.forEach(function(o){var pk=picks[o.id];if(pk&&pk===letter(o.c))right++;else wrong.push(o);});
  var other=order.length-n;
  var box=el('section','card res');box.id='res';
  var d10=n?Math.round(right/n*100)/10:null;
  var ico,tt;
  if(d10===null){ico='📝';tt='Bạn đã nộp bài! Hãy đối chiếu đáp án mẫu bên dưới nhé.';}
  else if(d10>=9){ico='🏆';tt='Chúc mừng bạn xuất sắc! 🎉';}
  else if(d10>=6){ico='😊';tt='Cố gắng lên nhé, bạn gần đến đích rồi!';}
  else{ico='💪';tt='Cố gắng lên bạn nhé! Mọi thứ sẽ đạt được khi bạn quyết tâm và chăm chỉ.';}
  box.appendChild(el('div','ico',ico));box.appendChild(el('div','tt',tt));
  if(n){box.appendChild(el('div','sc',String(d10).replace('.',',')+'/10'));box.appendChild(el('p','sub','Đúng '+right+'/'+n+' câu trắc nghiệm'));}
  if(other)box.appendChild(el('p','sub','Còn '+other+' câu điền từ / tự luận: bạn tự đối chiếu với đáp án mẫu bên dưới.'));
  if(wrong.length&&n){box.appendChild(el('p','sub','Các câu cần xem lại (bấm để nhảy tới):'));
    var wr=el('div','wr');wrong.forEach(function(o){var a=el('a','','Câu '+o.c.so);a.href='#c'+o.id;wr.appendChild(a);});box.appendChild(wr);}
  if(order.length){
    box.appendChild(el('p','sub','Kết quả từng câu (bấm để nhảy tới câu đó):'));
    var rt=el('div','rt');
    order.forEach(function(o){
      var r=cards[o.id],c=o.c,pk=picks[o.id],a=el('a','rc','');a.href='#c'+o.id;
      a.appendChild(el('b','','Câu '+c.so));
      if(r.mc){
        if(pk&&pk===letter(c)){a.className='rc ok';a.appendChild(el('span','mk','✓'));a.appendChild(el('span','',letter(c)));}
        else{a.className='rc bad';a.appendChild(el('span','mk','✗'));
          var cs=el('span','','');if(pk)cs.appendChild(el('s','',pk));else cs.textContent='bỏ trống';a.appendChild(cs);
          a.appendChild(el('span','dd','Đúng: '+letter(c)));}
      }else{a.appendChild(el('span','mk','✎'));a.appendChild(el('span','','tự đối chiếu'));}
      rt.appendChild(a);
    });
    box.appendChild(rt);
    box.appendChild(el('p','rt-leg','✓ xanh: làm đúng · ✗ đỏ: làm sai (đáp án bạn chọn bị gạch ngang, kèm đáp án đúng)'));
  }
  box.appendChild(el('div','qt','💡 '+QUOTES[Math.floor(Math.random()*QUOTES.length)]));
  var nx=el('p','sub','');nx.id='nhanxet';nx.style.fontWeight='700';box.appendChild(nx);
  if(reported==='ok')nx.textContent='📨 Nhận xét điểm yếu và gợi ý ôn tập đã gửi vào chat với bot.';
  box.appendChild(el('p','sub','👉 Bạn muốn làm gì tiếp?'));
  var acts=el('div','acts');tiepBtns().forEach(function(x){acts.appendChild(x);});
  var b2=el('button','btn','✅ Chỉ xem lời giải');b2.type='button';b2.onclick=function(){start('chua');};acts.appendChild(b2);box.appendChild(acts);
  if(d10!==null&&d10>=6)setTimeout(pop,300);
  return box;
}
function postApi(path,body,cb){
  var ctl=('AbortController' in window)?new AbortController():null, to=setTimeout(function(){if(ctl)ctl.abort();},20000);
  fetch(base()+'/webhook/'+path,{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
   .then(function(r){return r.json();}).then(function(j){clearTimeout(to);cb(j&&j.ok?'ok':((j&&j.loi)||'loi'));})
   .catch(function(){clearTimeout(to);cb('loi');});
}

function baoKetQua(){
  if(!SES||!TOK||mode!=='lam')return;
  var kq=[],right=0,nmc=0;
  order.forEach(function(o){var c=o.c,mc=cards[o.id].mc,pk=picks[o.id]||'',tl=(texts[o.id]||'').trim();
    var d=null;if(mc){nmc++;d=(pk&&pk===letter(c));if(d)right++;}
    kq.push({so:String(c.so),mc:mc?1:0,chon:pk||tl.slice(0,200),dap:String(c.dap_an||'').slice(0,200),dung:d});});
  var d10=nmc?Math.round(right/nmc*100)/10:null;
  reported='wait';setNote('📨 Mình đang soạn nhận xét điểm mạnh / điểm yếu để gửi vào chat với bot…');
  postApi('giai-de-nop',{t:TOK,s:SES,diem:d10,dung:right,tong_mc:nmc,kq:kq},function(r){
    if(r==='ok'){reported='ok';setNote('📨 Xong rồi! Nhận xét điểm yếu và gợi ý ôn tập sẽ được gửi vào chat với bot trong ít phút (cho bạn và phụ huynh nếu đã kết nối).');}
    else{reported='loi';setNote('Mình chưa gửi được nhận xét lần này. Bạn cứ xem kết quả ở trên nhé.');}
  });
}

    say('Mình đang gửi menu cho bạn…');
    postApi('giai-de-ket-thuc',{t:TOK,s:SES},function(r){
      if(r==='ok'){t.textContent='Mình đã gửi menu vào chat';m.textContent='Bạn quay lại khung chat với bot để chọn dịch vụ nhé.';if(inTG){setTimeout(function(){try{W.close();}catch(e){}},2500);}}
      else{t.textContent='Chưa gửi được menu';m.textContent='Bạn nhắn "menu" cho bot nhé.';}
      xemDe();});
  }
}
function nop(){
  var tot=order.length,an=answered();
  if(an<tot&&!window.confirm('Bạn còn '+(tot-an)+' câu chưa làm. Vẫn nộp bài?'))return;
  submitted=true;
  if(bar&&bar.parentNode)bar.parentNode.removeChild(bar);bar=null;
  render();window.scrollTo(0,0);baoKetQua();
  if(inTG){try{W.HapticFeedback&&W.HapticFeedback.notificationOccurred('success');}catch(e){}}
}
load();
})();
