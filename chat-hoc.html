<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Mọt sách – Chat học</title>
<style>
:root{--bg:#EAF5FF;--card:#fff;--ink:#24305E;--mut:#5F6B92;--line:#C9DAF2;--sh:#B5CBEA;--mark:#FFD84D;--err:#C2255C;--me:#DCEBFF}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px}.top b{font-size:18px}.m{color:var(--mut);font-size:14px}
.c{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--sh);padding:14px;margin:12px 0}
input,textarea{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;padding:10px 12px}
.b{appearance:none;border:0;background:var(--ink);color:#fff;font:800 16px system-ui;min-height:46px;padding:0 20px;border-radius:999px;cursor:pointer}.b:disabled{opacity:.5}.b.l{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chips button{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 14px system-ui;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:6px 2px}.bb{max-width:88%;padding:10px 13px;border-radius:16px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word;border:2px solid var(--line);background:var(--card)}.bb.me{margin-left:auto;background:var(--me)}
.bar{display:flex;gap:6px;align-items:flex-end;padding:8px 0}#thanh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#o{flex:1;min-height:46px;max-height:120px;resize:none}
.err{color:var(--err);font-weight:700}</style>
<link rel="stylesheet" href="mot-sach.css?v=2">
</head><body class="ms"><div id="app"><p class="m" style="padding:20px">Đang mở…</p></div>
<script src="vedu-chat-tools.js"></script>
<script>
const API='https://devotee-outclass-couch.ngrok-free.dev/webhook',H={'ngrok-skip-browser-warning':'1','Content-Type':'application/json'},SK='vedu_chat_hoc';
const app=document.getElementById('app'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
let busy=false;
const post=async(p,b)=>{try{return await (await fetch(API+'/'+p,{method:'POST',headers:H,body:JSON.stringify(b)})).json()}catch(e){return{ok:false,loi:'mang'}}};
const LOI={phien_het_han:'Phiên đăng nhập đã hết hạn. Bạn nhập mã mới nhé.',ma_sai:'Mã chưa đúng hoặc đã hết hạn (mã dùng được 10 phút, 1 lần).',thu_lai_sau:'Nhập sai nhiều lần, bạn chờ ít phút rồi thử lại nhé.',mang:'Không kết nối được, kiểm tra mạng rồi thử lại nhé.',ai_ban:'Bạn học AI đang bận, bạn gửi lại sau ít giây nhé.'};
function dn(msg){app.innerHTML=`<div class="top"><b>🎒 Chat học Mọt sách</b></div><div class="c"><h3 style="margin:0 0 6px">Đăng nhập bằng mã</h3><p class="m" style="margin:0 0 10px">Ba/mẹ nhắn “ma web” cho bot Mọt sách Phụ huynh để nhận mã 6 số, rồi nhập vào đây.</p><input id="ma" inputmode="numeric" maxlength="6" placeholder="Mã 6 số"><p class="err" id="er">${esc(msg||'')}</p><button class="b" id="go">Vào học</button></div>`;
 document.getElementById('go').onclick=async()=>{const ma=document.getElementById('ma').value.replace(/\D/g,'');if(ma.length!==6)return document.getElementById('er').textContent='Nhập đủ 6 số nhé.';
  const j=await post('web-ma-doi',{ma});if(!j.ok)return document.getElementById('er').textContent=LOI[j.loi]||'Chưa vào được, thử lại nhé.';
  S={k:j.k,hs:j.hs,u:j.hs.length===1?j.hs[0].u:''};luu();S.u?chat():chon()}}
function luu(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function chon(){app.innerHTML=`<div class="top"><b>Bạn là ai?</b></div><div class="c">${S.hs.map((h,i)=>`<button class="b l" style="width:100%;margin:6px 0" data-i="${i}">${esc(h.ten)}${h.lop?' – lớp '+esc(h.lop):''}</button>`).join('')}</div>`;
 app.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{S.u=S.hs[b.dataset.i].u;luu();chat()})}
function them(cls,t){const l=document.getElementById('log'),d=document.createElement('div');d.className='bb '+cls;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;return d}
function chat(){const h=S.hs.find(x=>x.u===S.u)||{ten:'bạn'};
 app.innerHTML=`<div class="top"><div><b>Chào ${esc(h.ten)} 👋</b><br><span class="m">Gõ, nói hoặc gửi ảnh/tài liệu để hỏi bài</span></div><button class="b l" id="out">Thoát</button></div>
 <div class="chips"><button data-c="/hoc45">📖 Học 45 phút</button><button data-c="/hoinhanh">❓ Hỏi nhanh</button><button data-c="/onthi">📝 Ôn thi</button><button data-c="/bi">🐻 Nói tiếng Anh</button></div>
 <div id="log"></div><div class="bar"><div id="thanh"></div><textarea id="o" rows="1" placeholder="Nhập câu hỏi…"></textarea><button class="b" id="gui">Gửi</button></div>`;
 them('bi','Mình là bạn học AI của bạn. Bạn chọn một nút phía trên hoặc cứ nhắn câu hỏi nhé. Bạn bấm 📎 để gửi ảnh bài tập, PDF hoặc Word; bấm 🎤 để nói.');
 VeduChatTools.init({input:'#o',bar:'#thanh'});
 const o=document.getElementById('o');
 async function gui(text){if(busy)return;const kem=VeduChatTools.lay();text=(text||'').trim();if(!text&&!kem.anh&&!kem.van_ban)return;
  busy=true;document.getElementById('gui').disabled=true;
  them('me',text+(kem.ten_file?'\n📎 '+kem.ten_file:'')||'📎');o.value='';const w=them('bi','…');
  const j=await post('web-chat',Object.assign({k:S.k,u:S.u,text},kem));busy=false;document.getElementById('gui').disabled=false;
  if(j.ok)w.textContent=j.reply;else{w.textContent=LOI[j.loi]||'Chưa gửi được, bạn thử lại nhé.';if(j.loi==='phien_het_han'){S=null;try{localStorage.removeItem(SK)}catch(e){}setTimeout(()=>dn(LOI.phien_het_han),1500)}}}
 document.getElementById('gui').onclick=()=>gui(o.value);
 o.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();gui(o.value)}});
 app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>gui(b.dataset.c));
 document.getElementById('out').onclick=()=>{S=null;try{localStorage.removeItem(SK)}catch(e){}dn()}}
S&&S.k?(S.u?chat():chon()):dn();
</script><script src="bi-bar.js"></script>
</body></html>
