<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mọt sách - Vào học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#EAF5FF;--card:#fff;--ink:#24305E;--muted:#5F6B92;--line:#C9DAF2;--shadow:#B5CBEA;--mark:#FFD84D;--mark-d:#E3AE00;--pop:#FF7A90;--ok:#118A62;--me:#CFE8FF;
--font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--disp:'Baloo 2','Nunito',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#151B36;--card:#1F2850;--ink:#F1F4FF;--muted:#AAB4DC;--line:#38437A;--shadow:#0E1328;--me:#2B3A78}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--paper);background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:26px 26px;color:var(--ink);font:700 18px/1.4 var(--font);overflow-x:hidden}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh}
.top{display:flex;align-items:center;gap:8px;min-height:52px;position:sticky;top:0;z-index:12;background:var(--paper);padding:6px 0;margin-top:-6px}
.ib{appearance:none;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;width:58px;height:58px;font-size:25px;cursor:pointer;box-shadow:0 4px 0 var(--shadow);flex:none;transition:transform .12s,box-shadow .12s,opacity .2s;line-height:1;padding:2px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ib small{font:800 10px/1 var(--font);color:var(--muted)}
.ib.vo{opacity:.35;pointer-events:none}
.gap{flex:1}
.sec{margin:20px 4px 8px;font:800 19px var(--disp);color:var(--ink);display:flex;gap:8px;align-items:center}
.sec em{font:800 13px var(--font);font-style:normal;background:var(--mark);color:#24305E;border-radius:999px;padding:2px 10px}
.btn.khoa{opacity:.65;border-style:dashed;box-shadow:0 3px 0 var(--shadow)}
.btn.khoa small{color:var(--pop)}
.btn small{font:700 13px var(--font);color:var(--muted);line-height:1.15}
.ib:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.ib[hidden]{visibility:hidden;display:block}
.ib.off{opacity:.55}
.mid{flex:1;display:flex;justify-content:center;align-items:center;min-width:0}
.dots{display:flex;gap:7px;justify-content:center;margin:2px 0 0}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:.3s}
.dots i.on{background:var(--mark-d);transform:scale(1.25)}
.dung{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:14px;z-index:30;appearance:none;border:3px solid var(--pop);background:var(--pop);color:#fff;border-radius:999px;font:800 16px var(--disp);padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 #C94A63;animation:nhip 1s ease-in-out infinite}
.dung[hidden]{display:none}
@keyframes nhip{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.hero{display:flex;gap:10px;align-items:flex-end;margin:12px 0 16px}
.bicot{display:flex;flex-direction:column;align-items:center;flex:none;gap:2px}
.gamebi{appearance:none;border:2px solid var(--mark-d);background:var(--mark);color:#24305E;border-radius:999px;padding:3px 10px;font:800 12px/1.1 var(--font);cursor:pointer;box-shadow:0 3px 0 var(--mark-d);white-space:nowrap;animation:nhip 2s ease-in-out infinite}
.gamebi:active{transform:translateY(3px);box-shadow:none}
.btn.rong{grid-column:1/-1;min-height:96px}
.bi{font-size:72px;line-height:1;flex:none;animation:lac 2.6s ease-in-out infinite;transform-origin:50% 90%;cursor:pointer;user-select:none}
.bi.nhay{animation:nhay .6s ease-out}
@keyframes lac{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translateY(-4px)}}
@keyframes nhay{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-22px) scale(1.12) rotate(-8deg)}70%{transform:translateY(0) scale(.95)}100%{transform:none}}
.bubble{background:var(--card);border:3px solid var(--line);border-radius:26px 26px 26px 6px;padding:12px 18px;box-shadow:0 5px 0 var(--shadow);font:800 23px/1.25 var(--disp)}
.bubble small{display:block;font:700 15px var(--font);color:var(--muted);margin-top:4px}
.grid{display:grid;gap:12px;position:relative}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.btn{appearance:none;border:3px solid var(--line);background:var(--card);color:var(--ink);font:800 19px var(--disp);border-radius:24px;box-shadow:0 6px 0 var(--shadow);cursor:pointer;min-height:84px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;text-decoration:none;transition:transform .12s,box-shadow .12s,background .2s;animation:hien .45s both}
.btn:active{transform:translateY(5px) scale(.97);box-shadow:0 1px 0 var(--shadow)}
.btn .ic{font-size:38px;line-height:1.1;display:inline-block}
.btn:active .ic{animation:nay2 .4s}
.btn.lop{font-size:34px;min-height:92px}
.btn.lop small{font:700 13px var(--font);color:var(--muted)}
.btn.big{min-height:140px;font-size:23px;padding:14px}
.btn.big .ic{font-size:60px}
.btn.big small{font:700 15px var(--font);color:var(--muted)}
.btn.sel{background:var(--mark);border-color:var(--mark-d);color:#24305E}
.btn.lacb .ic{animation:lacb .9s ease-in-out}
@keyframes hien{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@keyframes nay2{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1)}}
@keyframes lacb{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.2)}40%{transform:rotate(12deg) scale(1.2)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.tay{position:absolute;font-size:46px;pointer-events:none;animation:chi 1s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15));z-index:3}
@keyframes chi{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.chip{appearance:none;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:800 16px var(--font);padding:9px 16px;cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .12s}
.chip:active{transform:translateY(4px) scale(.96);box-shadow:none}
.chipbar{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.pop{animation:nay .35s ease-out}
@keyframes nay{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
/* nút nổi hỏi nhanh */
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;appearance:none;border:3px solid #C94A63;background:var(--pop);color:#fff;border-radius:999px;font:800 19px var(--disp);padding:12px 20px 12px 16px;cursor:pointer;box-shadow:0 5px 0 #C94A63,0 10px 20px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center;animation:fabn 2.2s ease-in-out infinite}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 #C94A63}
.fab[hidden]{display:none}
.fab b{font-size:26px;font-weight:400}
@keyframes fabn{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* ngăn kéo menu */
.ngan{position:fixed;inset:0;z-index:50;background:rgba(10,15,40,.55);display:flex;align-items:flex-end;justify-content:center;animation:mo .2s}
.ngan[hidden]{display:none}
@keyframes mo{from{opacity:0}to{opacity:1}}
.tam{background:var(--paper);width:100%;max-width:640px;border-radius:28px 28px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:len .28s ease-out}
@keyframes len{from{transform:translateY(60px)}to{transform:none}}
.tam h3{margin:2px 4px 12px;font:800 24px var(--disp);display:flex;justify-content:space-between;align-items:center}
.mn{appearance:none;width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:10px 14px;margin:0 0 10px;font:800 19px var(--disp);cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .12s}
.mn:active{transform:translateY(4px);box-shadow:none}
.mn .ic{font-size:34px;flex:none;width:44px;text-align:center}
.mn small{display:block;font:700 14px var(--font);color:var(--muted)}
.mn.dong{background:var(--pop);border-color:#C94A63;color:#fff;justify-content:center}
/* chat */
.khung{display:flex;flex-direction:column;gap:10px;margin:0 0 12px}
.tin{max-width:88%;padding:10px 14px;border-radius:20px;border:3px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--shadow);font:700 18px/1.45 var(--font);word-wrap:break-word;animation:hien .3s both}
.tin.me{align-self:flex-end;background:var(--me);border-radius:20px 20px 6px 20px}
.tin.bi{align-self:flex-start;border-radius:20px 20px 20px 6px}
.tin .nghe{display:inline-block;margin-top:6px;appearance:none;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font:800 14px var(--font);cursor:pointer}
.nghi{align-self:flex-start;font-size:26px;animation:nhip 1s infinite}
.nhap{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:3px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.nhap>div{max-width:640px;margin:0 auto;display:flex;gap:8px}
.nhap input{flex:1;min-width:0;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;font:700 18px var(--font);outline:none}
.nhap input:focus{border-color:var(--mark-d)}
.nhap .ib{width:44px;height:44px;border-radius:50%;font-size:21px}
.nhap .ib span{line-height:1}
.nhap .gui{background:var(--mark);border-color:var(--mark-d)}
.goiy{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
/* hiệu ứng bấm */
.pt{position:fixed;z-index:99;pointer-events:none;font-size:22px;animation:bay .85s ease-out forwards}
@keyframes bay{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(var(--r))}}
.sao{position:fixed;z-index:0;pointer-events:none;font-size:20px;opacity:.5;animation:troi linear infinite}
@keyframes troi{from{transform:translateY(0) rotate(0)}to{transform:translateY(-110vh) rotate(360deg)}}
@media (max-width:380px){.btn{font-size:16px}.btn .ic{font-size:32px}.bubble{font-size:20px}.ib{width:44px;height:44px;font-size:21px}}
@media (prefers-reduced-motion:reduce){.sao{display:none}.tay,.fab,.nghi{animation:none}}   /* chỉ tắt chuyển động tự chạy; hiệu ứng khi bé chạm vẫn giữ để bé thấy phản hồi */
.noibi{position:fixed;z-index:60;pointer-events:none;background:var(--card);border:3px solid var(--mark-d);border-radius:20px 20px 20px 4px;padding:6px 12px;font:800 18px var(--disp);box-shadow:0 4px 0 var(--shadow);animation:bay2 1.6s ease-out forwards;white-space:nowrap}
@keyframes bay2{0%{opacity:0;transform:translateY(10px) scale(.7)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.bi.xoay{animation:xoay .8s ease-in-out}
@keyframes xoay{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-18deg) scale(1.25) translateY(-14px)}60%{transform:rotate(360deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" hidden aria-label="Hỏi Bi nhanh"><b>💬</b>Hỏi Bi</button>
<div class="ngan" id="ngan" hidden><div class="tam" id="tam"></div></div>
<script>
/* ===== Vào học: 1 trang duy nhất, toàn nút bấm (lớp 1-12). Không bắt quay về Zalo. ===== */
const API = 'https://devotee-outclass-couch.ngrok-free.dev/webhook';
const KEY = 'ms_vao_v1', KCHAT = 'ms_vao_chat';
const q = new URLSearchParams(location.search);
let DD = null; try { DD = JSON.parse(localStorage.getItem('ms_vao_id') || 'null'); } catch (e) {}
const coLink = !!q.get('u') && /^[a-f0-9]{16,64}$/.test(q.get('t') || '');
const dungLuu = !coLink && !q.get('t') && !!(DD && DD.u && /^[a-f0-9]{16,64}$/.test(DD.t || ''));   // mở lại trang không kèm link: dùng bé đã lưu
const uZalo = (coLink ? q.get('u') : dungLuu ? DD.u : (q.get('u') || '')).slice(0, 80);
const tHex = (coLink ? q.get('t') : dungLuu ? DD.t : (q.get('t') || '')).replace(/[^a-f0-9]/g, '');
if (coLink) { try { localStorage.setItem('ms_vao_id', JSON.stringify({ u: uZalo, t: tHex, bi: (DD && DD.u === uZalo && DD.bi) || '' })); } catch (e) {} }
const DA_DK = !!uZalo && tHex.length >= 16;      // bé đã đăng ký: link do bot gửi (u + mã ký), bỏ qua phần làm quen
const token = DA_DK ? '' : (q.get('t') || '');
const $app = document.getElementById('app');
const GIAM = matchMedia('(prefers-reduced-motion:reduce)').matches;
const H = { 'ngrok-skip-browser-warning': '1', 'Content-Type': 'application/json' };

let S = { lop: 0, vai: '', ph: '', mon: '', tieng: true };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const luu = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
if (DA_DK) {   // bé đã đăng ký: lớp lấy từ link, vai trò = học sinh, hỏi môn ngay
  const l = parseInt(q.get('lop'), 10);
  if (l >= 1 && l <= 12) S.lop = l;
  S.vai = 'hs'; S.ph = S.ph || 'chung';
  if (q.get('mon')) S.mon = q.get('mon'); else if (q.get('m') !== 'menu') S.mon = '';
}
let MON_DK = (q.get('mons') || '').split(',').map(x => x.trim()).filter(Boolean);

const MON_ICON = { 'Toán': '➗', 'Tiếng Việt': '📖', 'Ngữ văn': '📖', 'Tiếng Anh': '🔤', 'Đạo đức': '💛', 'Tự nhiên và Xã hội': '🌳', 'Khoa học': '🔬',
  'Khoa học tự nhiên': '🔬', 'Lịch sử và Địa lý': '🗺️', 'Lịch sử': '🏛️', 'Địa lý': '🌏', 'Giáo dục công dân': '🤝', 'Giáo dục kinh tế và pháp luật': '⚖️',
  'Tin học và Công nghệ': '💻', 'Tin học': '💻', 'Công nghệ': '🛠️', 'Vật lý': '⚡', 'Hóa học': '🧪', 'Sinh học': '🌱',
  'Âm nhạc': '🎵', 'Mỹ thuật': '🎨', 'Giáo dục thể chất': '🏃', 'Hoạt động trải nghiệm': '🌈', 'Giáo dục quốc phòng và an ninh': '🛡️' };
function monTheoLop(l) {
  const nt = ['Âm nhạc', 'Mỹ thuật', 'Giáo dục thể chất', 'Hoạt động trải nghiệm'];
  if (l <= 2) return ['Toán', 'Tiếng Việt', 'Tiếng Anh', 'Đạo đức', 'Tự nhiên và Xã hội', ...nt];
  if (l === 3) return ['Toán', 'Tiếng Việt', 'Tiếng Anh', 'Đạo đức', 'Tự nhiên và Xã hội', 'Tin học và Công nghệ', ...nt];
  if (l <= 5) return ['Toán', 'Tiếng Việt', 'Tiếng Anh', 'Khoa học', 'Lịch sử và Địa lý', 'Đạo đức', 'Tin học và Công nghệ', ...nt];
  if (l <= 9) return ['Toán', 'Ngữ văn', 'Tiếng Anh', 'Khoa học tự nhiên', 'Lịch sử và Địa lý', 'Giáo dục công dân', 'Tin học', 'Công nghệ', ...nt];
  return ['Toán', 'Ngữ văn', 'Tiếng Anh', 'Vật lý', 'Hóa học', 'Sinh học', 'Lịch sử', 'Địa lý', 'Giáo dục kinh tế và pháp luật', 'Tin học', 'Công nghệ', 'Giáo dục quốc phòng và an ninh', 'Hoạt động trải nghiệm'];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---- Bi đọc to bằng giọng tiếng Việt của máy chủ Mọt sách ---- */
let giong = null, amNow = null, noiSeq = 0, dangNoi = false;
const ACACHE = {};
const boEmoji = t => String(t).replace(/[\u{1F000}-\u{1FFFF}☀-➿️‍]/gu, '').replace(/\s+/g, ' ').trim();
function capNhatDung() {
  const d = document.getElementById('dung'), g = document.getElementById('dots'); if (!d) return;
  d.hidden = !dangNoi;
}
function dungNoi() { noiSeq++; dangNoi = false; try { if (amNow) { amNow.pause(); amNow = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} capNhatDung(); }
function noiMayTinh(t) {   // dự phòng: chỉ đọc khi máy có giọng tiếng Việt, tuyệt đối không đọc bằng giọng tiếng Anh
  if (!('speechSynthesis' in window)) return;
  try {
    if (!giong) giong = (speechSynthesis.getVoices() || []).find(v => /^vi/i.test(v.lang)) || null;
    if (!giong) return;
    const u = new SpeechSynthesisUtterance(t); u.lang = 'vi-VN'; u.voice = giong; u.rate = 0.92; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
async function layAm(t) {
  if (ACACHE[t]) return ACACHE[t];
  const r = await fetch(API + '/vao-doc?text=' + encodeURIComponent(t), { headers: { 'ngrok-skip-browser-warning': '1' } });
  if (!r.ok) throw new Error('tts');
  const b = await r.blob(); if (b.size < 800) throw new Error('tts');
  return (ACACHE[t] = URL.createObjectURL(b.type ? b : new Blob([b], { type: 'audio/mpeg' })));
}
function phatAm(url) {
  return new Promise((ok, loi) => {
    const a = new Audio(url); amNow = a; dangNoi = true; capNhatDung();
    a.onended = () => ok(); a.onerror = () => loi(new Error('play'));
    a.play().catch(loi);
  });
}
async function noi(t, bat) {   // đọc 1 đoạn; bat=true: đọc dù đang tắt tiếng (bé tự bấm nghe)
  if (!S.tieng && !bat) return;
  dungNoi(); const seq = noiSeq; t = boEmoji(t).slice(0, 280); if (!t) return;
  try { const url = await layAm(t); if (seq !== noiSeq) return; await phatAm(url); }
  catch (e) { if (seq === noiSeq) noiMayTinh(t); }
  if (seq === noiSeq) { dangNoi = false; capNhatDung(); }
}
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', 'n': 'ⁿ', '-': '⁻', '+': '⁺' };
function dep(t) {   // hiển thị công thức cho bé: x^2 -> x², \frac -> (a)/(b), * -> ×...
  t = String(t).replace(/\\[()\[\]]/g, '').replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g, '√($1)').replace(/\\text\{([^{}]*)\}/g, '$1');
  const mp = { '\\times': '×', '\\cdot': '·', '\\div': '÷', '\\pm': '±', '\\leq': '≤', '\\geq': '≥', '\\neq': '≠', '\\approx': '≈', '\\pi': 'π', '\\left': '', '\\right': '', '\\circ': '°' };
  for (const k of Object.keys(mp)) t = t.split(k).join(mp[k]);
  t = t.replace(/\^\{?(-?\d+|n)\}?/g, (m, e) => [...e].map(c => SUP[c] || c).join(''));
  t = t.replace(/sqrt\(([^()]*)\)/gi, '√($1)').replace(/<=/g, '≤').replace(/>=/g, '≥').replace(/!=/g, '≠').replace(/=>/g, '⇒').replace(/->/g, '→');
  t = t.replace(/(\d|\)|[a-z])\s*\*\s*(?=\d|\(|[a-z])/gi, '$1 × ');
  return t.replace(/\$+/g, '').replace(/\*\*/g, '').replace(/[{}]/g, '');
}
function docToan(t) {   // chuyển công thức thành lời để Bi đọc: x² -> x bình phương
  const sup = Object.fromEntries(Object.entries(SUP).map(([a, b]) => [b, a]));
  t = dep(t).replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹ⁿ⁻⁺]+)/g, (m) => m === '²' ? ' bình phương' : m === '³' ? ' lập phương' : ' mũ ' + [...m].map(c => sup[c] || c).join(''));
  return t.replace(/√/g, ' căn ').replace(/×/g, ' nhân ').replace(/÷/g, ' chia ').replace(/≤/g, ' nhỏ hơn hoặc bằng ').replace(/≥/g, ' lớn hơn hoặc bằng ').replace(/≠/g, ' khác ')
    .replace(/⇒|→/g, ' suy ra ').replace(/=/g, ' bằng ').replace(/(\d|\)|[a-z])\s*\+\s*/gi, '$1 cộng ').replace(/(\d|\)|[a-z])\s+-\s+(?=\d|\(|[a-z])/gi, '$1 trừ ')
    .replace(/(\d|[a-z])\s*\/\s*(?=\d|[a-z])/gi, '$1 chia ').replace(/[()]/g, ' ');
}
async function noiDai(t) {   // câu trả lời dài: cắt theo câu, đọc nối tiếp
  dungNoi(); const seq = noiSeq;
  const cau = (boEmoji(docToan(t)).replace(/\n+/g, '. ').match(/[^.!?…]+[.!?…]*/g) || []).map(x => x.trim()).filter(Boolean);
  const doan = []; let cur = '';
  for (const c of cau) { if ((cur + ' ' + c).length > 220 && cur) { doan.push(cur); cur = c; } else cur = (cur ? cur + ' ' : '') + c; }
  if (cur) doan.push(cur);
  try { for (const d of doan.slice(0, 8)) { if (seq !== noiSeq) return; const url = await layAm(d); if (seq !== noiSeq) return; await phatAm(url); } }
  catch (e) { if (seq === noiSeq) noiMayTinh(boEmoji(docToan(t)).slice(0, 280)); }
  if (seq === noiSeq) { dangNoi = false; capNhatDung(); }
}

function nenAnh(file) {   // thu nhỏ ảnh về tối đa 1280px, nén JPEG để gửi nhanh
  return new Promise((ok, loi) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height)), w = Math.round(im.width * k), h = Math.round(im.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
      ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]); }; im.onerror = () => loi(new Error('anh')); im.src = r.result; };
    r.onerror = () => loi(new Error('doc')); r.readAsDataURL(file);
  });
}

  if (S.lop === 9) ds.push(['🏫', 'Ôn thi vào lớp 10', 'Cho mình 5 câu ôn thi vào lớp 10' + m + '. Hỏi từng câu một, chờ mình trả lời rồi chấm.']);
  if (S.lop === 12) ds.push(['🎓', 'Ôn thi tốt nghiệp', 'Cho mình 5 câu ôn thi tốt nghiệp THPT' + m + '. Hỏi từng câu một, chờ mình trả lời rồi chấm.']);
  khung('onthi', 'Bạn muốn ôn thế nào?', 'Chạm vào hình bạn thích', `<div class="grid g2" id="go">${ds.map((d, k) => `<button class="btn big" data-o="${k}"><span class="ic">${d[0]}</span>${d[1]}</button>`).join('')}</div>`, true);
  datTay('#go', 'xuong');
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { dungNoi(); LS.push('onthi'); man = 'chat'; ve(ds[+b.dataset.o][2]); });
}

function nhacSapCo() {   // phần đang phát triển: Bi báo nhẹ nhàng
  const bi = document.getElementById('bi'); if (bi) gauChuyen(bi, 'Cái này Bi đang làm, sắp có rồi nhé! 🚧', true);
}
function manHome() {
  const m = (id, ic, tt) => `<button class="btn" data-h="${id}"><span class="ic">${ic}</span>${tt}</button>`;
  const b = (id, ic, tt, sub, cls) => `<button class="btn ${cls || ''}" data-h="${id}"><span class="ic">${ic}</span>${tt}${sub ? `<small>${sub}</small>` : ''}</button>`;
  khung('home', 'Trang chủ của bạn nè! Hôm nay mình học gì nhỉ?', 'Chạm vào hình bạn thích', `
    <div class="sec">📚 Các môn học</div>
    <div class="grid g3" id="gh">${m('toan', '➗', 'Toán')}${m('anh', '🔤', 'Tiếng Anh')}${m('khac', '📖', 'Môn khác')}</div>
    <div class="sec">🎯 Học chuyên đề</div>
    <div class="grid g2">${b('chuyende', '🎯', 'Học chuyên đề', 'ôn cả mạch kiến thức lớp 1 đến lớp 12', 'rong')}</div>
    <div class="sec">🗣️ Tiếng Anh giao tiếp</div>
    <div class="grid g2">${b('chude', '🗣️', 'Nói theo chủ đề', 'Bi nói trước hoặc bạn nói trước')}${b('nhanh', '🎤', 'Nói nhanh với Bi', 'Bi nghe và trả lời bằng giọng')}</div>
    <div class="sec">📝 Ôn thi</div>
    <div class="grid g2">${b('hk', '📝', 'Ôn thi học kỳ', '')}${b('dh', '🏛️', 'Ôn thi đại học', '')}${b('c3', '🏫', 'Ôn thi vào lớp 10 (cấp 3)', '', 'rong')}</div>
    <div class="sec">🎓 Chứng chỉ tiếng Anh <em>sắp có</em></div>
    <div class="grid g3">${b('sap', '🚧', 'TOEIC', 'đang làm', 'khoa')}${b('sap', '🚧', 'TOEFL', 'đang làm', 'khoa')}${b('sap', '🚧', 'IELTS', 'đang làm', 'khoa')}</div>
    <div class="sec">❓ Hỏi khác</div>
    <div class="grid g2">${b('hoi', '💬', 'Hỏi nhanh Bi', 'gõ, nói hoặc chụp ảnh')}${b('tiendo', '📈', 'Tiến độ của mình', 'đã học tới đâu')}</div>
    <div class="sec">🎮 Chơi cùng Bi</div>
    <div class="grid g2">${b('game', '🎮', 'Game nuôi Bi', 'nuôi gấu Bi lớn lên, chơi mà học', 'rong')}</div>`, false);
  const lopTxt = ' lớp ' + S.lop;
  const hanh = {
    toan: () => { S.mon = 'Toán'; luu(); di('menu'); },
    anh: () => { S.mon = 'Tiếng Anh'; luu(); di('menu'); },
    khac: () => di('mon'),
    chude: () => vaoBi('mo=en'),
    nhanh: () => { location.href = 'bi-noi-nhanh.html'; },
    hoi: () => di('chat'),
    hk: () => { LS.push('home'); man = 'chat'; ve('Mình muốn ôn thi học kì' + lopTxt + '. Hỏi mình xem muốn ôn môn nào, rồi cho từng câu một, chờ mình trả lời rồi chấm và giải thích.'); },
    dh: () => { LS.push('home'); man = 'chat'; ve('Mình muốn ôn thi đại học (tốt nghiệp THPT). Hỏi mình xem muốn ôn môn nào, rồi cho từng câu một, chờ mình trả lời rồi chấm và giải thích.'); },
    game: () => { const bi = document.getElementById('bi'); if (bi) gauChuyen(bi, 'Vào chơi với Bi nhé! 🎮', true); moGame(); },
    c3: () => { LS.push('home'); man = 'chat'; ve('Mình muốn ôn thi vào lớp 10 (cấp 3). Hỏi mình xem muốn ôn môn nào, rồi cho từng câu một, chờ mình trả lời rồi chấm và giải thích.'); },
    sap: nhacSapCo,
    tiendo: () => { location.href = 'hoc-ngay.html?lop=' + S.lop + '&u=' + encodeURIComponent(uZalo) + '&t=' + tHex; },
    chuyende: () => { location.href = 'chuyen-de.html?lop=' + S.lop; }
  };
  document.querySelectorAll('[data-h]').forEach(x => x.onclick = () => { dungNoi(); (hanh[x.dataset.h] || (() => {}))(); });
}

function ve(batDauChat) {
  if (man === 'lop') {
    khung('lop', 'Bạn học lớp mấy?', 'Chạm vào số lớp của bạn nhé', `<div class="grid g4" id="gl">${[...Array(12).keys()].map(i => {
      const l = i + 1, e = l <= 5 ? '🐣' : l <= 9 ? '🎒' : '🎓';
      return `<button class="btn lop ${S.lop === l ? 'sel' : ''}" data-l="${l}"><span class="ic">${e}</span>${l}<small>Lớp</small></button>`; }).join('')}</div>`, false);
    datTay('#gl', 'xuong');
    document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { S.lop = +b.dataset.l; luu(); S.mon = ''; di(S.vai ? 'mon' : 'ai'); });
  } else if (man === 'ai') {
    khung('ai', 'Ai đang dùng nè?', 'Chạm vào hình bạn nhé', `<div class="grid g2" id="ga">
      <button class="btn big" data-v="hs"><span class="ic">🧒</span>Mình là bạn học sinh</button>
      <button class="btn big" data-v="ph"><span class="ic">👨‍👩‍👧</span>Mình là ba mẹ<small>xem con học</small></button></div>`, true);
    datTay('#ga', 'len');
    document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.vai = b.dataset.v; luu(); di(S.vai === 'ph' ? 'ph' : 'mon'); });
  } else if (man === 'ph') {
    khung('ph', 'Ba mẹ dùng thế nào ạ?', 'Chọn một cách thôi', `<div class="grid g2" id="gp">
      <button class="btn big ${S.ph === 'chung' ? 'sel' : ''}" data-p="chung"><span class="ic">👨‍👩‍👧‍👦</span>Dùng chung<small>1 tài khoản cho các con</small></button>
      <button class="btn big ${S.ph === 'rieng' ? 'sel' : ''}" data-p="rieng"><span class="ic">🧒</span>Riêng từng con<small>mỗi con một tài khoản</small></button></div>`, true);
    datTay('#gp', 'len');
    document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.ph = b.dataset.p; luu(); baoMayChu(); di('mon'); });
  } else if (man === 'mon') {
    let ds = monTheoLop(S.lop);
    if (DA_DK && MON_DK.length) ds = [...ds.filter(m => MON_DK.includes(m)), ...ds.filter(m => !MON_DK.includes(m))];   // môn đã đăng ký xếp trước
    khung('mon', 'Hôm nay học môn gì?', 'Chạm vào môn bạn muốn', `<div class="grid g3" id="gm">${ds.map(m =>
      `<button class="btn ${S.mon === m ? 'sel' : ''}" data-m="${esc(m)}"><span class="ic">${MON_ICON[m] || '📘'}</span>${esc(m)}</button>`).join('')}</div>
      ${DA_DK ? '' : `<div class="chipbar"><button class="chip" id="dl">✏️ Đổi lớp (đang lớp ${S.lop})</button></div>`}`, !DA_DK);
    datTay('#gm', 'xuong');
    document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.mon = b.dataset.m; luu(); baoMayChu(); di('menu'); });
    const dlb = document.getElementById('dl'); if (dlb) dlb.onclick = () => di('lop');
  } else if (man === 'home') { manHome();
  } else if (man === 'menu') {
    const dl = duoiHoc(), ten = esc(S.mon);
    const tile = (href, ic, tt, sub) => `<a class="btn big" href="${href}"><span class="ic">${ic}</span>${tt}<small>${sub}</small></a>`;
    const nut = (id, ic, tt, sub) => `<button class="btn big" id="${id}"><span class="ic">${ic}</span>${tt}<small>${sub}</small></button>`;
    const noiDung = DA_DK
      ? `<div class="grid g2" id="gk">
          ${tile('hoc-ngay.html?' + dl, '📘', 'Học bài', ten + ' lớp ' + S.lop)}
          ${nut('hoi', '💬', 'Hỏi nhanh Bi', 'gõ hoặc nói')}
          ${nut('onthi', '📝', 'Ôn thi', ten)}
          ${tile('hoc-ngay.html?lop=' + S.lop + '&u=' + encodeURIComponent(uZalo) + '&t=' + tHex, '📈', 'Tiến độ', 'đã học tới đâu')}</div>`
      : `<div class="grid g2" id="gk">
          ${tile('hoc-ngay.html?' + dl, '📘', 'Học bài', ten + ' lớp ' + S.lop)}
          ${tile(token ? 'tai-lieu.html?b=' + (S.vai === 'ph' ? 'ph' : 'hs') + '&t=' + encodeURIComponent(token) : 'hoc-ngay.html?' + dl, '📷', 'Chụp đề cho Bi', 'Bi giúp giải')}
          ${tile('bi-noi-nhanh.html', '🗣️', 'Tiếng Anh giao tiếp', 'luyện nói với Bi')}
          ${nut('dm', '🔄', 'Đổi môn khác', '')}</div>`;
    khung('menu', 'Mình học ' + S.mon + ' nhé! Bạn muốn làm gì?', 'Chạm vào hình bạn thích', noiDung + (DA_DK ? '<div class="chipbar"><button class="chip" id="dm">🔄 Đổi môn khác</button></div>' : ''), true);
    datTay('#gk', 'len');
    const dm = document.getElementById('dm'); if (dm) dm.onclick = () => DA_DK ? di('mon') : veNha();
    const h = document.getElementById('hoi'); if (h) h.onclick = () => di('chat');
    const o = document.getElementById('onthi'); if (o) o.onclick = () => di('onthi');
  } else if (man === 'chat') manChat(batDauChat);
  else if (man === 'onthi') manOnThi();
}

/* ---- vào thẳng nếu đã chọn trước đây (không hỏi lại) ---- */
function batDau() {
  man = DA_DK && S.lop ? (S.mon ? 'menu' : 'home') : !S.lop ? 'lop' : !S.vai ? 'ai' : (S.vai === 'ph' && !S.ph) ? 'ph' : !S.mon ? 'mon' : 'menu';
  if (man === 'menu') LS = [DA_DK ? 'home' : 'mon'];
  ve();
}
function layHoSo() {   // hồ sơ bé từ máy chủ: lớp, môn, mã vào game nuôi Bi
  return fetch(API + '/vao-ho-so?u=' + encodeURIComponent(uZalo) + '&t=' + tHex, { headers: { 'ngrok-skip-browser-warning': '1' } }).then(r => r.json()).then(j => {
    if (j && j.ok && j.bi) { BI_TOK = j.bi; try { localStorage.setItem('ms_vao_id', JSON.stringify({ u: uZalo, t: tHex, bi: j.bi })); } catch (e) {} }
    return j;
  });
}
if (DA_DK && !q.get('lop')) {   // link ngắn cố định (chỉ u + t): hỏi máy chủ xem bé học lớp mấy, môn nào
  $app.innerHTML = '<div class="hero pop"><div class="bi" aria-hidden="true">🐻</div><div class="bubble">Bi đang mở bài cho bạn…</div></div>';
  layHoSo().then(j => { if (j && j.ok && j.lop) { S.lop = j.lop; MON_DK = j.mons || []; S.mon = q.get('mon') || ''; luu(); } batDau(); })
    .catch(batDau);
} else { batDau(); if (DA_DK && !BI_TOK) layHoSo().catch(() => {}); }
</script>
<script src="bi-nguoi-que.js"></script><script src="bi-chung.js"></script>
</body>
