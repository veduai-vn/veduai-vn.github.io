<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VeduAI – Làm bài</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#EAF5FF;--card:#fff;--ink:#24305E;--mut:#5F6B92;--line:#C9DAF2;--sh:#B5CBEA;--mark:#FFD84D;--ok:#118A62;--err:#C2255C}
@media(prefers-color-scheme:dark){:root{--bg:#151B36;--card:#1F2850;--ink:#F1F4FF;--mut:#AAB4DC;--line:#38437A;--sh:#0E1328;--ok:#5FE0B0;--err:#FF9BB5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,0) 14px calc(90px + env(safe-area-inset-bottom,0))}
main{max-width:560px;margin:0 auto;padding:18px 0}h1{font-size:22px;margin:0 0 4px}.m{color:var(--mut);font-size:14px}
.c{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--sh);padding:14px;margin:0 0 14px}
input,select,textarea{width:100%;min-height:46px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;padding:8px 12px}
.g{display:grid;gap:10px}.dob{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
label.o{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;cursor:pointer}label.o.on{border-color:var(--ink);background:var(--mark);color:#4A3700}
label.o input{width:20px;min-height:20px;margin-top:3px}
.b{appearance:none;border:0;background:var(--ink);color:var(--card);font:800 16px system-ui;min-height:48px;padding:0 22px;border-radius:999px;cursor:pointer}.b:disabled{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));display:flex;gap:12px;align-items:center;justify-content:space-between}
.err{color:var(--err);font-weight:700}.ok{color:var(--ok);font-weight:700}.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.ct{text-align:center;padding:40px 10px}.big{font-size:60px}a{color:var(--ink);font-weight:800}
.vf{max-width:560px;margin:6px auto 0;padding:10px 8px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--mut,var(--muted,#5F6B92))}.vf a{color:inherit;font-weight:800}</style></head><body><main id="app"><div class="ct"><div class="big">🐣</div>Đang mở bài…</div></main>
<footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer><script>
const API='https://devotee-outclass-couch.ngrok-free.dev/webhook', H={'ngrok-skip-browser-warning':'1'}, BOT='https://t.me/MotSachVedu_Bot';
const TG=window.Telegram&&Telegram.WebApp; if(TG){try{TG.ready();TG.expand()}catch(e){}}
const mb=((TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('b')||'').replace(/[^A-Za-z0-9]/g,'');
const $=document.getElementById('app'), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HK='hsfree',HSPAGE='https://veduai-vn.github.io/hoc-sinh.html';
let CR=null;try{CR=JSON.parse(localStorage.getItem(HK)||'null')}catch(e){}
const S={bai:null,reg:{ten:'',nd:'',nt:'',nn:'',tr:'',lop:'',err:'',busy:false},ten:'',nd:'',nt:'',nn:'',lop:'',tr:'',a:{},anh:{},sending:false,left:0,err:''}; let timer=null;
const st=(i,t,s)=>{$.innerHTML=`<div class="ct"><div class="big">${i}</div><h1>${esc(t)}</h1><p class="m">${esc(s||'')}</p></div>`};
async function load(){ if(!mb)return st('🔍','Link chưa đúng','Em mở lại đường dẫn bài từ thầy/cô nhé.');
 try{const j=await (await fetch(API+'/gv-bai?b='+mb,{headers:H})).json(); if(!j.ok)return st('🔍',j.loi||'Không tìm thấy bài'); S.bai=j.bai; if(!j.bai.mo)return st('⏰','Bài đã đóng','Bài này đã hết hạn hoặc thầy/cô đã đóng.'); S.reg.lop=j.bai.ten_lop||'';S.reg.tr=j.bai.truong||''; CR&&CR.hs&&CR.k?draw():dangKy();}
 catch(e){st('📡','Không kết nối được','Kiểm tra mạng rồi tải lại trang.')}}
function dobOk(){const v=new Date(S.nn+'-'+String(S.nt).padStart(2,'0')+'-'+String(S.nd).padStart(2,'0')+'T00:00:00');return S.nn&&v.getFullYear()==S.nn&&v.getMonth()+1==S.nt&&v.getDate()==S.nd}
function draw(){const b=S.bai, L='ABCDEF', ys=[];for(let y=new Date().getFullYear()-5;y>=1995;y--)ys.push(y);
 const opt=(a,t)=>`<option value="">${t}</option>`+a.map(x=>`<option ${String(x)===String(S[{Ngày:'nd',Tháng:'nt',Năm:'nn'}[t]])?'selected':''}>${x}</option>`).join('');
 $.innerHTML=`<h1>${esc(b.tieu_de)}</h1><p class="m">${esc([b.mon,b.ten_lop&&'Lớp '+b.ten_lop,b.ten_gv&&'GV '+b.ten_gv,b.thoi_gian_phut&&b.thoi_gian_phut+' phút'].filter(Boolean).join(' · '))}</p>
 <div class="c"><b>👤 ${esc(CR.ten)}</b><span class="m"> · Lớp ${esc(CR.lop)} · ${esc(CR.truong)}</span><br><a href="#" id="doi" class="m">Không phải em? Đổi tài khoản</a> · <a href="${HSPAGE}" class="m">Bài đã làm</a></div>
 ${b.cau.map((q,i)=>`<div class="c"><b>Câu ${i+1}</b> <span class="m">(${q.diem} điểm)</span><p style="white-space:pre-wrap;margin:6px 0">${esc(q.de)}</p>`+
  (q.loai==='tn'?q.lc.map((x,k)=>`<label class="o ${S.a[q.id]===L[k]?'on':''}"><input type="radio" name="${q.id}" data-q="${q.id}" value="${L[k]}" ${S.a[q.id]===L[k]?'checked':''}><span><b>${L[k]}.</b> ${esc(x)}</span></label>`).join(''):
   q.loai==='ngan'?`<input data-q="${q.id}" placeholder="Đáp án của em" value="${esc(S.a[q.id]||'')}">`:
   `<textarea data-q="${q.id}" rows="3" placeholder="Gõ bài làm (hoặc chụp ảnh bên dưới)">${esc(S.a[q.id]||'')}</textarea><input type="file" accept="image/*" multiple data-f="${q.id}" style="margin-top:8px"><div class="ph">${(S.anh[q.id]||[]).map(x=>`<img src="data:image/jpeg;base64,${x}">`).join('')}</div>`)+`</div>`).join('')}
 <p class="err" id="er">${esc(S.err)}</p><div class="bar"><span class="m" id="tm"></span><button class="b" id="go" ${S.sending?'disabled':''}>${S.sending?'Đang chấm…':'Nộp bài 🚀'}</button></div>`;
 if(b.thoi_gian_phut&&!timer){S.left=b.thoi_gian_phut*60;timer=setInterval(()=>{S.left--;const t=document.getElementById('tm');if(t)t.textContent='⏱ '+Math.floor(S.left/60)+':'+String(S.left%60).padStart(2,'0');if(S.left<=0){clearInterval(timer);send(true)}},1000)}}

function dangKy(msg){const R=S.reg,ys=[];for(let y=new Date().getFullYear()-5;y>=1995;y--)ys.push(y);
 const o=(a,t,k)=>`<option value="">${t}</option>`+a.map(x=>`<option ${String(x)===String(R[k])?'selected':''}>${x}</option>`).join('');
 $.innerHTML=`<h1>🎒 Đăng ký miễn phí để làm bài</h1><p class="m">${esc(S.bai.tieu_de)}${S.bai.ten_gv?' · GV '+esc(S.bai.ten_gv):''}</p>
 <div class="c g"><p class="m" style="margin:0">Em chỉ đăng ký một lần (khoảng 30 giây), lần sau làm bài thầy/cô giao không phải nhập lại và xem lại điểm các bài đã làm. Đã đăng ký rồi thì nhập lại đúng thông tin để đăng nhập.</p>
 <input data-r="ten" placeholder="Họ và tên" value="${esc(R.ten)}" autocomplete="name">
 <div class="dob"><select data-r="nd">${o([...Array(31).keys()].map(i=>i+1),'Ngày','nd')}</select><select data-r="nt">${o([...Array(12).keys()].map(i=>i+1),'Tháng','nt')}</select><select data-r="nn">${o(ys,'Năm','nn')}</select></div>
 <div class="dob" style="grid-template-columns:1fr 2fr"><input data-r="lop" placeholder="Lớp (7A2)" value="${esc(R.lop)}"><input data-r="tr" placeholder="Trường" value="${esc(R.tr)}"></div>
 <input id="hp" style="display:none" tabindex="-1" autocomplete="off"><p class="err">${esc(msg||R.err)}</p><button class="b" id="dk" ${R.busy?'disabled':''}>${R.busy?'Đang đăng ký…':'Đăng ký miễn phí & làm bài 🚀'}</button></div>`}
async function dkGo(){const R=S.reg;
 if(R.ten.trim().split(/\s+/).filter(Boolean).length<2){R.err='Nhập đủ họ và tên.';return dangKy()}
 const ns=R.nn+'-'+String(R.nt).padStart(2,'0')+'-'+String(R.nd).padStart(2,'0'),v=new Date(ns+'T00:00:00');
 if(!(R.nn&&v.getFullYear()==R.nn&&v.getMonth()+1==R.nt&&v.getDate()==R.nd)){R.err='Chọn đủ ngày sinh.';return dangKy()}
 if(!R.tr.trim()||!R.lop.trim()){R.err='Nhập lớp và trường.';return dangKy()}
 R.busy=true;R.err='';dangKy();
 try{const j=await (await fetch(API+'/hs-dang-ky',{method:'POST',headers:{'Content-Type':'application/json',...H},body:JSON.stringify({ho_ten:R.ten,ngay_sinh:ns,ten_lop:R.lop,truong:R.tr,hp:(document.getElementById('hp')||{}).value||''})})).json();
  R.busy=false;if(!j.ok){R.err=j.loi||'Chưa đăng ký được, em thử lại nhé.';return dangKy()}
  CR={hs:j.hs,k:j.k,ten:j.ten,lop:j.lop,truong:j.truong};try{localStorage.setItem(HK,JSON.stringify(CR))}catch(e){}draw()}
 catch(e){R.busy=false;R.err='Không kết nối được. Kiểm tra mạng rồi thử lại.';dangKy()}}
$.addEventListener('input',e=>{const t=e.target;if(t.dataset.r)S.reg[t.dataset.r]=t.value});
$.addEventListener('change',e=>{const t=e.target;if(t.dataset.r)S.reg[t.dataset.r]=t.value});
function nen(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72).split(',')[1])};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
$.addEventListener('input',e=>{const t=e.target;if(t.dataset.q)S.a[t.dataset.q]=t.value;else if(t.id==='ten')S.ten=t.value;else if(t.id==='lop')S.lop=t.value;else if(t.id==='tr')S.tr=t.value});
$.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.q&&t.type==='radio'){S.a[t.dataset.q]=t.value;draw()}
 else if(['nd','nt','nn'].includes(t.id))S[t.id]=t.value;
 else if(t.dataset.f){const q=t.dataset.f,a=(S.anh[q]||[]).slice();for(const f of [...t.files]){if(a.length>=3)break;try{a.push(await nen(f))}catch(x){}}S.anh[q]=a;draw()}});
$.addEventListener('click',e=>{const id=e.target.id;if(id==='go')send(false);else if(id==='dk')dkGo();else if(id==='share')guiPH(phTxtKQ());else if(id==='shtg'&&S.ph&&S.ph.tg)guiPH(phTxtTG());else if(id==='doi'){e.preventDefault();CR=null;try{localStorage.removeItem(HK)}catch(x){}clearInterval(timer);timer=null;dangKy()}});
async function send(auto){if(S.sending)return;const b=S.bai;
 if(!auto){
  const thieu=b.cau.filter(q=>q.loai==='tl'?!(S.a[q.id]||'').trim()&&!(S.anh[q.id]||[]).length:!(S.a[q.id]||'').trim()).length; if(thieu&&!confirm('Em còn '+thieu+' câu chưa làm. Vẫn nộp bài?'))return}
  S.sending=true;clearInterval(timer);draw();
 const tl={};b.cau.forEach(q=>{tl[q.id]=q.loai==='tl'?{text:S.a[q.id]||'',anh:S.anh[q.id]||[]}:(S.a[q.id]||'')});
 try{const j=await (await fetch(API+'/gv-nop',{method:'POST',headers:{'Content-Type':'application/json',...H},body:JSON.stringify({b:mb,hs:CR.hs,k:CR.k,tra_loi:tl})})).json();
  S.sending=false; if(!j.ok&&j.dangKy){CR=null;try{localStorage.removeItem(HK)}catch(x){}timer=null;return dangKy(j.loi)} if(!j.ok){S.err=j.loi||'Chưa nộp được, em thử lại nhé.';return j.daNop?st('✅','Em đã nộp bài này rồi',j.loi):draw()} ket(j)}
 catch(x){S.sending=false;S.err='Chưa nộp được. Kiểm tra mạng rồi bấm Nộp lại nhé.';draw()}}
function er(m){S.err=m;draw();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function ket(j){
 S.kq={diem:j.diem,toi_da:j.toi_da,diem10:j.diem10,trang_thai:j.trang_thai};
 const lis=a=>(a||[]).map(x=>esc(x.kt)+' ('+x.pct+'%'+(x.lop_tb!=null?', lớp TB '+x.lop_tb+'%':'')+')').join('; ');
 const rk=j.hang?`<p class="m">🏅 Xếp hạng tạm thời: <b>${j.hang}/${j.tong_nop}</b>${j.tb_lop10!=null?' · điểm TB lớp '+String(j.tb_lop10).replace('.',','):''} (có thể đổi khi các bạn khác nộp)</p>`:(j.cho_cham?'<p class="m">🏅 Xếp hạng sẽ có khi thầy/cô chấm xong các câu còn lại.</p>':'<p class="m">🏅 Em là bạn nộp đầu tiên nên chưa có bạn khác để xếp hạng.</p>');
 const pt=((j.manh&&j.manh.length)||(j.yeu&&j.yeu.length))?`<div class="c"><b>📊 Nhận xét kiến thức</b>${j.manh&&j.manh.length?`<p style="margin:8px 0">💪 <b>Em làm tốt:</b> ${lis(j.manh)}</p>`:''}${j.yeu&&j.yeu.length?`<p style="margin:8px 0">⚠️ <b>Cần ôn tập tăng cường:</b> ${lis(j.yeu)}</p>`:'<p class="m">Chưa có phần nào yếu rõ rệt, em giỏi lắm!</p>'}</div>`:'';
const b=S.bai,cta=j.co_tai_khoan?'':`<div class="c"><b>🎁 Học cùng VeduAI – gia sư AI của em</b><p class="m">Em chưa có tài khoản VeduAI. Dùng thử miễn phí 5 ngày: học và làm bài mọi lúc mọi nơi, không cần sách giáo khoa, có báo cáo điểm mạnh, điểm yếu và kế hoạch khắc phục!</p><a href="${BOT}${j.ban_duoc?'?start=dl_'+encodeURIComponent(b.ma_dai_ly):''}">Mở VeduAI trên Telegram →</a></div>`;
 $.innerHTML=`<div class="ct"><div class="big">🎉</div><h1>Đã nộp bài!</h1><p class="ok" style="font-size:26px;margin:4px 0">${j.diem} / ${j.toi_da} điểm</p><p class="m">Thang 10: ${j.diem10}${j.trang_thai==='cho_giao_vien'?' (còn câu chờ thầy/cô chấm)':''}</p>${rk}</div>
 ${j.nhan_xet?`<div class="c"><b>Nhận xét</b><p style="white-space:pre-wrap">${esc(j.nhan_xet)}</p></div>`:''}
 ${pt}
 ${j.co_ai?'<p class="m">Phần tự luận do AI chấm sơ bộ, thầy/cô sẽ xem lại.</p>':''}
 <p class="m" style="text-align:center"><a href="${HSPAGE}">📚 Xem tất cả bài đã làm</a></p><div class="c">${j.chi_tiet.map((d,i)=>`<p style="margin:6px 0">${d.dung===true?'✅':d.dung===false?'❌':'📝'} <b>Câu ${i+1}:</b> ${d.diem}/${d.toi_da}${d.dap_an&&d.dung===false?' · Đáp án: '+esc(d.dap_an):''}${d.nhan_xet?'<br><span class="m">'+esc(d.nhan_xet)+'</span>':''}</p>`).join('')}</div><div id="phbox"></div>${cta}`;phTai()}
/* ===== v78: gui ket qua cho phu huynh (nut chia se + link xem + Telegram) ===== */
const PHPAGE='https://veduai-vn.github.io/phu-huynh.html';
function copyTxt(t){return new Promise(ok=>{try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>ok(true),()=>ok(cpOld(t)))}else ok(cpOld(t))}catch(e){ok(cpOld(t))}})}
function cpOld(t){try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const r=document.execCommand('copy');a.remove();return r}catch(e){return false}}
async function guiPH(t,tb){
 if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
 const ok=await copyTxt(t);const m=document.getElementById('phmsg');
 if(m)m.textContent=ok?'✅ Đã sao chép. Em dán vào Zalo/Messenger/tin nhắn gửi phụ huynh nhé.':'Chưa sao chép được. Em chụp màn hình điểm gửi phụ huynh nhé.'}
function phTxtKQ(){const k=S.kq||{},b=S.bai||{},u=S.ph&&S.ph.url?' Phụ huynh xem tất cả điểm của con tại: '+S.ph.url:'';
 return 'Kết quả của '+CR.ten+': '+b.tieu_de+' – '+k.diem+'/'+k.toi_da+' điểm (thang 10: '+k.diem10+')'+(k.trang_thai==='cho_giao_vien'?', còn câu chờ thầy/cô chấm':'')+'.'+u}
function phTxtTG(){return 'Phụ huynh bấm link này một lần để nhận kết quả bài làm của '+CR.ten+' tự động qua Telegram (miễn phí, có thể ngừng bất cứ lúc nào): '+S.ph.tg}
function phVe(){const el=document.getElementById('phbox');if(!el)return;const p=S.ph;
 el.innerHTML='<div class="c"><b>👨‍👩‍👧 Gửi kết quả cho phụ huynh</b><p class="m" style="margin:6px 0 10px">Em tự gửi từ máy của em, không cần nhập số điện thoại phụ huynh.</p>'+
 '<div class="g"><button class="b" id="share">📨 Gửi kết quả này cho phụ huynh</button>'+
 (p&&p.tg?'<button class="b" id="shtg" style="background:var(--card);color:var(--ink);border:2px solid var(--line)">🔔 Mời phụ huynh nhận điểm tự động qua Telegram</button>':'')+'</div>'+
 '<p class="m" style="margin:10px 0 0">'+(p===null?'Đang tạo link cho phụ huynh…':p&&p.url?('Link xem điểm của em: <a href="'+esc(p.url)+'" target="_blank" rel="noopener">mở trang phụ huynh</a>'+(p.n?' · '+p.n+' phụ huynh đã đăng ký nhận thông báo':'')):'Chưa tạo được link xem điểm, nhưng em vẫn gửi được kết quả bằng nút trên.')+'</p><p class="m" id="phmsg" style="margin:6px 0 0;font-weight:700"></p></div>'}
async function phTai(){S.ph=null;phVe();
 try{const j=await (await fetch(API+'/hs-ph-link',{method:'POST',headers:{'Content-Type':'application/json',...H},body:JSON.stringify({hs:CR.hs,k:CR.k})})).json();
  S.ph=j.ok?{url:j.ph_url,tg:j.tg_url,n:j.so_ph||0}:{}}catch(e){S.ph={}}
 phVe()}

load();
</script></body></html>
