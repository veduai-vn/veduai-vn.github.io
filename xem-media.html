<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Mọt sách – Xem hình & nghe giọng đọc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#EAF5FF; --card:#fff; --text:#24305E; --muted:#5F6B92; --line:#C9DAF2; --shadow:#B5CBEA; --mark:#FFD84D; --mark-d:#E3AE00; --mark-ink:#4A3700; --ok:#118A62; --err:#C2255C; --stage:#F3F8FF;
    --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; --disp:'Baloo 2','Nunito',system-ui,sans-serif; }
  /* che do toi tat: mot-sach.css la giao dien sang */
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-weight:500; }
  body { min-height:100vh; padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0); background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px); background-size:26px 26px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:560px; padding:24px 0; }
  .hero { display:flex; gap:10px; align-items:flex-end; margin-bottom:14px; }
  .mascot { font-size:56px; line-height:1; flex:none; }
  .bubble { background:var(--card); border:2px solid var(--line); border-radius:22px 22px 22px 6px; padding:8px 16px 10px; box-shadow:0 4px 0 var(--shadow); font-weight:700; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:24px; box-shadow:0 4px 0 var(--shadow); padding:16px; margin:0 0 16px; }
  .card h2 { font:800 18px var(--disp); margin:0 0 10px; }
  .stage { background:var(--stage); border:2px solid var(--line); border-radius:16px; padding:8px; display:flex; justify-content:center; }
  .stage img { display:block; max-width:100%; height:auto; border-radius:10px; background:#fff; }
  .stage audio { width:100%; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 20px; border-radius:999px; border:2px solid var(--line); background:var(--card); color:var(--text); font:700 16px var(--font); text-decoration:none; cursor:pointer; box-shadow:0 4px 0 var(--shadow); transition:transform .08s, box-shadow .08s; }
  .btn.main { background:var(--mark); color:var(--mark-ink); border-color:var(--mark-d); }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--shadow); }
  .btn:focus-visible { outline:3px solid #FF7A90; outline-offset:2px; }
  .state { text-align:center; padding:22px 8px; line-height:1.6; }
  .state .big { font-size:60px; line-height:1.1; margin-bottom:8px; }
  .state .t { font:800 20px var(--disp); }
  .muted { color:var(--muted); font-size:14px; font-weight:600; }
  .err { color:var(--err); }
  .hint { margin:10px 0 0; color:var(--muted); font-size:14px; font-weight:600; }
  .vf { max-width:560px; margin:6px auto 0; padding:10px 8px; text-align:center; font-size:12.5px; line-height:1.6; color:var(--muted); }
  .vf a { color:inherit; font-weight:800; }
  @media (prefers-reduced-motion:no-preference) { .spin { display:inline-block; animation:bn .8s ease-in-out infinite; } @keyframes bn { 50% { transform:translateY(-10px); } } }
</style>
<style>:root{color-scheme:light}</style>
<link rel="stylesheet" href="mot-sach.css?v=2">
</head>
<body class="ms">
<header class="ms-head"><div class="ms-hw"><span class="ms-logo"><img src="assets/logo-mark.png" alt=""><span>Mọt<b>sách</b></span></span></div></header>

<div class="wrap">
  <div class="hero"><span class="mascot" aria-hidden="true"><svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><ellipse cx="100" cy="100" rx="66" ry="62" fill="#A56BE0" stroke="#3B2A55" stroke-width="3"/><ellipse cx="32" cy="132" rx="17" ry="44" fill="#A56BE0" stroke="#3B2A55" stroke-width="3" transform="rotate(10 32 132)"/><ellipse cx="168" cy="132" rx="17" ry="44" fill="#A56BE0" stroke="#3B2A55" stroke-width="3" transform="rotate(-10 168 132)"/><rect x="91" y="156" width="18" height="16" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path d="M56 170 Q100 150 144 170 L154 230 H46 Z" fill="#24305E" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M78 163 L100 190 L122 163 Q100 154 78 163 Z" fill="#fff" stroke="#3B2A55" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="100" cy="108" rx="58" ry="54" fill="#FFE4D2" stroke="#3B2A55" stroke-width="3"/><g class="eyes"><ellipse cx="76" cy="112" rx="12" ry="15" fill="#2BB5C8"/><ellipse cx="76" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="71" cy="106" r="4.8" fill="#fff"/><circle cx="81" cy="120" r="2.4" fill="#fff"/><ellipse cx="124" cy="112" rx="12" ry="15" fill="#2BB5C8"/><ellipse cx="124" cy="115" rx="7" ry="9.5" fill="#1d1a3a"/><circle cx="119" cy="106" r="4.8" fill="#fff"/><circle cx="129" cy="120" r="2.4" fill="#fff"/></g><path d="M60 103 Q76 91 92 103 M108 103 Q124 91 140 103" stroke="#3B2A55" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="57" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><ellipse cx="143" cy="130" rx="10" ry="5.5" fill="#FF8FAB" opacity=".65"/><path d="M90 130 Q100 135 110 130 Q108 147 100 147 Q92 147 90 130Z" fill="#E8546E" stroke="#3B2A55" stroke-width="2.2" stroke-linejoin="round"/><path d="M94 141 Q100 138 106 141 Q103 145 100 145 Q97 145 94 141Z" fill="#FF9EB5"/><path d="M38 102 Q38 40 100 36 Q162 40 162 102 Q146 72 124 86 Q112 60 96 84 Q74 64 38 102 Z" fill="#A56BE0" stroke="#3B2A55" stroke-width="3" stroke-linejoin="round"/><path d="M62 54 Q82 44 104 46" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55" fill="none"/><path d="M24 63 L38 72 L24 81Z M52 63 L38 72 L52 81Z" fill="#FF5C8A" stroke="#3B2A55" stroke-width="2.5" stroke-linejoin="round"/><circle cx="38" cy="72" r="4.5" fill="#FFB3C9" stroke="#3B2A55" stroke-width="2"/><path d="M148 63 L162 72 L148 81Z M176 63 L162 72 L176 81Z" fill="#FF5C8A" stroke="#3B2A55" stroke-width="2.5" stroke-linejoin="round"/><circle cx="162" cy="72" r="4.5" fill="#FFB3C9" stroke="#3B2A55" stroke-width="2"/><circle cx="64" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><circle cx="136" cy="156" r="10" fill="#FFE4D2" stroke="#3B2A55" stroke-width="2.5"/><path class="stw" style="animation-delay:0s" d="M22 31 Q22 40 31 40 Q22 40 22 49 Q22 40 13 40 Q22 40 22 31Z" fill="#FFC400"/><path class="stw" style="animation-delay:0.6s" d="M182 27 Q182 34 189 34 Q182 34 182 41 Q182 34 175 34 Q182 34 182 27Z" fill="#FF8FAB"/><path class="stw" style="animation-delay:1.1s" d="M176 94 Q176 100 182 100 Q176 100 176 106 Q176 100 170 100 Q176 100 176 94Z" fill="#14C7D8"/></svg></span><div class="bubble" id="say">Mình đang mở file cho bạn…</div></div>
  <div id="list" aria-live="polite"><div class="card"><div class="state"><div class="big spin" aria-hidden="true">🐣</div>Đang tải...</div></div></div>
  <footer class="vf"><b>VeduAI</b> – Vietnam Education AI Solutions<br>Hỗ trợ: Admin <a href="tel:0984048177">0984048177</a> (Telegram/Zalo)</footer>
</div>
<script>
// Địa chỉ n8n (cùng domain ngrok với các trang khác). Trang này tự thêm header bỏ qua màn hình cảnh báo của ngrok,
// nên mở link trong Zalo vẫn xem được hình và nghe được giọng đọc.
const API = 'https://devotee-outclass-couch.ngrok-free.dev/webhook/vedu-media';
const H = { 'ngrok-skip-browser-warning': '1' };
const MIME = { p: 'image/png', j: 'image/jpeg', a: 'audio/mpeg', w: 'audio/wav' };
const say = m => { document.getElementById('say').textContent = m; };
const list = document.getElementById('list');
const ids = (new URLSearchParams(location.search).get('f') || '').split(/[,+\s]+/)
  .map(s => s.replace(/[^A-Za-z0-9]/g, '').toLowerCase()).filter(s => /^[pjaw][a-z0-9]{12,36}$/.test(s)).slice(0, 4);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function stateCard(icon, title, sub, cls, retry) {
  const c = el('div', 'card'), s = el('div', 'state');
  s.append(el('div', 'big', icon), el('div', 't ' + (cls || ''), title));
  if (sub) s.append(el('div', 'muted', sub));
  if (retry) { const b = el('button', 'btn main', 'Thử lại'); b.type = 'button'; b.style.marginTop = '14px'; b.onclick = start; s.append(b); }
  c.append(s); return c;
}
function show(node) { list.replaceChildren(...(Array.isArray(node) ? node : [node])); }

async function layFile(id) {
  const r = await fetch(API + '?f=' + id, { headers: H });
  if (r.status === 404) { const e = new Error('het'); e.het = true; throw e; }
  if (!r.ok) throw new Error('http ' + r.status);
  const buf = await r.arrayBuffer();
  if (!buf.byteLength) { const e = new Error('rong'); e.het = true; throw e; }
  return URL.createObjectURL(new Blob([buf], { type: MIME[id[0]] }));
}
function cardHinh(url, id) {
  const c = el('div', 'card'); c.append(el('h2', '', '📐 Hình minh họa'));
  const st = el('div', 'stage'), im = el('img'); im.src = url; im.alt = 'Hình minh họa câu hỏi'; st.append(im); c.append(st);
  const row = el('div', 'row');
  const open = el('a', 'btn main', '🔍 Mở to'); open.href = url; open.target = '_blank'; open.rel = 'noopener';
  const dl = el('a', 'btn', '⬇️ Lưu ảnh'); dl.href = url; dl.download = 'hinh-' + id + (id[0] === 'j' ? '.jpg' : '.png');
  row.append(open, dl); c.append(row); return c;
}
function cardVoice(url, id) {
  const c = el('div', 'card'); c.append(el('h2', '', '🔊 Giọng đọc'));
  const st = el('div', 'stage'), au = el('audio'); au.controls = true; au.preload = 'auto'; au.src = url; st.append(au); c.append(st);
  const row = el('div', 'row');
  const pl = el('button', 'btn main', '▶️ Nghe ngay'); pl.type = 'button';
  pl.onclick = () => { if (au.paused) { au.play().catch(() => { hint.textContent = 'Trình duyệt chưa cho phát tự động, bạn bấm nút ▶ trên thanh âm thanh nhé.'; }); } else au.pause(); };
  au.onplay = () => { pl.textContent = '⏸ Tạm dừng'; }; au.onpause = au.onended = () => { pl.textContent = '▶️ Nghe ngay'; };
  const dl = el('a', 'btn', '⬇️ Tải về'); dl.href = url; dl.download = 'giong-doc-' + id + (id[0] === 'w' ? '.wav' : '.mp3');
  row.append(pl, dl); c.append(row);
  const hint = el('p', 'hint', 'Nếu không nghe thấy tiếng, bạn kiểm tra nút gạt im lặng hoặc âm lượng của điện thoại.'); c.append(hint);
  return c;
}
async function start() {
  if (!ids.length) { say('Ối, link chưa đúng rồi!'); return show(stateCard('🔍', 'Link chưa đúng', 'Bạn quay lại Zalo và mở link mới nhất do bot gửi nhé.', 'err')); }
  show(stateCard('🐣', 'Đang tải...')); say('Mình đang mở file cho bạn…');
  const cards = []; let het = 0, loi = 0;
  for (const id of ids) {
    try { const u = await layFile(id); cards.push(/[pj]/.test(id[0]) ? cardHinh(u, id) : cardVoice(u, id)); }
    catch (e) { if (e.het) het++; else loi++; }
  }
  if (cards.length) { show(cards); say(cards.length > 1 ? 'Đây là hình và giọng đọc của bạn nè 👇' : (/[pj]/.test(ids[0][0]) ? 'Hình minh họa của bạn đây 👇' : 'Bạn nghe giọng đọc nhé 👇')); return; }
  if (loi) { say('Mạng đang chập chờn…'); return show(stateCard('📡', 'Không kết nối được', 'Kiểm tra mạng rồi bấm Thử lại.', 'err', true)); }
  say('Ối, file này không còn rồi!'); show(stateCard('⏰', 'Link không còn hiệu lực', 'Bạn nhắn lại câu hỏi cho bot trong Zalo để nhận link mới nhé.', 'err'));
}
start();
</script>
</body>
</html>
